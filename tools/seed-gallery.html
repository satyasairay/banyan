function buildLeafGeometry(S) {
  const Bl = S.foliage.blade;
  const L = Bl.length, outline = Bl.outline || "ovate";
  const LSEG = outline === "lobed" ? 14 : 8, WSEG = 5;
  const maxHW = L * Bl.widthRatio;
  const keel = Bl.keel ?? 0.34, recurve = Bl.recurve ?? 0.38;
  const droop = Bl.droop ?? 0.16, lift = Bl.lift ?? 0.03;
  const nLobes = Bl.lobes ?? 4;
  const halfWidth = (u) => {
    if (outline === "lobed") {
      const env = Math.pow(Math.sin(Math.PI * Math.pow(u, 0.9)), 0.55);
      const sinu = 0.68 + 0.32 * Math.pow(Math.abs(Math.sin(Math.PI * u * nLobes)), 0.8);
      return maxHW * env * sinu;
    }
    if (outline === "narrow")
      return maxHW * Math.pow(Math.sin(Math.PI * u), 0.45);
    if (outline === "needle")
      return maxHW * (1 - u * 0.85);
    return maxHW * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.78)), 0.72);
  };
  const pos = [], uv = [], idx = [];
  for (let iu = 0; iu <= LSEG; iu++) {
    const u = iu / LSEG;
    const hw = halfWidth(u);
    for (let iv = 0; iv <= WSEG; iv++) {
      const v01 = iv / WSEG;
      const v = v01 * 2 - 1;
      const av = Math.abs(v);
      const x = u * L;
      const z = v * hw;
      let y = 0;
      y += av * hw * keel;
      y -= THREE4.MathUtils.smoothstep(av, 0.55, 1) * hw * recurve;
      y -= u * u * L * droop;
      y += (1 - u) * (1 - u) * L * lift;
      pos.push(x, y, z);
      uv.push(u, v01);
    }
  }
  for (let iu = 0; iu < LSEG; iu++) for (let iv = 0; iv < WSEG; iv++) {
    const a = iu * (WSEG + 1) + iv, b = a + WSEG + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE4.BufferGeometry();
  g.setAttribute("position", new THREE4.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE4.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function gradeLeafColors(S, mesh, grade, baseOut, adjust = null) {
  const P = S.foliage.palette;
  const n = mesh.count;
  const col = new THREE4.Color();
  for (let i = 0; i < n; i++) {
    const g = i * 8;
    const sun = grade[g];
    let h = P.h + rrOf(grade[g + 1], -P.hJitter, P.hJitter) - sun * P.sunHue;
    let s = rrOf(grade[g + 2], P.s[0], P.s[1]);
    let l = P.lBase + sun * P.lSun + rrOf(grade[g + 3], -P.lJitter, P.lJitter);
    if (grade[g + 4] < P.senescent.rate) {
      h = rrOf(grade[g + 5], P.senescent.h[0], P.senescent.h[1]);
      s = rrOf(grade[g + 6], P.senescent.s[0], P.senescent.s[1]);
      l = rrOf(grade[g + 7], P.senescent.l[0], P.senescent.l[1]);
    }
    if (adjust) {
      h += adjust.hueShift || 0;
      s = clamp3(s * (adjust.satMul ?? 1), 0, 1);
      l = clamp3(l * (adjust.lightMul ?? 1), 0, 1);
    }
    col.setHSL(h, s, l, THREE4.SRGBColorSpace);

    baseOut[i * 3 + 1] = col.g;

function buildTuftGeometry(S) {
  const Bl = S.foliage.blade, T = S.foliage.tuft || {};
  const L = Bl.length;
  const needles = T.needles ?? 28;
  const spread = T.spread ?? 1.15;
  const halfW = Math.max(12e-4, L * Bl.widthRatio * 0.1);
  const GOLD = Math.PI * (3 - Math.sqrt(5));
  const pos = [], uv = [], idx = [];
  for (let i = 0; i < needles; i++) {
    const az = i * GOLD + ihash01(i * 7 + 1) * 0.7;
    const pol = spread * (0.28 + 0.72 * Math.sqrt(ihash01(i * 7 + 2)));
    const len = L * (0.7 + 0.6 * ihash01(i * 7 + 3));
    const dir = new THREE4.Vector3(Math.sin(pol) * Math.cos(az), Math.cos(pol), Math.sin(pol) * Math.sin(az));

    pos.push(dir.x * len, dir.y * len + tipY, dir.z * len);

}
function buildLeaves(S, anchors, material, leafCap = Infinity) {
  const P = S.foliage.palette;
  const N = Math.min(S.leafCount, leafCap);
  const leafGeo = S.foliage.system === "tufts" ? buildTuftGeometry(S) : buildLeafGeometry(S);

    leafMorph[i * 4 + 1] = ihash01(i * 11 + 2);
    leafMorph[i * 4 + 2] = ihash01(i * 11 + 3);

    const positions = [];
    const m = new THREE4.Matrix4();
    const xA = new THREE4.Vector3(), yA = new THREE4.Vector3(), zA = new THREE4.Vector3();
    const sc = new THREE4.Vector3();
    for (let i = 0; i < N; i++) {
      const a = anchors[Math.floor(rand() * anchors.length)];
      const t = a.t;
      const p1 = Math.abs(t.y) > 0.92 ? new THREE4.Vector3(1, 0, 0) : new THREE4.Vector3(0, 1, 0);
      const n1 = p1.clone().addScaledVector(t, -p1.dot(t)).normalize();
      const b1 = new THREE4.Vector3().crossVectors(t, n1);
      const ang = rr(0, Math.PI * 2);
      const radial = n1.clone().multiplyScalar(Math.cos(ang)).addScaledVector(b1, Math.sin(ang));
      const pos = a.p.clone().addScaledVector(t, rr(-0.02, 0.05)).addScaledVector(radial, rr(6e-3, 0.035));
      xA.copy(t).multiplyScalar(rr(0.35, 0.8)).addScaledVector(radial, rr(0.5, 1)).normalize();
      xA.y -= rr(0.05, 0.45);
      xA.normalize();
      const up = new THREE4.Vector3(rr(-0.18, 0.18), 1, rr(-0.18, 0.18)).normalize();
      zA.crossVectors(xA, up);
      if (zA.lengthSq() < 1e-4) zA.set(1, 0, 0).cross(xA);
      zA.normalize();
      yA.crossVectors(zA, xA);
      const s = rr(S.foliage.scale[0], S.foliage.scale[1]);
      m.makeBasis(xA, yA, zA);
      sc.set(s, s, s);
      m.scale(sc);
      m.setPosition(pos);
      leaves2.setMatrixAt(i, m);
      leafBranch[i] = a.id;
      positions.push(pos);
    }
    const centroid = new THREE4.Vector3();
    positions.forEach((p) => centroid.add(p));
    centroid.divideScalar(N);
    let maxR = 0, minY = 1e9, maxY = -1e9;
    for (const p of positions) {
      maxR = Math.max(maxR, Math.hypot(p.x - centroid.x, p.z - centroid.z));
      minY = Math.min(minY, p.y);
      maxY = Math.max(maxY, p.y);
    }
    for (let i = 0; i < N; i++) {
      const p = positions[i];
      const relR = clamp3(Math.hypot(p.x - centroid.x, p.z - centroid.z) / maxR, 0, 1);
      const relY = clamp3((p.y - minY) / (maxY - minY), 0, 1);
      const g = i * 8;
      leafGrade[g] = clamp3(relR * 0.6 + relY * 0.5 + rrOf(rand(), -0.18, 0.18), 0, 1);
      leafGrade[g + 1] = rand();
      leafGrade[g + 2] = rand();
      leafGrade[g + 3] = rand();
      leafGrade[g + 4] = rand();
      if (leafGrade[g + 4] < P.senescent.rate) {
        leafGrade[g + 5] = rand();
        leafGrade[g + 6] = rand();
        leafGrade[g + 7] = rand();
      } else {
        leafGrade[g + 5] = ihash01(i * 3 + 1);
        leafGrade[g + 6] = ihash01(i * 3 + 2);
        leafGrade[g + 7] = ihash01(i * 3 + 3);

  }

  if (leaves2.instanceColor) {
    leaves2.instanceColor.needsUpdate = true;
    leaves2.instanceColor.setUsage(THREE4.DynamicDrawUsage);
  }
  leaves2.computeBoundingSphere();
  return { leaves: leaves2, leafBranch, leafBaseColor, leafGrade };
}

// src/gallery.js
var CELL = 420;
var EXPORT = 1600;
var CURATED = [1892, 777, 42, 1, 5, 99, 1234, 4242, 31337, 271828, 314159, 999983];
var renderer = new THREE5.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(CELL, CELL);
renderer.setClearColor(16777215, 1);
renderer.toneMapping = THREE5.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE5.PCFSoftShadowMap;
var scene = new THREE5.Scene();
var camera = new THREE5.PerspectiveCamera(50, 1, 0.1, 100);
var key = new THREE5.DirectionalLight(16773602, 2.9);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.bias = -3e-4;
key.shadow.normalBias = 0.05;
scene.add(key);
scene.add(key.target);
var KEY_DIR = new THREE5.Vector3(4.2, 7.5, 3.2).normalize();
scene.add(new THREE5.HemisphereLight(15791354, 14275528, 0.5));
var pmrem = new THREE5.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
var shadowPlane = new THREE5.Mesh(
  new THREE5.PlaneGeometry(26, 26).rotateX(-Math.PI / 2),
  new THREE5.ShadowMaterial({ opacity: 0.12 })
);
shadowPlane.receiveShadow = true;
shadowPlane.renderOrder = 1;
scene.add(shadowPlane);
var fadePlane = new THREE5.Mesh(
  new THREE5.PlaneGeometry(26, 26).rotateX(-Math.PI / 2).translate(0, 15e-4, 0),
  new THREE5.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    uniforms: { uInner: { value: 2.1 }, uOuter: { value: 4.3 } },
    vertexShader: `varying vec3 vWp; void main(){ vec4 wp = modelMatrix*vec4(position,1.0); vWp = wp.xyz; gl_Position = projectionMatrix*viewMatrix*wp; }`,
    fragmentShader: `varying vec3 vWp; uniform float uInner,uOuter; void main(){ float a = smoothstep(uInner,uOuter,length(vWp.xz)); gl_FragColor = vec4(1.0,1.0,1.0,a); }`
  })
);
fadePlane.renderOrder = 2;
scene.add(fadePlane);
var leafMat = makeLeafMaterial();
var wood = null;
var leaves = null;
var barkMat = null;
function fitShadow(box) {
  const sphere = box.getBoundingSphere(new THREE5.Sphere());
  const c = sphere.center, r = Math.max(1, sphere.radius);
  const dist = Math.max(6, r * 2.2);
  key.position.copy(c).addScaledVector(KEY_DIR, dist);
  key.target.position.copy(c);
  key.target.updateMatrixWorld();
  const cam = key.shadow.camera, m = r * 1.06;
  cam.left = -m;
  cam.right = m;
  cam.top = m;
  cam.bottom = -m;
  cam.near = Math.max(0.5, dist - r * 1.2);
  cam.far = dist + r * 1.2 + Math.max(0, box.max.y) / Math.max(0.2, KEY_DIR.y);
  cam.updateProjectionMatrix();
}
function renderSeed(seed, leafCount, size) {
  if (renderer.domElement.width !== size) renderer.setSize(size, size);
  if (wood) {
    scene.remove(wood);
    wood.geometry.dispose();
    wood = null;
  }
  if (barkMat) {
    barkMat.dispose();
    barkMat = null;
  }
  if (leaves) {
    scene.remove(leaves);
    leaves.geometry.dispose();
    leaves = null;
  }
  const S = structuredClone(banyan_treespec_default);
  S.seed = seed;
  S.leafCount = leafCount;
  reseed(S.seed);
  const sk = growSkeleton(S);
  wood = new THREE5.Mesh(buildWoodGeometry(sk.branches, 26), barkMat = makeBarkMaterial(S));
  wood.castShadow = wood.receiveShadow = true;
  scene.add(wood);
  const built = buildLeaves(S, sk.anchors, leafMat);
  leaves = built.leaves;
  scene.add(leaves);
  wood.geometry.computeBoundingBox();
  leaves.computeBoundingBox();
  const box = wood.geometry.boundingBox.clone();
  if (leaves.count > 0) box.union(leaves.boundingBox);
  fitShadow(box);
  const sphere = box.getBoundingSphere(new THREE5.Sphere());
  const c = sphere.center;
  const dist = sphere.radius * 2.12;
  camera.position.set(c.x + dist * 0.52, c.y + dist * 0.3, c.z + dist * 0.82);
  camera.lookAt(c.x, c.y * 0.95, c.z);
  camera.updateProjectionMatrix();
  const sh = leafMat.userData.shader;
  if (sh) {
    const sun = key.position.clone().sub(key.target.position).normalize();
    sh.uniforms.uSunView.value.copy(sun.transformDirection(camera.matrixWorldInverse));
  }
  renderer.render(scene, camera);

}
var grid = document.getElementById("grid");
var nInput = document.getElementById("g-n");
var seedInput = document.getElementById("g-seeds");
var status = document.getElementById("g-status");
function parseSeeds() {
  const txt = seedInput.value.trim();
  if (txt) {
    const list = txt.split(/[\s,]+/).map((v) => parseInt(v, 10)).filter((v) => Number.isFinite(v));
    if (list.length) return list;
  }
  const n = Math.max(1, Math.min(64, parseInt(nInput.value, 10) || 12));
  const out = [...CURATED.slice(0, n)];
  while (out.length < n) out.push(Math.floor(Math.random() * 1e6));
  return out;
}
function exportPng(seed) {
  status.textContent = `rendering seed ${seed} at ${EXPORT}px\u2026`;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const canvas = renderSeed(seed, banyan_treespec_default.leafCount, EXPORT);
    canvas.toBlob((blob) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `banyan-seed-${seed}.png`;
      a.click();
      URL.revokeObjectURL(a.href);
      status.textContent = `saved banyan-seed-${seed}.png`;
    }, "image/png");
  }));
}
async function buildGrid() {
  grid.textContent = "";
  const seeds = parseSeeds();
  for (const seed of seeds) {
    const cellCanvas = document.createElement("canvas");
    cellCanvas.width = cellCanvas.height = CELL;
    const cell = document.createElement("figure");
    cell.className = "cell";
    const cap = document.createElement("figcaption");
    cap.textContent = `seed ${seed}`;
    cell.appendChild(cellCanvas);
    cell.appendChild(cap);
    cell.title = "click to export PNG";
    cell.addEventListener("click", () => exportPng(seed));
    grid.appendChild(cell);
    status.textContent = `growing seed ${seed}\u2026`;
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    const src = renderSeed(seed, banyan_treespec_default.leafCount, CELL);
    cellCanvas.getContext("2d").drawImage(src, 0, 0);
  }
  status.textContent = `${seeds.length} seeds \u2014 click any cell to export a ${EXPORT}px PNG`;
}
document.getElementById("g-grow").addEventListener("click", buildGrid);
window.gallery = { renderSeed, buildGrid, exportPng, CURATED };
buildGrid();
