    window.__treeBootFail=()=>{if(!box)return;box.hidden=false;msg.textContent='The tree renderer stopped before its first frame. This is a loading or browser error, not a verdict on your hardware. Reload once; if it repeats, check the browser console.';retry.hidden=false};
    let watchdog=setTimeout(window.__treeBootFail,8000);window.__treeBootReady=()=>clearTimeout(watchdog);
    // while the programs compile off the main thread the 8 s budget does not apply; 60 s does
    window.__treeBootPending=()=>{clearTimeout(watchdog);watchdog=setTimeout(window.__treeBootFail,60000)};
    addEventListener('error',window.__treeBootFail);addEventListener('unhandledrejection',window.__treeBootFail);
    retry.addEventListener('click',()=>location.reload());
  })();

<script type="module">
import * as THREE from 'three';

/* ================= SHADOW SOFTNESS, WITHOUT PAYING FOR TAPS =====

   Measured, on the reference GPU, over a 30-second orbit:

     1024 map, PCFSoftShadowMap  (the shipped build)            52 fps
     2048 map, PCFShadowMap radius 5                            31 fps
     1024 map, PCFShadowMap radius 3                            33 fps
      512 map, PCFSoftShadowMap                                 23 fps  (*)

   PCFShadowMap is 17 shadow-map fetches per lit fragment; PCFSoftShadowMap is
   9. On a scene this fill-bound that difference is a third of the frame, and
   both PCF configurations broke the 45 fps floor. Both were backed out.
   (*) the 512 run also lost the shadows entirely — at 38 mm per texel the
   normalBias needed to suppress acne pushes the whole shadow off its caster.

   What actually needed changing was never the tap COUNT. three.js fixes the
   PCF_SOFT kernel at exactly one texel and ignores light.shadow.radius (that
   is a PCF-only uniform), so `Qx.soft` — declared in the quality table since
   r4 — had never controlled anything, and at 19 mm per texel a leaf edge
   completed in one or two of them. This widens the SAME nine taps instead:
   the bilinear snap is untouched, dx/dy are scaled, and the cost is identical.

   Written against the vendored r165 chunk and guarded: if either substitution
   fails to match, the pristine chunk is restored and a warning is logged, so a
   Three.js bump degrades to the old look rather than to a broken shader.  */
/* SOFTER SHADOWS WERE REQUESTED, AND THE SHADOWS WERE
   ALREADY THE RIGHT SOFTNESS. Three attempts to widen the filter each made the
   picture worse, and the motivating arithmetic was wrong.

   THE ARITHMETIC FIRST, because everything else follows from it. The shadow-softness note
   below claimed "a 1024 map over a ~33 m shadow frustum is 32 mm per texel".
   The frustum is not 33 m. Read off the live shadow camera it is 19.56 m, so a
   texel is 19.1 mm. PCF_SOFT's taps run from -1 to +2 texels, a support of
   three texels — 57 mm. The sun subtends 0.53 degrees, so a canopy 8 m up
   throws a true penumbra of 8000 * tan(0.53 deg) = 74 mm. The shipped filter
   was at 77 % of physical, not at 30 % of it. There was no factor-of-three hole
   to fill; there was a 17 mm one.

   ATTEMPT 1 scaled dx/dy inside the PCF_SOFT branch. Wrong: PCF_SOFT is not a
   box blur with a spacing you can turn up, it is a BILINEAR RECONSTRUCTION. It
   snaps uv to the texel grid

       vec2 f = fract( uv * shadowMapSize + 0.5 );  uv -= f * texelSize;

   and then uses f — the sub-texel position AT THE ORIGINAL TEXEL SIZE — as the
   mix() weight between taps at -dx and +2dx. Scale dx and the weights no longer
   correspond to the tap positions: not a wider blur, a mis-weighted nine-tap
   that can SHARPEN a transition and band. The measurements show exactly that.

   ATTEMPT 2 replaced the branch with nine equal-weight taps on a disc of
   radius r. Also wrong, for a reason worth stating plainly:

       float texture2DCompare( sampler2D depths, vec2 uv, float compare ) {
         return step( compare, unpackRGBAToDepth( texture2D( depths, uv ) ) );
       }

   That is a POINT SAMPLE of a depth-packed RGBA texture followed by a binary
   step. There is no hardware comparison filtering — one tap carries exactly one
   texel of information — so a nine-tap disc is honest only while its taps stay
   about a texel apart, which for that layout is r <= 1.7. Past that it ALIASES
   rather than blurs. The measurements said so before I understood why: the
   conditioned edge gradient rose at r = 2.6 and would not fall at 5 or 8, and
   the r = 8 frame had traded the dapple for a flat wash.

   ATTEMPT 3 wrote no shader at all. The stock SHADOWMAP_TYPE_PCF branch lays 17
   taps at -r, -r/2, +r/2, +r, driven by the shadowRadius uniform — that is,
   by light.shadow.radius, which PCF_SOFT ignores. At radius 2 that is +/-2
   texels with taps exactly one texel apart: correctly sampled, and 76 mm, which
   is the physical penumbra to within 3 %. It cost about 1 fps. It also BANDS
   visibly, because an equal-weight box of 17 binary taps can only return
   multiples of 1/17 and the tap grid is the texel lattice, so the ground breaks
   into rectangular plateaux. The measured p99 of the conditioned mask gradient lands
   on 0.058, which is 1/17 to two figures: the statistic had found the
   quantisation, not an edge. PCF_SOFT's bilinear reconstruction exists
   precisely to avoid this, and it is why it is the default.

   Restoring the stock filter cannot show shadows softer than the earlier
   baseline. So:

   ATTEMPT 4 — what ships. The three failures above are not three bad guesses,
   they are three CONSTRAINTS, and together they pin the design down to one
   shape:

     (a) taps must be at most one texel apart, or a point-sampled binary field
         aliases                                            [attempt 2]
     (b) weights must vary CONTINUOUSLY with sub-texel position, or the output
         is constant within a texel and the result plateaus — which is what
         banding IS                                         [attempt 3]
     (c) weights must match tap positions                   [attempt 1]

   PCF_SOFT satisfies all three and is only three texels wide. So keep all
   three and make it wider: sample the shadow map's OWN texel-centre lattice at
   one-texel spacing over 8x8, and weight each tap by a separable TRAPEZOID of
   radius R — flat within R-1, falling linearly to zero at R — centred on the
   true, unsnapped position. Taps one texel apart satisfies (a). The window is
   evaluated at (tap - exact uv), so every weight slides continuously as the
   camera moves and a tap entering or leaving the support does so AT WEIGHT
   ZERO: (b). And the weight of a tap is a function of where that tap actually
   is: (c).

   A trapezoid rather than a tent, because a tent is not actually softer. Its
   sigma is R/sqrt(6) = 0.816 texels at R = 2, against the stock three-texel
   box's 3/sqrt(12) = 0.866: same support, LESS blur, because a tent piles its
   weight in the middle. Measured, the tent came out sharper than the filter it
   replaced. The trapezoid at R = 2.5 is sigma 1.190 — 1.37x the stock blur —
   and it still vanishes at the support edge, which is the only property (b)
   actually needs.

   R comes from the shadowRadius uniform — light.shadow.radius, which the stock
   PCF_SOFT branch ignores and which is therefore free — so the preset ladder
   drives softness live, with no recompile and no second code path.

   8x8 IS THE MINIMUM GRID, and getting this wrong is how the tent above ended
   up sharper. The snap puts the base within one texel BELOW the sample, so
   covering (uv-R, uv+R) needs taps from -ceil(R) to +ceil(R)+1 — an asymmetric
   range, [-3, 4] for any R <= 3. An earlier build used [-2, 2], truncated the
   window on the plus side, and biased the kernel. SHADOW_RADIUS_MAX pins R to
   the range this grid covers so a later edit cannot silently truncate it again.

   R = 2.5 IS A TRADE, not a physical constant, and the honest version is: the
   stock filter was ALREADY close to physically correct, so any softening big
   enough to measure overshoots physics. Stock's three-texel support is 57 mm at
   19.1 mm/texel, 23 % under the 74 mm a canopy 8 m up throws; this window's
   five-texel step response is 96 mm, 30 % over it. The crown tops out near 9 m
   and stacked leaf layers throw wider than one leaf does, so 96 mm is inside
   the range a real canopy produces — but it is not "the physical value" and is
   not claimed as one. R = 2.0 is the physically exact setting, one number away
   in the QUALITY table, at about a fifth of the measured softening.

   COST IS NOT FREE: 64 fetches against the stock 9, and desktop `balanced`
   measured 54 -> 48 fps paired. The floor is 45, so this ships with three
   frames of margin — the thinnest number in this work, and worth knowing before
   anything else is added to the frame. Backed out: making the loop separable
   with early-out rows (~25 fetches instead of 64) measured 45, three WORSE,
   because branching around texture fetches diverges and blocks unrolling.

   Still guarded: if the branch markers are not found the pristine chunk is
   restored and a warning logged, so a Three.js bump degrades to the stock
   filter rather than to a broken shader.

   The one lever this still does NOT pull: the penumbra is CONSTANT, when a leaf
   8 m up and a pebble 5 cm up should not share one. That needs a blocker search
   (PCSS), which has a different budget. */
const SHADOW_CHUNK_PRISTINE=THREE.ShaderChunk.shadowmap_pars_fragment;
const SHADOW_RADIUS_MAX=2.5;
function shadowFilterRadius(k){return Math.min(SHADOW_RADIUS_MAX,Math.max(0,+k||0))}
/* Substitutes the whole PCF_SOFT branch, once, at module load. r <= 1 leaves the
   pristine chunk in place so ?shadow=soft is an honest control and the mobile
   preset is bit-for-bit what it was. */

const EB_HW_SHADOW_UNIFORM='uEbShadowDepth';
let hwShadowInstalled=false;
function installShadowTent(r,hw=false,taps=4,step=1.0){
  hwShadowInstalled=false;
  if(r<=1&&!hw){THREE.ShaderChunk.shadowmap_pars_fragment=SHADOW_CHUNK_PRISTINE;return true}
  const A='#elif defined( SHADOWMAP_TYPE_PCF_SOFT )',B='#elif defined( SHADOWMAP_TYPE_VSM )';
  const src=SHADOW_CHUNK_PRISTINE,i=src.indexOf(A),j=src.indexOf(B);
  if(i<0||j<0||j<i){
    console.warn('[v5/shadow-kernel] shadow kernel not patched (Three.js chunk changed shape) — keeping the stock filter');
    THREE.ShaderChunk.shadowmap_pars_fragment=SHADOW_CHUNK_PRISTINE;
    return false;
  }
  if(hw){
    const N=Math.max(2,Math.min(8,taps|0)),c=((N-1)/2).toFixed(2),st=Number(step).toFixed(2);
    const kern=`
			vec2 texelSize = vec2( 1.0 ) / shadowMapSize;
			float wsum = 0.0;
			float ebStep = ${st};
			shadow = 0.0;
			for ( int sy = 0; sy < ${N}; sy ++ ) {
				for ( int sx = 0; sx < ${N}; sx ++ ) {
					vec2 o = ( vec2( float( sx ), float( sy ) ) - ${c} ) * ebStep;
					float w = ( 1.0 - abs( float( sx ) - ${c} ) / ( ${c} + 1.0 ) ) * ( 1.0 - abs( float( sy ) - ${c} ) / ( ${c} + 1.0 ) );
					wsum += w;
					shadow += w * texture( ${EB_HW_SHADOW_UNIFORM}, vec3( shadowCoord.xy + o * texelSize, shadowCoord.z ) );
				}
			}
			shadow = wsum > 0.0 ? shadow / wsum : 1.0;
		`;
    THREE.ShaderChunk.shadowmap_pars_fragment='uniform highp sampler2DShadow '+EB_HW_SHADOW_UNIFORM+';\n'+src.slice(0,i+A.length)+kern+src.slice(j);
    hwShadowInstalled=true;
    return true;
  }
  const tent=`
			vec2 texelSize = vec2( 1.0 ) / shadowMapSize;
			float winR = clamp( shadowRadius, 1.0, ${SHADOW_RADIUS_MAX.toFixed(1)} );
			vec2 fpos = shadowCoord.xy * shadowMapSize;
			vec2 base = floor( fpos - 0.5 ) + 0.5;
			float wsum = 0.0;
			shadow = 0.0;
			for ( int sy = -3; sy <= 4; sy ++ ) {
				for ( int sx = -3; sx <= 4; sx ++ ) {
					vec2 tp = base + vec2( float( sx ), float( sy ) );
					vec2 wv = clamp( winR - abs( tp - fpos ), 0.0, 1.0 );
					float w = wv.x * wv.y;
					if ( w > 0.0 ) {
						wsum += w;
						shadow += w * texture2DCompare( shadowMap, tp * texelSize, shadowCoord.z );
					}
				}
			}
			shadow = wsum > 0.0 ? shadow / wsum : 1.0;
		`;
  THREE.ShaderChunk.shadowmap_pars_fragment=src.slice(0,i+A.length)+tent+src.slice(j);
  return true;
}
let shadowTentInstalled=false;
function applyShadowFilter(renderer,k){
  const r=shadowFilterRadius(k);
  /* The tent replaces the PCF_SOFT branch, so the map TYPE is PCF_SOFT either
     way and only the branch body differs. r <= 1 leaves it pristine, which is
     the CONTROL and is what the mobile preset keeps — ?shadow=soft pins it so
     before and after come from one build. Attempt 2 patched unconditionally, so
     its control tested the candidate against itself. */
  // the widened kernel (r > 1) runs on hardware compare wherever WebGL2 allows it
  const hw=r>1&&renderer.capabilities.isWebGL2&&Q.get('hwshadow')!=='0';
  shadowTentInstalled=installShadowTent(r,hw,4,1.0)&&r>1;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  window.__ebShadowRadiusTexels=r;   // QA: the radius actually in force, readable from a probe
  window.__ebShadowHw=hwShadowInstalled;   // QA: hardware compare in force
  return r;
}
/* the depth texture beside Three's packed map. Three only creates
   shadow.map when it is null, so creating it here — with a LINEAR, compare-mode
   depth texture attached — makes every later shadow pass write real depth
   next to the packed colour it already writes. Called at boot and wherever the
   old code set shadow.map = null. */
/* ONE depth texture for the life of the page. It is handed to every lit
   material as an ordinary uniform through THREE.ShaderLib (below), and
   Three's uniform layer already knows sampler2DShadow: it binds the texture
   with its compare mode on a unit of its own choosing, per draw — so there is
   nothing to patch per program and no unit to share. Three resizes a render
   target's depth texture itself when the target changes size, so the same
   object survives a preset change. */
let ebShadowDepthTex=null;
function ebShadowTarget(light,size){
  if(!hwShadowInstalled)return;
  if(light.shadow.map){light.shadow.map.dispose();light.shadow.map=null}
  if(!ebShadowDepthTex){
    ebShadowDepthTex=new THREE.DepthTexture(size,size);
    ebShadowDepthTex.type=THREE.UnsignedIntType;
    ebShadowDepthTex.minFilter=THREE.LinearFilter;ebShadowDepthTex.magFilter=THREE.LinearFilter;
    ebShadowDepthTex.compareFunction=THREE.LessEqualCompare;
    ebShadowDepthTex.name='sun.shadowDepth';
    // every lit material built after this line receives the sampler; Three clones

/* ================= L1b · age (stature) =================
   Pure spec transform: tree identity = f(seed, spec, ageYears) — deterministic.
   Allometry: height saturates early (m^.65), girth accumulates (m^1.1), crown
   scales with height, ornaments mature late (prop roots ~35yr+, aerials ~30yr+,
   fruit ~40yr+), young wood is smoother and litter thinner. Leaves stay
   full-size at every age — saplings carry adult leaves (true to botany, and it
   keeps the leaf-size contract). The reference age is 100. */
function applyAge(S,years){
  const m=clamp((years??100)/100,.2,1.2);
  if(Math.abs(m-1)<1e-6)return S;
  const hK=Math.pow(m,.65),rK=Math.pow(m,1.1),cK=Math.pow(m,.75),dK=.55+.45*m;
  const sc=(o,k,f)=>{if(o&&o[k]!=null)o[k]*=f};
  const scA=(o,k,f)=>{if(o&&o[k])o[k]=o[k].map(v=>v*f)};
  const T=S.trunk;T.height*=hK;T.r0*=rK;T.r1*=rK;sc(T,'wobble',dK);sc(T,'gnarl',dK);sc(T,'rootDepth',rK);
  const F=S.habit.field;F.base*=hK;F.amp*=hK;F.falloff*=(S.habit.form==='cone'?hK:hK*hK);
  sc(S.habit,'ceil',hK);sc(S.habit,'clampY',hK);
  if(S.habit.cascade){sc(S.habit.cascade,'riseRadius',cK);sc(S.habit.cascade,'drop',hK);sc(S.habit.cascade,'reach',cK)}
  const SC=S.scaffolds||{};sc(SC,'lowLen',cK);scA(SC,'upperLen',cK);scA(SC,'innerLen',cK);scA(SC,'apexLen',cK);
  if(SC.r1)for(const k in SC.r1)SC.r1[k]*=rK;
  const R=S.recursion;
  if(R){for(const k in R.lenByDepth)R.lenByDepth[k]=R.lenByDepth[k].map(v=>v*cK);
    for(const k in R.spacing)R.spacing[k]*=cK;
    sc(R,'minRadius',Math.max(.75,rK));sc(R,'stepLen',cK);
    if(R.gnarlByDepth)R.gnarlByDepth=R.gnarlByDepth.map(v=>v*dK);}
  const PR=S.propRoots;
  if(PR){const g=Math.max(0,(m-.35)/.65);PR.count=Math.round(PR.count*Math.pow(g,1.2));
    if(!PR.count)S.propRoots=null;
    else{PR.thick=Math.min(PR.thick,PR.count);PR.hug=Math.min(PR.hug,PR.count);
      PR.eligibility.minY*=hK;PR.eligibility.minRad*=cK;PR.eligibility.maxRad*=cK;
      scA(PR,'topR',rK);scA(PR,'thickR',rK);scA(PR,'thinR',rK);}}
  const AE=S.aerials;
  if(AE){const g=Math.max(0,(m-.3)/.7);AE.clusters=Math.round(AE.clusters*g);
    if(!AE.clusters)S.aerials=null;else{scA(AE,'len',cK);scA(AE,'r',rK);}}
  const SR=S.surfaceRoots;
  if(SR){scA(SR,'length',cK);scA(SR,'r0',rK);scA(SR,'startHeight',rK);sc(SR,'startOff',rK);scA(SR,'rootletLen',cK);}
  const FO=S.foliage;FO.count=Math.round(FO.count*Math.pow(m,1.5));
  const FR=S.fruit;
  if(FR){const g=Math.max(0,(m-.4)/.6);FR.count=Math.round(FR.count*g);if(!FR.count)S.fruit=null}
  const BL=S.blossom;if(BL)BL.count=Math.round(BL.count*Math.pow(m,1.2));
  if(S.strands){scA(S.strands,'len',cK);sc(S.strands,'stepLen',cK)}
  sc(S.bark,'bump',dK);
  if(S.litter)S.litter.count=Math.round(S.litter.count*m);
  const G=S.ground;if(G){sc(G,'mound',m);sc(G,'ripple',m)}
  return S;
}

/* ================= seasons (v4.9) =================
   A season is an OVERLAY on the cloned spec — applied after applyAge, before
   growth — exactly the applyAge discipline. 'live' (the default and the
   URL-less path) applies NOTHING, so the shipped hero look stays byte-identical.
   Evergreens (figs, magnolia, pine) keep winter foliage; deciduous species drop
   it — english oak is marcescent and clings to a fifth of its leaves, all brown.
   Environment moods (snow-pale soil, grass census, seasonal wind) are read from
   the active season by the scene layer. Zero new rng anywhere: counts and rates
   only, so a season is as deterministic as the tree wearing it. */

const SEASONS={

   follows tropical lush/dry canopy exchange; Southern Magnolia stays
   evergreen through flowering, leaf exchange and its cool season; Cherry alone
   uses four temperate seasons. Every `live` state is the approved hero unchanged. */
const PUBLIC_SEASONS={

  {id:'live',label:'Lush canopy'},
  {id:'dry',label:'Dry-season exchange'},

};
const publicSeasonOptions=id=>PUBLIC_SEASONS[id]||[];
const publicSeasonAllowed=(id,key)=>key==='live'||publicSeasonOptions(id).some(x=>x.id===key);

/* Species-resolved overlays. These replace—not merge with—the generic SEASONS
   profile, so tropical/evergreen phases cannot inherit cosmetic snow or temperate
   defoliation. Counts change; the branch graph does not. */
const SEASON_SPECIES={

  /* the dry-season exchange has to be READ as dry by a casual
     viewer, not measured. The old profile kept 92 % of the crown and nudged
     senescence to 3.5 %, so seed 863 lost 204 of 2 550 sprigs and still looked
     like high summer. Now: a hard density drop, twig ends deliberately left
     BARE (tipCover — see buildFoliage), the crown rebased onto the species'
     own senescent golds/browns, thinner grass and a heavy fall of leaf litter
     on the ground — the leaves the tree just dropped. STRUCTURE IS UNTOUCHED:
     "counts change; the branch graph does not", so the anchor table, the

/* `soft` is the PCF tap radius in TEXELS. 1 selects the stock

   the whole account, including the filter constraints).

   anyone reaches for either. The filter's reach is fixed in TEXELS, so a bigger

  const trunk={parent:-1,depth:0,kind:'trunk',pts:trunkPts,radii:trunkRadii,gnarl:S.trunk.gnarl,
    rope:S.trunk.rope||null,columns:trunkCols,flare:S.trunk.flare??1.15,
    lobes:S.trunk.lobes?{count:S.trunk.lobes.count,phase:rr(0,Math.PI*2),base:S.trunk.lobes.base,amp:S.trunk.lobes.amp,
      sharp:S.trunk.lobes.sharp,span:S.trunk.lobes.span,mode:'ground'}:null};
  const trunkId=reg(trunk);

  /* scaffolds */
  const GOLD=Math.PI*(3-Math.sqrt(5));
  {
    const SC=S.scaffolds||{};
    const nLow=SC.low??1,nUpper=SC.upper??5,nInner=SC.inner??0,nApex=SC.apex??3;
    const elevR=SC.elevation||[.3,.55];
    const lowLen=SC.lowLen??1.25,upperLen=SC.upperLen||[1.25,1.7],innerLen=SC.innerLen||[.8,1.2],apexLen=SC.apexLen||[.45,.7];
    const lowAt=SC.lowAt??.6,upperAt=SC.upperAt||[.8,1],innerAt=SC.innerAt||[.72,.96],innerElev=SC.innerElev||[.4,.7];
    const lowY=SC.lowElev??.28;
    const lowR0=SC.lowR0||[.42,.5],upperR0=SC.upperR0||[.5,.62],innerR0=SC.innerR0||[.42,.54],apexR0=SC.apexR0||[.42,.5];
    const upperStagger=SC.upperStagger===true,upperAtJitter=SC.upperAtJitter??.08,apexSpread=SC.apexSpread??.4;
    const SCR=SC.r1||{};   // stature: scaffold terminal radii were bonsai literals
    const az0=rr(0,Math.PI*2);
    // v4.4 architecture: habit.tiers {count,gap,jitter} quantizes scaffold dome-offsets to
    // STOREYS — each scaffold subtree keeps to its own canopy sheet, so the crown carries
    // layer after layer instead of upholstering one dome. Low limbs take the deepest storey,
    // the apex the top; uppers draw a storey each. Spec-gated: absent = the v4.1 continuous offsets.
    const TIERS=S.habit.tiers;
    const tierOff=(kind)=>{
      if(!TIERS)return (kind===0?rr(-.3,-.15):kind===1?rr(-.12,.15):rr(0,.1))*KD;
      const n=TIERS.count??3,gap=TIERS.gap??1.5,j=TIERS.jitter??.22;
      const t=kind===2?0:kind===0?n-1:Math.floor(rand()*n);
      return -t*gap+rr(-j,j);
    };
    for(let i=0;i<nLow;i++){
      const az=i===0?az0:az0+2.3*i+rr(-.3,.3);
      // v4.1: each low scaffold gets its own attach height, elevation and length —
      // an earlier build hung all of them off one point at one length (constructed tell).
      const lowT=Array.isArray(lowAt)
        ?lerp(lowAt[0],lowAt[1],clamp((i+.5)/nLow+rr(-.08,.08),0,1))
        :lowAt*rr(.86,1.1);
      const at=trunkPointAt(clamp(lowT,.08,.97));
      const d0=new V3(Math.cos(az),lowY*rr(.6,1.5),Math.sin(az)).normalize();
      scaffoldIds.push(growBranch({start:at.p.clone().addScaledVector(d0,-at.r*(S.physics?.junctionBackset??.55)),dir:d0,
        len:lowLen*rr(.82,1.16),r0:at.r*rr(lowR0[0],lowR0[1]),r1:SCR.low??.028,depth:1,parent:trunkId,wig:.1,steer:.8,domeOff:tierOff(0),attachS:at.s}));
    }
    for(let i=0;i<nUpper;i++){
      const az=az0+GOLD*(i+1)+rr(-.35,.35);
      const atT=upperStagger
        ?lerp(upperAt[0],upperAt[1],clamp((i+.5)/nUpper+rr(-upperAtJitter,upperAtJitter),0,1))
        :rr(upperAt[0],upperAt[1]);
      const at2=trunkPointAt(atT);
      const elev=rr(elevR[0],elevR[1]);
      const d=new V3(Math.cos(az)*Math.cos(elev),Math.sin(elev),Math.sin(az)*Math.cos(elev)).normalize();
      scaffoldIds.push(growBranch({start:at2.p.clone().addScaledVector(d,-at2.r*(S.physics?.junctionBackset??.55)),dir:d,
        len:rr(upperLen[0],upperLen[1]),r0:at2.r*rr(upperR0[0],upperR0[1]),r1:SCR.upper??.03,depth:1,parent:trunkId,wig:.1,steer:1,domeOff:tierOff(1),attachS:at2.s}));
    }
    // V5.3: short, height-staggered upper limbs carry fine branching across the inner
    // roof. They are not extra apex leaders and stay absent for every legacy spec.
    for(let i=0;i<nInner;i++){
      const az=az0+GOLD*(i+.35)+rr(-.45,.45);
      const atT=lerp(innerAt[0],innerAt[1],clamp((i+.5)/nInner+rr(-.08,.08),0,1));
      const at=trunkPointAt(atT),elev=rr(innerElev[0],innerElev[1]);
      const d=new V3(Math.cos(az)*Math.cos(elev),Math.sin(elev),Math.sin(az)*Math.cos(elev)).normalize();
      scaffoldIds.push(growBranch({start:at.p.clone().addScaledVector(d,-at.r*(S.physics?.junctionBackset??.55)),dir:d,
        len:rr(innerLen[0],innerLen[1]),r0:at.r*rr(innerR0[0],innerR0[1]),r1:SCR.inner??.025,depth:1,parent:trunkId,wig:.1,steer:1,
        domeOff:rr(-.12,.04)*KD,outMul:SC.innerOut??.35,attachS:at.s}));
    }
    for(let i=0;i<nApex;i++){
      const az=rr(0,Math.PI*2);
      const d=new V3(Math.cos(az)*apexSpread,1,Math.sin(az)*apexSpread).normalize();
      const at3=trunkPointAt(1);
      scaffoldIds.push(growBranch({start:at3.p.clone().addScaledVector(d,-at3.r*(S.physics?.junctionBackset??.5)),dir:d,
        len:rr(apexLen[0],apexLen[1]),r0:at3.r*rr(apexR0[0],apexR0[1]),r1:SCR.apex??.025,depth:1,parent:trunkId,wig:.1,steer:1,domeOff:tierOff(2),
        outMul:S.habit.apexHold??1,attachS:at3.s}));   // v4.5: the apex family roofs the core
    }
  }

  /* ============ stature physics: pipe model + gravity bending ============
     Both passes are STREAM-FREE (zero rng draws) — they run after all woody growth and
     before the root systems, so props/aerials/surface roots read the FINAL bent limbs.
     Mental model: thickness is a SUM (every node carries what hangs beyond it), and
     gravity is a sculptor (droop ∝ load × lever ÷ r⁴) that reaction wood pushes back up. */
  {
    const PH=S.physics||{};
    const woody=i=>{const k=branches[i].kind;return k==='trunk'||k==='branch'};
    const nB=branches.length;
    const kids=[];for(let i=0;i<nB;i++)kids.push([]);
    for(let i=0;i<nB;i++){const p=branches[i].parent;if(p>=0&&p<nB)kids[p].push(i)}
    const cums=branches.map(b=>arcTable(b.pts));

    /* --- pass 1 · pipe model: r(node)^e = tip^e + own distal twig mass + Σ children r0^e --- */
    if(PH.pipe!==false){
      const e=PH.pipeExp??2.35, tipR=PH.tipR??.005, twigK=PH.twigGain??.0015;
      const baseA=new Float64Array(nB);   // cross-section^e at each branch's base
      for(let i=nB-1;i>=0;i--){
        if(!woody(i))continue;
        const b=branches[i],cum=cums[i],n=b.pts.length,total=cum[n-1];
        const ch=kids[i].filter(c=>woody(c)).map(c=>({s:branches[c].attachS,a:baseA[c]}));
        const carryJunction=PH.junctionCarry===true,eps=Math.max(1e-6,total*1e-7);
        const nr=new Array(n);
        for(let j=0;j<n;j++){
          let a=Math.pow(tipR,e)+twigK*Math.max(0,total-cum[j]);   // own distal twigs+leaves
          for(const c of ch)if(carryJunction?c.s>=cum[j]-eps:c.s>cum[j])a+=c.a; // include exact-node support only for opted-in species
          nr[j]=Math.pow(a,1/e);
        }
        const supportedTip=carryJunction&&ch.some(c=>c.s>=total-eps);
        if(!supportedTip)nr[n-1]=Math.min(nr[n-1],tipR);   // an unsupported tip stays a twig
        baseA[i]=Math.pow(nr[0],e);
        b.radii=nr;
      }
      // normalize so the trunk base still honours the exact h:r0 spec
      const tb=branches[trunkId].radii[0];
      if(tb>1e-6){
        const f=S.trunk.r0/tb;
        for(let i=0;i<nB;i++)if(woody(i))branches[i].radii=branches[i].radii.map(r=>r*f);
        // strands hang off twigs — keep them proportional
        for(let i=0;i<nB;i++)if(branches[i].kind==='strand')branches[i].radii=branches[i].radii.map(r=>r*f);
      }
      // trunk spine radii feed the mesher's flare + the root-mound fn
      trunkRadii.length=0;
      for(let j=0;j<=N_T;j++)trunkRadii.push(branches[trunkId].radii[j]);
    }

    /* --- pass 2 · gravity bending (Euler-Bernoulli) + reaction wood --- */
    if(PH.bend!==false){
      // FLEX is a real compliance: dθ = FLEX·M·L·ds / r⁴ (M in r²·ds units). Trunks are
      // ~10⁴× stiffer than twigs at the same load, so this number is small by nature.
      const FLEX=PH.flex??3e-4, REACT=PH.react??.55, MAXSTEP=PH.maxStep??.08;
      const LEAFM=PH.leafMass??.9, LEAFR=PH.leafR??.05, TIPUP=PH.tipUp??0;
      // propped limbs: a banyan's aerial roots reach the soil and become pillars, so its
      // long horizontals STOP sagging at pillar height instead of folding to the ground.
      const FLOOR=PH.floorY??0, SUPPORT=PH.support??1.5, MINR=PH.minR??.02;
      const Y=new V3(0,1,0),q=new THREE.Quaternion(),ax=new V3(),lev=new V3();
      // subtree mass + centroid (reverse order: children are always registered after parents)
      const mass=new Float64Array(nB),cX=new Float64Array(nB),cY=new Float64Array(nB),cZ=new Float64Array(nB);
      const nodeM=[];
      for(let i=nB-1;i>=0;i--){
        const b=branches[i],cum=cums[i],n=b.pts.length;
        const nm=new Float64Array(n);
        let m=0,sx=0,sy=0,sz=0;
        for(let j=1;j<n;j++){
          const ds=cum[j]-cum[j-1],r=(b.radii[j]+b.radii[j-1])*.5;
          const dm=r*r*ds+(r<LEAFR?LEAFM*ds*r:0);   // wood volume + leafy twig load
          nm[j]=dm;m+=dm;sx+=b.pts[j].x*dm;sy+=b.pts[j].y*dm;sz+=b.pts[j].z*dm;
        }
        for(const c of kids[i]){const mc=mass[c];m+=mc;sx+=cX[c]*mc;sy+=cY[c]*mc;sz+=cZ[c]*mc}
        nodeM.push(null);nodeM[i]=nm;
        mass[i]=m;
        if(m>1e-12){cX[i]=sx/m;cY[i]=sy/m;cZ[i]=sz/m}
        else{cX[i]=b.pts[0].x;cY[i]=b.pts[0].y;cZ[i]=b.pts[0].z}
      }
      // O(n) matrix chain: rotations accumulate into one rigid transform per node, so a
      // subtree is transformed ONCE (by the matrix of the node it hangs from) instead of
      // once per ancestor node. Same physics, ~an order of magnitude less work.
      const M4=THREE.Matrix4,R=new M4(),Tr1=new M4(),Tr2=new M4();
      const rot=(pivot,axis,ang)=>{
        R.makeRotationAxis(axis,ang);
        Tr1.makeTranslation(pivot.x,pivot.y,pivot.z);
        Tr2.makeTranslation(-pivot.x,-pivot.y,-pivot.z);
        return R.premultiply(Tr1).multiply(Tr2);   // T(p) · Rot · T(-p)
      };
      const bendBranch=(i,Mp)=>{
        const b=branches[i],n=b.pts.length,cum=cums[i];
        const P0=b.pts.map(p=>p.clone().applyMatrix4(Mp));   // parent's accumulated transform
        const ch=kids[i].map(c=>({c,s:branches[c].attachS}));
        const Carr=[];for(let j=0;j<=n;j++)Carr.push(null);
        const C=new M4();   // identity: rotations accumulated INSIDE this branch
        if(b.kind==='trunk'||b.kind==='branch'){
          const nm=nodeM[i];
          const dM=new Float64Array(n+1),dX=new Float64Array(n+1),dY=new Float64Array(n+1),dZ=new Float64Array(n+1);
          for(let j=n-1;j>=1;j--){
            let m=dM[j+1],sx=dX[j+1]*dM[j+1],sy=dY[j+1]*dM[j+1],sz=dZ[j+1]*dM[j+1];
            m+=nm[j];sx+=P0[j].x*nm[j];sy+=P0[j].y*nm[j];sz+=P0[j].z*nm[j];
            for(const k of ch)if(k.s>=cum[j-1]&&k.s<cum[j]){
              const mc=mass[k.c];m+=mc;
              const cc=new V3(cX[k.c],cY[k.c],cZ[k.c]).applyMatrix4(Mp);
              sx+=cc.x*mc;sy+=cc.y*mc;sz+=cc.z*mc}
            dM[j]=m;
            if(m>1e-12){dX[j]=sx/m;dY[j]=sy/m;dZ[j]=sz/m}
          }
          const r0b=Math.max(b.radii[0],1e-5);
          const pj=new V3(),dc=new V3();
          // Carr[j] = product of the rotations applied at nodes BEFORE j — i.e. exactly the
          // transform that node j (and anything hanging off it) has experienced so far.
          for(let j=1;j<n;j++){
            Carr[j]=C.clone();
            if(j>=n-1)break;
            const Mm=dM[j];if(Mm<1e-9)continue;
            pj.copy(P0[j]).applyMatrix4(C);                       // node j, as it now stands
            dc.set(dX[j],dY[j],dZ[j]).applyMatrix4(C);            // distal centroid, likewise
            lev.set(dc.x-pj.x,0,dc.z-pj.z);
            const L=lev.length();if(L<1e-5)continue;
            const r=Math.max(b.radii[j],1e-4),ds=cum[j]-cum[j-1];
            // stiffness floor: real twigs are braced by their own leafy mass and by
            // neighbours — without it, r⁴ makes hair-thin tips fold to the ground.
            const rs=Math.max(r,MINR),stiff=rs*rs*rs*rs;
            let dth=FLEX*Mm*L*ds/stiff;
            // reaction wood: the thicker a limb grows, the more it hauls itself back up
            dth*=1-REACT*clamp(r/r0b,0,1);
            if(FLOOR>0)dth*=smoothstep(Math.min(pj.y,dc.y),FLOOR,FLOOR+SUPPORT);   // pillars take the load
            if(TIPUP&&j>n*.6)dth-=TIPUP*ds;            // gravitropism: young tips reach for light
            dth=clamp(dth,-MAXSTEP*.5,MAXSTEP);
            if(Math.abs(dth)<1e-6)continue;
            ax.crossVectors(lev.normalize(),Y).normalize();
            C.premultiply(rot(pj,ax,-dth));
          }
        }
        const IDENT=new M4();
        Carr[0]=IDENT;
        for(let j=1;j<=n;j++)if(!Carr[j])Carr[j]=Carr[j-1];
        for(let k=0;k<n;k++)b.pts[k].copy(P0[k]).applyMatrix4(Carr[k]);   // node k rides its own transform
        for(const k of ch){
          // A child's points are still in ORIGINAL coordinates, so it must inherit BOTH the
          // transform this branch inherited (Mp) AND the rotations accumulated inside this
          // branch up to the attach node: M_child = Carr[j] · Mp. Passing Carr[j] alone drops
          // Mp and detaches the subtree from its parent (deep branches flew off the limb).
          let j=1;while(j<n-1&&cum[j]<k.s)j++;
          bendBranch(k.c,new M4().multiplyMatrices(Carr[j],Mp));
        }
      };
      bendBranch(trunkId,new THREE.Matrix4());
      // NOTE: trunkPts IS branches[trunkId].pts (same array) — bending mutates it in
      // place, so there is nothing to republish. (Clearing it here once ate the spine.)
    }
    resolveAnchors();

    /* --- pass 3 · self-pruning: a forest tree sheds its shaded lower growth, which is
       WHY you can walk under one. Deterministic, stream-free: twigs that ended up below
       the canopy base lose their leaves, and the ones fully below it are dropped. --- */
    const CB=S.foliage.anchor.canopyBase??0;
    if(CB>0){
      const dead=new Set();
      for(let i=0;i<nB;i++){
        const b=branches[i];
        if(b.kind!=='branch'||b.depth<2)continue;
        let top=-1e9;for(const p of b.pts)if(p.y>top)top=p.y;
        if(top<CB)dead.add(i);
      }
      for(let i=0;i<nB;i++)if(dead.has(branches[i].parent))dead.add(i);   // children go with them
      for(const i of dead)branches[i].pruned=true;
      // v4.1: shedding leaves evidence — the topmost pruned branch on a living
      // parent keeps a short snag stub (deterministic, stream-free: ihash01 only).
      for(const i of dead){
        const b=branches[i];
        if(b.kind==='branch'&&b.parent>=0&&!dead.has(b.parent))
          b.stubN=2+((ihash01(i*31+7)*2)|0);   // keep 2–3 spine nodes
      }
      // strands (willow withes) are exempt: hanging BELOW the canopy base is their purpose.
      const keep=anchors.filter(a=>branches[a.id].kind==='strand'||(a.p.y>=CB&&!dead.has(a.id)));
      anchors.length=0;for(const a of keep)anchors.push(a);
    }
    // V5.3: an opted-in species may reserve one resolved anchor at every living terminal.
    // This is a distribution guarantee, not extra geometry: buildFoliage already visits
    // unique high-tip anchors before it spends the remaining fixed instance budget.
    const terminalGuarantee=Math.max(0,S.foliage.anchor.terminalGuarantee|0);
    if(terminalGuarantee){
      const liveChild=new Uint16Array(nB);
      for(let i=0;i<nB;i++){
        const b=branches[i],p=b.parent;
        if(b.kind==='branch'&&!b.pruned&&p>=0&&p<nB)liveChild[p]++;
      }
      for(let i=0;i<nB;i++){
        const b=branches[i];
        if(b.kind!=='branch'||b.pruned||b.depth<2||liveChild[i])continue;
        const P=b.pts,n=P.length;if(n<3)continue;
        const p=P[n-3].clone().lerp(P[n-2],.9);
        const t=P[n-2].clone().sub(P[n-3]);
        if(t.lengthSq()<1e-12)t.set(0,1,0);else t.normalize();
        const a={p,t,br:null,i:n-2,f:.9,id:i,depth:b.depth,tip:1,terminalCover:1};
        for(let k=0;k<terminalGuarantee;k++)anchors.push(a);
      }
    }
  }

  /* aerial prop roots (banyan) — curved columns with drift + ground grip */
  const PR=S.propRoots;
  if(PR){
    const cands=[];
    for(const sid of scaffoldIds){
      const br=branches[sid],cum=arcTable(br.pts),total=cum[cum.length-1];
      for(let tf=.4;tf<=.85;tf+=.15){
        const s=total*tf;
        let i=1;while(i<cum.length-1&&cum[i]<s)i++;
        const f=(s-cum[i-1])/Math.max(1e-6,cum[i]-cum[i-1]);
        const p=br.pts[i-1].clone().lerp(br.pts[i],f);
        const r=lerp(br.radii[i-1],br.radii[i],f);
        const rad=Math.hypot(p.x,p.z);
        if(p.y>PR.eligibility.minY&&rad>PR.eligibility.minRad&&rad<PR.eligibility.maxRad)
          cands.push({p,limbR:r,az:Math.atan2(p.z,p.x),parent:sid});
      }
    }
    // deterministic Fisher-Yates (no rand() in comparators)
    for(let i=cands.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));const t=cands[i];cands[i]=cands[j];cands[j]=t}
    const chosen=[];
    for(const minSep of PR.minAzimuthSep){
      for(const c of cands){
        if(chosen.length>=PR.count)break;
        if(chosen.includes(c))continue;
        let ok=true;
        for(const q of chosen){let d=Math.abs(c.az-q.az);d=Math.min(d,Math.PI*2-d);if(d<minSep){ok=false;break}}
        if(ok)chosen.push(c);
      }
      if(chosen.length>=PR.count)break;
    }
    let thickLeft=PR.thick;
    // 'hug' props: the radially-innermost drops land at the trunk base and read as
    // columns fused with the trunk mass (value sort only — no rand in comparator)
    const hugSet=new Set();
    if(PR.hug){
      const byRad=chosen.slice().sort((a,b)=>Math.hypot(a.p.x,a.p.z)-Math.hypot(b.p.x,b.p.z));
      for(let i=0;i<Math.min(PR.hug,byRad.length);i++)hugSet.add(byRad[i]);
    }
    const thickSet=PR.loadSort
      ?new Set(chosen.slice().sort((a,b)=>b.limbR-a.limbR).slice(0,PR.thick))
      :null;
    for(const c of chosen){
      const isThick=thickSet?thickSet.has(c):thickLeft-->0;
      const isHug=hugSet.has(c);
      const topR=rr(PR.topR[0],PR.topR[1]);
      const botR=(isThick?rr(PR.thickR[0],PR.thickR[1]):rr(PR.thinR[0],PR.thinR[1]))*(isHug?1.15:1);
      const drop=c.p.y,steps2=Math.max(10,Math.round(drop/(PR.stepLen??.09)));
      const pts=[c.p.clone()],radii=[Math.min(c.limbR*.9,PR.startRMax??.055)];
      const sd=branches.length*3.77;
      let gx,gz;
      if(isHug){const k=rr(.2,.4);gx=c.p.x*k;gz=c.p.z*k}
      else{const driftAz=rr(0,Math.PI*2),landingDrift=PR.landingDrift||[.05,.5],driftAmt=rr(landingDrift[0],landingDrift[1]);   // wider landings break the picket rhythm
        gx=c.p.x+Math.cos(driftAz)*driftAmt;gz=c.p.z+Math.sin(driftAz)*driftAmt}
      const gy=groundH(gx,gz);
      for(let i=1;i<=steps2;i++){
        const t=i/steps2;
        const bow=Math.sin(t*Math.PI)*rr(0,.001); // draw kept tiny+stable
        const sx=(fbm(pts[i-1].x*3+sd,t*4,pts[i-1].z*3,3)-.5)*(PR.wanderAmp??.09)*(PR.wanderK??1);
        const sz=(fbm(pts[i-1].x*3,t*4+sd,pts[i-1].z*3+2.2,3)-.5)*(PR.wanderAmp??.09)*(PR.wanderK??1);
        pts.push(new V3(
          lerp(c.p.x,gx,t*t*(3-2*t))+sx*Math.sin(t*Math.PI)+bow,
          lerp(c.p.y,gy,t),
          lerp(c.p.z,gz,t*t*(3-2*t))+sz*Math.sin(t*Math.PI)));
        radii.push(lerp(topR,botR,smoothstep(t,.4,.95))*(1+(fbm(t*5.5+sd,sd*.4,2.2,2)-.5)*.14));   // v4.1: calmer girth noise — no rocky bulges
      }
      pts.push(pts[steps2].clone().setY(gy-(PR.tailDepth??.11)));radii.push(botR*.78);
      const br={parent:c.parent,depth:1,kind:'prop',pts,radii,gnarl:PR.gnarl,

  // directly — a matte base that a separate synthetic glint then had to fake). One
  // coherent cuticle response: PBR specular carries the highlight.

     raises tile memory pressure across the whole frame rather than only where
     the leaves are. The mobile path drops it; the banyan is entire-margined
     and sets serr to [0,0], so on the shipping species this changes nothing
     visually at all and simply stops MSAA being demanded. */

      uCanC:canopyU.uCanC,uSunV:canopyU.uSunV,uSunC:canopyU.uSunC,uEnvI:canopyU.uEnvI,

      uVein:{value:new THREE.Vector3(FX.veinN??7,FX.veinCurve??.3,FX.veinTint??.45)},
      uUnderL:{value:FX.underL??1.1},

      .replace('#include <common>',`#include <common>
attribute vec3 aPO;attribute vec3 aAx;attribute float aLf;attribute vec4 aWind;attribute float aSen;
varying vec2 vLUv;varying float vLf;varying float vSen;
uniform float uT;uniform float uWind;uniform vec3 uWDir;uniform vec3 uCanC;
${GUST_GLSL}${LEAF_SWING_GLSL}`)
      .replace('#include <beginnormal_vertex>',`#include <beginnormal_vertex>

/* ================= CUT STONE =================

   Scene rocks are
   IcosahedronGeometry(size, 2): a geodesic sphere — twelve pentagonal nodes,
   the rest hexagons, 320 faces — with fbm displacement at 4.6-6 cycles per
   unit, which is far too low-frequency to disturb a lattice at that density.
   The lattice survives the displacement and the eye reads a football.

   More subdivision is the wrong answer and gives a smooth potato. Rock does
   not have a smooth surface at this scale; it has CLEAVAGE. A boulder is a
   volume that has been split along planes, so its surface is a small number of
   flat faces meeting at sharp arrises, sitting on a flat bedding plane where
   it split from its bed.

   So: intersect half-spaces. Start from a box, clip it by a deterministic set
   of planes, and keep the polygons. Every face is exactly planar, every edge
   is exactly an arris, the normals are per-face so nothing is smoothed across
   an edge, and the bedding plane is simply the first clip. About sixty
   triangles instead of 320, and no lattice to see.

   Deterministic: the planes come from the caller's own seeded stream. Props
   are not hashed by checksum() or geometry.report(); environmentChecksum()
   hashes prop POSITIONS and rotations, which are untouched. */
function cutStoneGeometry(size,rnd,{planes=11,flatten=.62,rough=.20,bed=.55}={}){
  const V3=THREE.Vector3;
  const S=size;
  // start from a box a little larger than the target, then cut it down
  const hx=S*1.16,hy=S*1.22*flatten,hz=S*1.06;
  const C=[[-hx,-hy,-hz],[hx,-hy,-hz],[hx,hy,-hz],[-hx,hy,-hz],
           [-hx,-hy, hz],[hx,-hy, hz],[hx,hy, hz],[-hx,hy, hz]].map(p=>new V3(...p));
  let faces=[[0,3,2,1],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]].map(f=>f.map(i=>C[i].clone()));
  const clip=(n,d)=>{
    // keep the half-space dot(n,p) <= d; collect the cut ring for the new face
    const out=[],ring=[];
    for(const poly of faces){
      const keep=[];
      for(let i=0;i<poly.length;i++){
        const a=poly[i],b=poly[(i+1)%poly.length];
        const da=n.dot(a)-d,db=n.dot(b)-d;
        if(da<=0)keep.push(a);
        if((da<0&&db>0)||(da>0&&db<0)){
          const t=da/(da-db);
          const p=a.clone().lerp(b,t);
          keep.push(p);ring.push(p);
        }
      }
      if(keep.length>=3)out.push(keep);
    }
    if(ring.length>=3){
      // order the cut ring about its own centroid, in the cutting plane
      const c=ring.reduce((s,p)=>s.add(p),new V3()).multiplyScalar(1/ring.length);
      const u=Math.abs(n.y)<.9?new V3(0,1,0).cross(n).normalize():new V3(1,0,0).cross(n).normalize();
      const v=n.clone().cross(u).normalize();
      const uniq=[];
      for(const p of ring){if(!uniq.some(q=>q.distanceToSquared(p)<1e-12))uniq.push(p)}
      uniq.sort((a,b)=>Math.atan2(v.dot(a.clone().sub(c)),u.dot(a.clone().sub(c)))
                      -Math.atan2(v.dot(b.clone().sub(c)),u.dot(b.clone().sub(c))));
      if(uniq.length>=3)out.push(uniq);
    }
    if(out.length>=4)faces=out;
  };
  // 1 · the BEDDING PLANE — flat, level, the face it split from its bed on
  clip(new V3(0,-1,0),S*bed*flatten);
  // a tilted crown clip, so the top is a broken face rather than the box's lid
  {const a=rnd()*Math.PI*2;
   clip(new V3(Math.cos(a)*.42,1,Math.sin(a)*.42).normalize(),S*(.84+rnd()*.20)*flatten);}
  // 2 · cleavage planes: uneven in count of "families", so the stone reads as
  //     split rather than as a tumbled pebble
  for(let i=0;i<planes;i++){
    const a=rnd()*Math.PI*2,z=rnd()*1.7-.72;
    const r=Math.sqrt(Math.max(0,1-z*z));
    const n=new V3(Math.cos(a)*r,z,Math.sin(a)*r).normalize();
    clip(n,S*(.78+rnd()*.30));
  }
  // 3 · a whisper of relief so the faces are not optically perfect glass
  const pos=[],nor=[];
  for(const poly of faces){
    if(poly.length<3)continue;
    const n=new V3().subVectors(poly[1],poly[0]).cross(new V3().subVectors(poly[2],poly[0]));
    if(n.lengthSq()<1e-14)continue;
    n.normalize();
    for(let i=1;i<poly.length-1;i++){
      for(const p of[poly[0],poly[i],poly[i+1]]){
        const j=(hashN(Math.round(p.x*997),Math.round(p.y*997),Math.round(p.z*997))-.5)*S*rough*.12;
        pos.push(p.x+n.x*j,p.y+n.y*j,p.z+n.z*j);
        nor.push(n.x,n.y,n.z);   // FLAT per face: the arrises stay sharp
      }
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  return g;
}
function makeStoneMat(h,s,l,mossy=.5){
  const mat=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(h,s,l),roughness:.9});

      .replace('#include <common>','#include <common>\nvarying vec3 vSP;')

  };
