/* ================= Earth & Moss ground system =================
   The first complete landscape ground. Everything below is DETERMINISTIC:
   independent mulberry32 streams derived from the tree's seed (the tree's
   own rng stream is never drawn from — Banyan 863's wood/foliage checksum
   is untouched), and the placement solver is a pure fixed-order search
   over (seed, rootLines). No Math.random anywhere. */

const EM_SPREAD=(seedG,salt)=>mulberry32(((seedG^salt)>>>0)||1);

/** Root proximity 0..1 at (x,z) against the build's rootLines — the same
    field the ground bake uses; shared by grass/pebble placement (nothing
    grows through a root) and the placement solver (nothing collides). */
function emRootProx(x,z,rootLines){
  let sh=0;
  if(rootLines)for(let q=0;q<rootLines.length;q+=3){
    const dx=x-rootLines[q],dz=z-rootLines[q+1],rr2=rootLines[q+2];
    const d2=dx*dx+dz*dz,reach=rr2*3.4+.05;
    if(d2<reach*reach){const k=1-Math.sqrt(d2)/reach;const s2=k*(.55+.45*k);if(s2>sh)sh=s2}
  }
  return sh;
}
/** Clearance in world units from (x,z) to the nearest woody contact EDGE
    (line centre minus its radius) — the placement solver's clearance metric. */
function emRootClearance(x,z,rootLines){
  let best=1e9;
  if(rootLines)for(let q=0;q<rootLines.length;q+=3){
    const d=Math.hypot(x-rootLines[q],z-rootLines[q+1])-rootLines[q+2]*1.15;
    if(d<best)best=d;
  }
  return best;
}

/** Earth & Moss grass — TUSSOCKS, not needles: clustered clumps of 4–14
    blades sharing a lean and a height family, kept out of the woody
    contact field, shorter in the tall frame's foreground ring so grass never
    fences the trunk. Reuses the proven 5-blade star geometry + wind hook. */
function buildGrassEM(groundH,rootLines,seedG,count,windU,pathK,clearK){
  if(count<=0)return null;
  const R=EM_SPREAD(seedG,0x5EED61);
  const pos=[],uvA=[],idx=[];
  for(let b=0;b<5;b++){
    const az=b/5*Math.PI*2+b*.7;
    const dx=Math.cos(az),dz=Math.sin(az);
    const w=.007,h=.075+.05*ihash01(b*3+1);
    const v0=pos.length/3;
    pos.push(-dz*w,0,dx*w, dz*w,0,-dx*w, dx*h*.28-dz*w*.4,h,dz*h*.28+dx*w*.4, dx*h*.35,h*1.25,dz*h*.35);
    uvA.push(0,0, 1,0, 0,.8, .5,1);
    idx.push(v0,v0+1,v0+2, v0+1,v0+3,v0+2);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvA,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.85,side:THREE.DoubleSide});
  mat.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,{uT:windU.uT,uWind:windU.uWind,uWDir:windU.uWDir});
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>',`#include <common>
attribute float aPh;
uniform float uT;uniform float uWind;uniform vec3 uWDir;`)
      .replace('#include <begin_vertex>',`#include <begin_vertex>
#ifdef USE_INSTANCING
{
  float sw=sin(uT*2.1+aPh)*0.5+sin(uT*3.7+aPh*1.7)*0.3;
  vec3 wl=transpose(mat3(instanceMatrix))*uWDir;
  transformed+=wl*(sw*uWind*0.05*uv.y*uv.y);
}
#endif`);
  };
  addHorizonMelt(mat);
  /* the old plan drew one tussock archetype at an even radial
     density, which produced the "thin uniform fringe". Now a deterministic
     SWARD FIELD (pure fbm of the world point — no rng, so it does not depend
     on the draw order) decides where grass actually wants to grow, and each
     accepted site takes one of three archetypes with its own blade count,
     height family and spread. The result is bare worked soil in some
     stretches and knee-deep clumps in others, which is what a root field
     under a shade tree looks like. */
  const sward=(x,z)=>{
    const n=fbm(x*.17+7.9,2.7,z*.17-4.3,3);      // broad patches, ~6 m
    const m=fbm(x*.53-21.5,5.1,z*.53+9.4,2);     // finer break-up, ~2 m
    return Math.max(0,Math.min(1,(n*.72+m*.28-.30)/.42));
  };
  // plan the tussocks first so the instance budget is exact
  const plan=[];
  const tusN=Math.max(3,Math.round(count/5.0));
  let guard=0;
  while(plan.length<tusN&&guard++<tusN*22){
    const a=R()*Math.PI*2;
    const r=1.9+13.4*Math.pow(R(),.62);
    const x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(emRootProx(x,z,rootLines)>.22){continue}          // never through a root
    if(pathK&&pathK(x,z)>.3){continue}                   // never on the trodden core
    if(clearK&&clearK(x,z)){continue}                    // never inside an excluded planting apron
    const sw=sward(x,z);
    if(R()>.14+sw*1.05)continue;                         // the sward field decides, not an even scatter
    if(r<5.2&&R()>.42)continue;                          // deep shade thins the lawn (humus apron)
    const fore=(r<3.6?.68:1)*(pathK&&pathK(x,z)>.1?.62:1);   // foreground + path margin: shorter, humbler
    // archetype: wisps on thin ground, true clumps where the sward is strong
    const kind=R()*.62+sw*.38;
    const A=kind<.34?{n:[2,4],h:[.52,.34],sp:.17}          // wisp
           :kind<.74?{n:[6,7],h:[.80,.55],sp:.30}          // tussock
                    :{n:[13,10],h:[1.15,.68],sp:.47};      // clump
    const n=A.n[0]+Math.floor(R()*R()*A.n[1]);
    const leanAz=R()*Math.PI*2,lean=.05+.20*R();
    const hFam=(A.h[0]+A.h[1]*R())*fore;
    plan.push({x,z,n,leanAz,lean,hFam,sp:A.sp});
  }
  let total=0;for(const t of plan)total+=t.n;
  if(!total)return null;
  const mesh=new THREE.InstancedMesh(g,mat,total);
  const aPh=new Float32Array(total);
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),sc=new THREE.Vector3(),col=new THREE.Color();
  let i=0;
  for(const t of plan){
    for(let k=0;k<t.n;k++){
      const oa=R()*Math.PI*2,orf=Math.pow(R(),.6),orr=orf*t.sp;
      const x=t.x+Math.cos(oa)*orr,z=t.z+Math.sin(oa)*orr;
      e.set(Math.cos(t.leanAz)*(t.lean+(R()-.5)*.05),R()*Math.PI*2,Math.sin(t.leanAz)*(t.lean+(R()-.5)*.05));
      q.setFromEuler(e);
      const s=.55+.5*R();
      // a clump is DOMED — tallest blades at its heart, shorter at
      // the rim — so a tussock reads as one plant, not a ring of spikes.
      const dome=1.18-.42*orf*orf;
      m.compose(new THREE.Vector3(x,groundH(x,z),z),q,sc.set(s,s*t.hFam*dome*(.78+.42*R()),s));
      mesh.setMatrixAt(i,m);
      col.setHSL(.19+.08*R(),.26+.26*R(),.19+.17*R(),THREE.SRGBColorSpace);
      mesh.setColorAt(i,col);
      aPh[i]=R()*Math.PI*2;
      i++;
    }
  }
  g.setAttribute('aPh',new THREE.InstancedBufferAttribute(aPh,1));
  mesh.count=i;
  mesh.instanceMatrix.needsUpdate=true;
  if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;
  return mesh;
}

/** Earth & Moss litter — wind-drifted CLUMPS beneath the canopy (banyan
    leaves gather where the last breeze left them), plus a sparse loose
    field; density follows the active season's litter count. */
function buildLitterEM(S,groundH,canopyR,seedG,count,windU){
  const L=S.litter||{h:[.07,.12],s:[.4,.6],l:[.22,.4],count:300};
  const N=count;
  if(N<=0)return null;
  const R=EM_SPREAD(seedG,0x1177E2);
  const LS=3,WS=2,Ln=.06,W=.027;
  const pos=[],nor=[],uvA=[],idx=[];
  for(let iu=0;iu<=LS;iu++){
    const u=iu/LS;
    for(let iv=0;iv<=WS;iv++){
      const v=iv/WS*2-1;
      const w=W*Math.pow(Math.sin(Math.PI*Math.pow(u,.8)),.7);
      pos.push(u*Ln,(u*u+v*v*.5)*.012+Math.abs(v)*w*.32,v*w);
      nor.push(0,1,0);
      uvA.push(u,iv/WS);
    }
  }
  for(let iu=0;iu<LS;iu++)for(let iv=0;iv<WS;iv++){
    const a=iu*(WS+1)+iv,b=a+WS+1;
    idx.push(a,b,a+1,b,b+1,a+1);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvA,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.9,side:THREE.DoubleSide});
  addHorizonMelt(mat);
  const mesh=new THREE.InstancedMesh(g,mat,N);
  mesh.receiveShadow=true;
  // drift clumps: leaf piles elongated along the prevailing breeze
  const wAz=Math.atan2(windU.uWDir.value.z,windU.uWDir.value.x);
  const K=5+Math.floor(R()*4);
  const clumps=[];
  for(let c=0;c<K;c++){
    const a=R()*Math.PI*2,r=(0.35+0.85*Math.sqrt(R()))*canopyR;
    clumps.push({x:Math.cos(a)*r,z:Math.sin(a)*r,s:.5+1.1*R(),w:.35+.65*R()});
  }
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),sc=new THREE.Vector3(),col=new THREE.Color();
  const nClump=Math.round(N*.7);
  for(let i=0;i<N;i++){
    let x,z;
    if(i<nClump){
      const C=clumps[i%K];
      const t=R(),along=(t*t*2-R())*C.s*1.6,side=(R()-.5)*C.s*C.w;
      x=C.x+Math.cos(wAz)*along-Math.sin(wAz)*side;
      z=C.z+Math.sin(wAz)*along+Math.cos(wAz)*side;
    }else{
      const a=R()*Math.PI*2,r=(0.3+1.55*Math.sqrt(R()))*canopyR*(0.8+.4*R());
      x=Math.cos(a)*r;z=Math.sin(a)*r;
    }
    e.set((R()-.5)*.6,R()*Math.PI*2,(R()-.5)*.6);
    q.setFromEuler(e);
    const s=(.6+.75*R())*(L.size??1);
    m.compose(new THREE.Vector3(x,groundH(x,z)+.005,z),q,sc.set(s,s,s));
    mesh.setMatrixAt(i,m);
    col.setHSL(L.h[0]+(L.h[1]-L.h[0])*R(),L.s[0]+(L.s[1]-L.s[0])*R(),L.l[0]+(L.l[1]-L.l[0])*R(),THREE.SRGBColorSpace);
    mesh.setColorAt(i,col);
  }
  mesh.instanceMatrix.needsUpdate=true;
  if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;
  return mesh;
}

/** Earth & Moss pebbles — low density, settled deeper (no perch-on-top),
    kept off the woody contact field. */
function buildPebblesEM(groundH,rootLines,seedG,count){
  if(count<=0)return null;
  const R=EM_SPREAD(seedG,0x9EBB1E);
  const g=new THREE.IcosahedronGeometry(.02,1);
  const pa=g.attributes.position;
  for(let i=0;i<pa.count;i++){
    const x=pa.getX(i),y=pa.getY(i),z=pa.getZ(i);
    const d=.75+.5*hashN(Math.round(x*997),Math.round(y*997),Math.round(z*997));
    pa.setXYZ(i,x*d,y*d*.62,z*d);
  }
  g.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.92});
  addHorizonMelt(mat);
  const mesh=new THREE.InstancedMesh(g,mat,count);
  mesh.castShadow=true;mesh.receiveShadow=true;
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),sc=new THREE.Vector3(),col=new THREE.Color();
  let i=0,guard=0;
  while(i<count&&guard++<count*10){
    const a=R()*Math.PI*2,r=1.1+12.4*Math.pow(R(),.8);
    const x=Math.cos(a)*r,z=Math.sin(a)*r;
    const e1=R()*3,e2=R()*3,e3=R()*3,s=.4+1.5*R(),l=.28+.2*R(),h1=.08+.04*R(),s1=.08+.1*R();
    if(emRootProx(x,z,rootLines)>.3)continue;
    e.set(e1,e2,e3);q.setFromEuler(e);
    m.compose(new THREE.Vector3(x,groundH(x,z)-.004,z),q,sc.set(s,s,s));
    mesh.setMatrixAt(i,m);
    col.setHSL(h1,s1,l,THREE.SRGBColorSpace);
    mesh.setColorAt(i,col);
    i++;
  }
  mesh.count=i;
  mesh.instanceMatrix.needsUpdate=true;
  if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;
  return mesh;
}

/* a handful of low set stones for the Stone & Gravel Grove — larger
   than gravel, half-set into the ground, deterministic per seed, clear of the
   roots and the trodden path. Reads as a tended, contemplative grove. */
function buildGroveStones(groundH,rootLines,seedG,pathK){
  const R=EM_SPREAD(seedG,0x57031E);
  const g=new THREE.IcosahedronGeometry(1,2);
  const pa=g.attributes.position;
  for(let i=0;i<pa.count;i++){
    const x=pa.getX(i),y=pa.getY(i),z=pa.getZ(i);
    const d=.78+.5*hashN(Math.round(x*511),Math.round(y*511),Math.round(z*511));
    pa.setXYZ(i,x*d,y*d*.5,z*d);            // low, flattened river boulders
  }
  g.computeVertexNormals();
  const mat=makeStoneMat(.08,.10,.5,.18);   // same material as the landscape stones
  const N=8;
  const mesh=new THREE.InstancedMesh(g,mat,N);
  mesh.castShadow=true;mesh.receiveShadow=true;
  const m=new THREE.Matrix4(),qn=new THREE.Quaternion(),e=new THREE.Euler(),v=new THREE.Vector3(),sc=new THREE.Vector3();
  let i=0,guard=0;
  while(i<N&&guard++<N*24){
    const a=R()*Math.PI*2,r=2.6+8.4*Math.pow(R(),.6);
    const x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(emRootProx(x,z,rootLines)>.25)continue;         // never through a root
    if(pathK&&pathK(x,z)>.25)continue;                 // never on the trodden core
    const s=.11+.15*R();
    e.set(R()*.4,R()*Math.PI*2,R()*.4);qn.setFromEuler(e);
    m.compose(v.set(x,groundH(x,z)-s*.30,z),qn,sc.set(s*(1+.4*R()),s*.7,s*(1+.4*R())));
    mesh.setMatrixAt(i,m);
    i++;
  }
  if(!i)return null;
  mesh.count=i;
  mesh.instanceMatrix.needsUpdate=true;
  mesh.userData.label='grove stones';
  return mesh;
}

/** Fine exposed surface rootlets near the flare — thin, half-buried,
    radial with wander; organic debris in the same pass. One merged mesh. */
function buildFineRootsEM(groundH,rootLines,S,seedG){
  const R=EM_SPREAD(seedG,0xF13E007);
  const geos=[];
  const r0=S.trunk.r0;
  const n=9+Math.floor(R()*5);
  for(let i2=0;i2<n;i2++){
    const az=R()*Math.PI*2;
    const start=r0*(1.25+R()*1.3);
    const len=.45+R()*.9;
    const rad=.014+R()*.02;
    const steps=6;
    const pts=[],radii=[];
    let wa=az;
    for(let s2=0;s2<=steps;s2++){
      const t=s2/steps;
      wa+=(R()-.5)*.55/steps*4;
      const rr=start+len*t;
      const x=Math.cos(wa)*rr,z=Math.sin(wa)*rr;
      // half-buried: the line rides just under the surface and surfaces in arcs
      const lift=Math.sin(t*Math.PI*(1+((i2%2)?1:0)))*rad*.9;
      pts.push(new THREE.Vector3(x,groundH(x,z)+rad*.25+lift,z));
      radii.push(rad*(1-.55*t));
    }
    const br={id:9000+i2,parent:-1,depth:0,kind:'root',pts,radii,gnarl:.3,lobes:null};
    geos.push(chunkGeo(tubeGeometry(br,10,groundH)));
  }
  // organic debris: a few short broken twigs among the litter
  for(let i2=0;i2<6;i2++){
    const az=R()*Math.PI*2,rr=1.4+R()*4.5;
    const x=Math.cos(az)*rr,z=Math.sin(az)*rr;
    const len=.12+R()*.22,rad=.008+R()*.008,dir=R()*Math.PI*2;
    const pts=[],radii=[];
    for(let s2=0;s2<=3;s2++){
      const t=s2/3;
      pts.push(new THREE.Vector3(x+Math.cos(dir)*len*t,groundH(x+Math.cos(dir)*len*t,z+Math.sin(dir)*len*t)+rad*.6,z+Math.sin(dir)*len*t));
      radii.push(rad*(1-.4*t));
    }
    geos.push(chunkGeo(tubeGeometry({id:9500+i2,parent:-1,depth:0,kind:'root',pts,radii,gnarl:.2,lobes:null},6,groundH)));
  }
  if(!geos.length)return null;
  // tubeGeometry emits color attributes; mergeSimple keeps pos/nor/uv only —
  // bake a quiet woody tint into a standard material instead.
  const mat=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.07,.26,.21),roughness:.95});
  mat.onBeforeCompile=sh2=>{
    sh2.vertexShader=sh2.vertexShader
      .replace('#include <common>','#include <common>\nvarying vec3 vFP;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\nvFP=position;');
    sh2.fragmentShader=sh2.fragmentShader
      .replace('#include <common>','#include <common>\nvarying vec3 vFP;'+NOISE_GLSL)
      .replace('#include <map_fragment>',`#include <map_fragment>
diffuseColor.rgb*=0.8+0.4*bnoise(vFP*vec3(9.0,40.0,9.0));`);
  };
  addHorizonMelt(mat);
  const mesh=new THREE.Mesh(mergeSimple(geos),mat);
  mesh.castShadow=true;mesh.receiveShadow=true;
  mesh.userData.label='surface rootlets';
  return mesh;
}

/* ================= Landscape grounds and the earthen approach =================
   Every stream is an independent mulberry32(seed ^ salt); no Math.random;
   placement is a fixed-order search. Earth & Moss retains its certified
   environment stream when the approach is 'none'. */

/* ---------- the earthen approach (compacted soil, not a road) ----------
   A quadratic arc from past the fog line to an apron short of the root
   field, entering from the DEFAULT VIEW frame's left or right. `anchorAz` is
   view azimuth, with DEFAULT_VIEW_AZ as the default, so "left" is left
   in that frame. Screen-left is an azimuth above the camera's.
   The field returns a HEIGHT DELTA (compaction + camber, faded to zero
   before the woody root field so the tree's own soil is never moved) and
   a CORENESS k(x,z) 0..1 that the ground shader and every planting
   builder read — compacted centre, sparse grass margin, no hard edge. */
function makeApproachField(side,anchorAz,rootR,seedG){
  const s=side==='left'?1:-1;
  const R=EM_SPREAD(seedG,0xA99A0AC^(s>0?0:0x5A5A));
  const azFar=anchorAz+s*(1.30+R()*.12);
  const azEnd=anchorAz+s*(.50+R()*.05);
  const rFar=30,rEnd=rootR*1.34+1.2;
  // the bend lives INSIDE the tall frame's visible ground band (the landscape
  // melt closes ~10 u out), so the walked line visibly enters from the
  // chosen side of the default view rather than from the camera's feet
  const azMid=anchorAz+s*(1.02+R()*.08),rMid=rEnd+(rFar-rEnd)*.22;
  const P0=[Math.cos(azFar)*rFar,Math.sin(azFar)*rFar];
  const P1=[Math.cos(azMid)*rMid,Math.sin(azMid)*rMid];
  const P2=[Math.cos(azEnd)*rEnd,Math.sin(azEnd)*rEnd];
  // fixed-order polyline of the arc + a little deterministic wander
  const N=64,pts=[];
  const w1=(R()-.5)*.9,w2=(R()-.5)*.9;
  for(let i=0;i<=N;i++){
    const t=i/N,u=1-t;
    let x=u*u*P0[0]+2*u*t*P1[0]+t*t*P2[0];
    let z=u*u*P0[1]+2*u*t*P1[1]+t*t*P2[1];
    const wob=Math.sin(t*Math.PI*2.2+w1*4)*w2*.6*Math.sin(t*Math.PI);
    const dx=2*(u*(P1[0]-P0[0])+t*(P2[0]-P1[0])),dz=2*(u*(P1[1]-P0[1])+t*(P2[1]-P1[1]));
    const dl=Math.hypot(dx,dz)||1;
    x+=-dz/dl*wob;z+=dx/dl*wob;
    pts.push([x,z,t]);
  }
  const width=t=>2.0-(2.0-1.18)*smoothstep(t,.25,.95);   // narrows toward the tree
  function core(x,z){
    let best=1e9,bt=0;
    for(let i=0;i<N;i++){
      const ax=pts[i][0],az2=pts[i][1],bx=pts[i+1][0],bz=pts[i+1][1];
      const abx=bx-ax,abz=bz-az2;
      const L2=abx*abx+abz*abz||1e-9;
      let tt=((x-ax)*abx+(z-az2)*abz)/L2;tt=tt<0?0:tt>1?1:tt;
      const px=ax+abx*tt,pz=az2+abz*tt;
      const d=Math.hypot(x-px,z-pz);
      if(d<best){best=d;bt=pts[i][2]+(pts[i+1][2]-pts[i][2])*tt}
    }
    const w=width(bt);
    let k=1-smoothstep(best,w*.42,w);
    // the approach ENDS at the apron: fade before the woody root field and
    // let the far end dissolve toward the fog line
    k*=smoothstep(Math.hypot(x,z),rootR*1.02,rootR*1.30);
    k*=1-smoothstep(Math.hypot(x,z),24,29);
    return k;
  }
  function delta(x,z){
    const k=core(x,z);
    if(k<=0)return 0;
    // compaction: the band settles ~3 cm; a slight centre camber keeps it
    // reading as trodden earth that sheds rain, not a cut trench
    return -( .034*Math.pow(k,1.35) - .011*Math.pow(k,3.2) );
  }
  const corridor=[];
  for(let i=4;i<=N-2;i+=5)corridor.push({x:pts[i][0],z:pts[i][1],r:width(pts[i][2])*.78});
  return{side,anchorAz,delta,k:core,corridor,
    end:{x:P2[0],z:P2[1]},far:{x:P0[0],z:P0[1]}};
}

/* ---------- Wild Meadow grass — long clustered tussocks that answer the
   breeze coherently (a gust moves a clump together, not 4 000 loose
   needles). Root-avoiding, path-avoiding, foreground-shortened. ---------- */
function buildGrassWM(groundH,rootLines,seedG,count,windU,pathK,clearK){
  if(count<=0)return null;
  const R=EM_SPREAD(seedG,0x33ADD0);
  const pos=[],uvA=[],idx=[];
  for(let b=0;b<7;b++){
    const az=b/7*Math.PI*2+b*.53;
    const dx=Math.cos(az),dz=Math.sin(az);
    const w=.0085,h=.17+.11*ihash01(b*5+3);
    const v0=pos.length/3;
    // three-segment blade: root → belly → arched tip (long grass bends)
    pos.push(-dz*w,0,dx*w, dz*w,0,-dx*w,
      dx*h*.18-dz*w*.62,h*.52,dz*h*.18+dx*w*.62,
      dx*h*.30+dz*w*.34,h*.86,dz*h*.30-dx*w*.34,
      dx*h*.46,h*1.06,dz*h*.46);
    uvA.push(0,0, 1,0, .12,.5, .3,.84, .5,1);
    idx.push(v0,v0+1,v0+2, v0+1,v0+3,v0+2, v0+2,v0+3,v0+4);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvA,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.82,side:THREE.DoubleSide});
  mat.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,{uT:windU.uT,uWind:windU.uWind,uWDir:windU.uWDir});
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>',`#include <common>
attribute float aPh;
uniform float uT;uniform float uWind;uniform vec3 uWDir;`)
      .replace('#include <begin_vertex>',`#include <begin_vertex>
#ifdef USE_INSTANCING
{
  // long-grass sway: slower harmonics, deeper bend, whole-tussock phase
  float sw=sin(uT*1.35+aPh)*0.55+sin(uT*2.30+aPh*1.13)*0.30+sin(uT*3.9+aPh*2.7)*0.10;
  vec3 wl=transpose(mat3(instanceMatrix))*uWDir;
  float bend=uv.y*uv.y*(0.6+0.4*uv.y);
  transformed+=wl*(sw*uWind*0.16*bend);
  transformed.y-=abs(sw)*uWind*0.05*uv.y*uv.y;   // a bent blade is a lower blade
}
#endif`);
  };
  addHorizonMelt(mat);
  const plan=[];
  const tusN=Math.max(3,Math.round(count/6.5));
  let guard=0;
  while(plan.length<tusN&&guard++<tusN*16){
    const a=R()*Math.PI*2;
    const r=2.0+13.6*Math.pow(R(),.58);
    const x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(emRootProx(x,z,rootLines)>.2)continue;             // never through a root
    if(clearK&&clearK(x,z))continue;                      // never inside an excluded planting apron
    const pk=pathK?pathK(x,z):0;
    if(pk>.3)continue;                                    // never on the trodden core
    if(r<5.0&&R()>.5)continue;                            // shade thins the sward
    const fore=r<3.4?.5:r<4.8?.74:1;                      // tall frame stays clear
    const margin=pk>.1?.62:1;                             // sparse, shorter path margin
    const n=6+Math.floor(R()*R()*15);                     // 6..20 blades
    const leanAz=R()*Math.PI*2,lean=.10+.16*R();          // a calmer lean
    // a CULTIVATED wildflower sward, not tall untended thatch. Its
    // height is roughly halved for the tall frame (untended grass reads as neglect).
    const hFam=(.50+.40*R())*fore*margin;
    const dry=R()<.12;                                    // far less straw — a tended sward
    const ph=R()*Math.PI*2;                               // tussock-coherent gust phase
    plan.push({x,z,n,leanAz,lean,hFam,dry,ph});
  }
  let total=0;for(const t of plan)total+=t.n;
  if(!total)return null;
  const mesh=new THREE.InstancedMesh(g,mat,total);
  const aPh=new Float32Array(total);
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),sc=new THREE.Vector3(),col=new THREE.Color();
  let i=0;
  for(const t of plan){
    for(let k=0;k<t.n;k++){
      const oa=R()*Math.PI*2,orr=Math.pow(R(),.55)*.36;
      const x=t.x+Math.cos(oa)*orr,z=t.z+Math.sin(oa)*orr;
      e.set(Math.cos(t.leanAz)*(t.lean+(R()-.5)*.07),R()*Math.PI*2,Math.sin(t.leanAz)*(t.lean+(R()-.5)*.07));
      q.setFromEuler(e);
      const s=.62+.55*R();
      m.compose(new THREE.Vector3(x,groundH(x,z),z),q,sc.set(s,s*t.hFam*(.85+.3*R()),s));
      mesh.setMatrixAt(i,m);
      if(t.dry&&R()<.7)col.setHSL(.105+.02*R(),.34+.14*R(),.46+.14*R(),THREE.SRGBColorSpace);
      else col.setHSL(.14+.06*R(),.30+.18*R(),.27+.14*R(),THREE.SRGBColorSpace);
      mesh.setColorAt(i,col);
      aPh[i]=t.ph+k*.11;                                  // clump moves together
      i++;
    }
  }
  g.setAttribute('aPh',new THREE.InstancedBufferAttribute(aPh,1));
  mesh.count=i;
  mesh.instanceMatrix.needsUpdate=true;
  if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;
  mesh.userData.label='meadow grass';
  return mesh;
}

/* ---------- Wild Meadow flowers — sparse deterministic clusters of small
   cream and warm-yellow heads on thin stems, sharing their cluster's gust
   phase so the meadow moves as weather, not as particles. ---------- */
function buildFlowersWM(groundH,rootLines,seedG,count,windU,pathK,clearK){
  if(count<=0)return null;
  const R=EM_SPREAD(seedG,0xF10E125);
  /* One head: a thin stem quad plus THREE crossed petal planes at the tip.
     Once the program finally linked, the head that
     appeared was an 8-12 cm slab on a 22 cm stalk, which reads as a signboard
     rather than an oxeye. The shader bug had hidden that for the whole of the
     wildflower feature's life. Real proportions now: a ~4 cm head on a 34 cm
     stem, three planes instead of two so the head is round from any azimuth,
     and uv.x running ACROSS the head so the fragment stage can seat a golden
     eye inside cream rays. uv.y keeps its meaning: < 0.7 stem, >= 0.8 head. */
  const pos=[],uvA=[],idx=[];
  const stemW=.0045,stemH=.34,rp=.021,hh=.013;
  pos.push(-stemW,0,0, stemW,0,0, -stemW*.6,stemH,0, stemW*.6,stemH,0);
  uvA.push(.5,0, .5,0, .5,.62, .5,.62);
  idx.push(0,1,2, 1,3,2);
  for(let k=0;k<3;k++){
    const rot=k*Math.PI/3,c=Math.cos(rot),s=Math.sin(rot);
    const v0=pos.length/3;
    pos.push(-c*rp,stemH-.002,-s*rp, c*rp,stemH-.002,s*rp, -c*rp,stemH+hh,-s*rp, c*rp,stemH+hh,s*rp);
    uvA.push(0,.8, 1,.8, 0,1, 1,1);
    idx.push(v0,v0+1,v0+2, v0+1,v0+3,v0+2);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvA,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.7,side:THREE.DoubleSide});
  mat.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,{uT:windU.uT,uWind:windU.uWind,uWDir:windU.uWDir});
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>',`#include <common>
attribute float aPh;attribute float aTint;varying float vTint;
varying vec2 vFlUv;
uniform float uT;uniform float uWind;uniform vec3 uWDir;`)
      .replace('#include <begin_vertex>',`#include <begin_vertex>
vTint=aTint;
// The head/stem cut is read from the
// geometry's own uv.y, which the FRAGMENT stage cannot see: a
// MeshStandardMaterial with no map never defines USE_UV, so three declares
// no vUv and the injected 'if(vUv.y<0.7)' failed to compile and killed the
// whole flower program. Carry the one scalar we need across ourselves,
// under a private name that can never collide with three's own vUv.
vFlUv=uv;
#ifdef USE_INSTANCING
{
  float sw=sin(uT*1.35+aPh)*0.55+sin(uT*2.30+aPh*1.13)*0.30;
  vec3 wl=transpose(mat3(instanceMatrix))*uWDir;
  transformed+=wl*(sw*uWind*0.11*uv.y*uv.y);
}
#endif`);
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>',`#include <common>
varying float vTint;varying vec2 vFlUv;
// a golden eye seated inside the rays — the one cue that turns a pale card
// into a recognisable oxeye / buttercup at meadow distance
vec3 petalRGB(){
  float dc=abs(vFlUv.x-0.5)*2.0;
  vec3 ray=vTint>0.5?vec3(1.00,0.965,0.86):vec3(1.00,0.86,0.36);
  vec3 eye=vTint>0.5?vec3(0.98,0.78,0.20):vec3(0.78,0.50,0.10);
  return mix(eye,ray,smoothstep(0.22,0.46,dc));
}`)
      .replace('#include <map_fragment>',`#include <map_fragment>
// stem stays green; the head carries the instance's petal colour
if(vFlUv.y<0.7)diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.23,0.34,0.16),0.9);
else diffuseColor.rgb=petalRGB();   // oxeye cream / meadow buttercup`)
      // A petal is one cell thick. Without a transmission term the heads that
      // stand in the tree's shade tonemap to a neutral grey card and stop
      // reading as flowers at all — the measured failure mode once the program
      // finally linked. A small self-lit fraction of the petal's OWN colour is
      // the standard stand-in for that translucency; the stem gets none.
      .replace('#include <emissivemap_fragment>',`#include <emissivemap_fragment>
if(vFlUv.y>=0.7)totalEmissiveRadiance+=petalRGB()*0.11;`);
  };
  addHorizonMelt(mat);
  const K=8+Math.floor(R()*7);
  const clusters=[];
  let guard=0;
  while(clusters.length<K&&guard++<K*20){
    const a=R()*Math.PI*2,r=3.2+10.5*Math.pow(R(),.7);
    const x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(emRootProx(x,z,rootLines)>.16)continue;
    if(pathK&&pathK(x,z)>.12)continue;
    if(clearK&&clearK(x,z))continue;                      // never inside an excluded planting apron
    clusters.push({x,z,n:4+Math.floor(R()*8),cream:R()<.62,ph:R()*Math.PI*2});
  }
  let total=0;for(const c of clusters)total+=c.n;
  total=Math.min(total,count);
  if(!total)return null;
  const mesh=new THREE.InstancedMesh(g,mat,total);
  const aPh=new Float32Array(total),aTint=new Float32Array(total);
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),sc=new THREE.Vector3();
  let i=0;
  for(const c of clusters){
    for(let k=0;k<c.n&&i<total;k++){
      const oa=R()*Math.PI*2,orr=Math.pow(R(),.6)*.55;
      const x=c.x+Math.cos(oa)*orr,z=c.z+Math.sin(oa)*orr;
      if(emRootProx(x,z,rootLines)>.2){continue}
      e.set((R()-.5)*.22,R()*Math.PI*2,(R()-.5)*.22);
      q.setFromEuler(e);
      const s=.8+.7*R();
      m.compose(new THREE.Vector3(x,groundH(x,z),z),q,sc.set(s,s*(.9+.5*R()),s));
      mesh.setMatrixAt(i,m);
      aPh[i]=c.ph+k*.09;
      aTint[i]=c.cream?1:0;
      i++;
    }
  }
  g.setAttribute('aPh',new THREE.InstancedBufferAttribute(aPh,1));
  g.setAttribute('aTint',new THREE.InstancedBufferAttribute(aTint,1));
  mesh.count=i;
  mesh.instanceMatrix.needsUpdate=true;
  mesh.userData.label='meadow flowers';
  return mesh;
}

/* ---------- Quiet Garden lawn — a tended sward: short, dense, even in
   colour, still grown in humble clumps (a mower evens height, not
   nature's clustering), parted around the roots and the approach. ---------- */
function buildLawnQG(groundH,rootLines,seedG,count,windU,pathK,clearK){
  if(count<=0)return null;
  const R=EM_SPREAD(seedG,0x9A2DE11);
  const pos=[],uvA=[],idx=[];
  for(let b=0;b<5;b++){
    const az=b/5*Math.PI*2+b*.7;
    const dx=Math.cos(az),dz=Math.sin(az);
    const w=.0065,h=.062+.026*ihash01(b*7+2);
    const v0=pos.length/3;
    pos.push(-dz*w,0,dx*w, dz*w,0,-dx*w, dx*h*.2-dz*w*.4,h,dz*h*.2+dx*w*.4, dx*h*.26,h*1.12,dz*h*.26);
    uvA.push(0,0, 1,0, 0,.8, .5,1);
    idx.push(v0,v0+1,v0+2, v0+1,v0+3,v0+2);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvA,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.86,side:THREE.DoubleSide});
  mat.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,{uT:windU.uT,uWind:windU.uWind,uWDir:windU.uWDir});
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>',`#include <common>
attribute float aPh;
uniform float uT;uniform float uWind;uniform vec3 uWDir;`)
      .replace('#include <begin_vertex>',`#include <begin_vertex>
#ifdef USE_INSTANCING
{
  float sw=sin(uT*2.1+aPh)*0.5+sin(uT*3.7+aPh*1.7)*0.3;
  vec3 wl=transpose(mat3(instanceMatrix))*uWDir;
  transformed+=wl*(sw*uWind*0.028*uv.y*uv.y);   // short blades barely stir
}
#endif`);
  };
  addHorizonMelt(mat);
  const plan=[];
  const tusN=Math.max(4,Math.round(count/4.2));
  let guard=0;
  while(plan.length<tusN&&guard++<tusN*14){
    const a=R()*Math.PI*2;
    const r=1.8+12.6*Math.pow(R(),.66);
    const x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(emRootProx(x,z,rootLines)>.24)continue;
    if(clearK&&clearK(x,z))continue;            // never inside an excluded planting apron
    const pk=pathK?pathK(x,z):0;
    if(pk>.22)continue;
    if(r<4.6&&R()>.62)continue;                 // the shade ring keeps bare earth
    const n=3+Math.floor(R()*R()*9);            // small tufts, densely repeated
    const leanAz=R()*Math.PI*2,lean=.04+.09*R();
    const hFam=.82+.34*R();                     // mown: a narrow height family
    plan.push({x,z,n,leanAz,lean,hFam,ph:R()*Math.PI*2});
  }
  let total=0;for(const t of plan)total+=t.n;
  if(!total)return null;
  const mesh=new THREE.InstancedMesh(g,mat,total);
  const aPh=new Float32Array(total);
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),sc=new THREE.Vector3(),col=new THREE.Color();
  let i=0;
  for(const t of plan){
    for(let k=0;k<t.n;k++){
      const oa=R()*Math.PI*2,orr=Math.pow(R(),.6)*.26;
      const x=t.x+Math.cos(oa)*orr,z=t.z+Math.sin(oa)*orr;
      e.set(Math.cos(t.leanAz)*(t.lean+(R()-.5)*.03),R()*Math.PI*2,Math.sin(t.leanAz)*(t.lean+(R()-.5)*.03));
      q.setFromEuler(e);
      const s=.6+.4*R();
      m.compose(new THREE.Vector3(x,groundH(x,z),z),q,sc.set(s,s*t.hFam*(.9+.2*R()),s));
      mesh.setMatrixAt(i,m);
      col.setHSL(.255+.045*R(),.30+.14*R(),.30+.09*R(),THREE.SRGBColorSpace);   // even, tended greens
      mesh.setColorAt(i,col);
      aPh[i]=t.ph+k*.2;
      i++;
    }
  }
  g.setAttribute('aPh',new THREE.InstancedBufferAttribute(aPh,1));
  mesh.count=i;
  mesh.instanceMatrix.needsUpdate=true;
  if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;
  mesh.userData.label='tended lawn';
  return mesh;
}

/* ---------- Quiet Garden planting — low clipped evergreen mounds set in
   two or three quiet beds around the root field, each with a few pale
   blossom accents. The collision-free planting solver defers to the
   reserved positions supplied in the occupied-position list. ---------- */
function buildShrubsQG(groundH,rootLines,seedG,taken,pathK){
  const R=EM_SPREAD(seedG,0x0B5C0DE);
  const grp=new THREE.Group();
  const leafM=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.30,.32,.20),roughness:.88});
  leafM.onBeforeCompile=sh=>{
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nvarying vec3 vQP;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\nvQP=position;');
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\nvarying vec3 vQP;'+NOISE_GLSL)
      .replace('#include <map_fragment>',`#include <map_fragment>
// clipped-foliage sparkle: tiny leaf facets, sun side lifted
float f=bnoise(vQP*26.0);
diffuseColor.rgb*=0.78+0.5*f;
diffuseColor.rgb=mix(diffuseColor.rgb,diffuseColor.rgb*vec3(1.12,1.18,0.9),smoothstep(0.55,0.9,bnoise(vQP*9.0)));`);
  };
  addHorizonMelt(leafM);
  const blossomG=[],blossomM=new THREE.MeshStandardMaterial({color:0xf3ead8,roughness:.6,side:THREE.DoubleSide});
  addHorizonMelt(blossomM);
  const bedN=2+(((seedG>>>3)%2));   // 2..3 beds
  const rds=[];
  if(rootLines)for(let q2=3;q2<rootLines.length;q2+=3)rds.push(Math.hypot(rootLines[q2],rootLines[q2+1]));
  rds.sort((a,b)=>a-b);
  const rootR=Math.max(rds.length?rds[Math.min(rds.length-1,Math.round(.9*(rds.length-1)))]:3.9,1.2);
  const bedAz=[DEFAULT_VIEW_AZ+1.55,DEFAULT_VIEW_AZ-1.35,DEFAULT_VIEW_AZ+2.6];
  let placedAny=false;
  for(let b=0;b<bedN;b++){
    const p=emPlace(groundH,rootLines,
      {az0:bedAz[b],r0:rootR*1.5+.9,rMax:rootR*1.5+4.0,clear:.45,sep:1.05,azSpan:1.5},taken);
    if(!p||p.fallback)continue;
    if(pathK&&pathK(p.x,p.z)>.06)continue;
    taken.push({x:p.x,z:p.z,r:1.05});
    const mounds=1+Math.floor(R()*2.4);
    for(let mI=0;mI<mounds;mI++){
      const ma=R()*Math.PI*2,mr=mI===0?0:.42+.34*R();
      const mx=p.x+Math.cos(ma)*mr,mz=p.z+Math.sin(ma)*mr;
      if(emRootProx(mx,mz,rootLines)>.18)continue;
      const rad=.34+.21*R();
      const g=new THREE.IcosahedronGeometry(rad,2);
      const pa=g.attributes.position,ph=R()*9;
      for(let vI=0;vI<pa.count;vI++){
        const x=pa.getX(vI),y=pa.getY(vI),z=pa.getZ(vI);
        const d=1+(fbm(x*5.2+ph,y*5.2,z*5.2,3)-.5)*.34;
        pa.setXYZ(vI,x*d,Math.max(y*d*.7,-rad*.5),z*d);
      }
      g.computeVertexNormals();
      const mesh=new THREE.Mesh(g,leafM);
      mesh.position.set(mx,groundH(mx,mz)+rad*.42-.05,mz);
      mesh.castShadow=mesh.receiveShadow=true;
      grp.add(mesh);
      placedAny=true;
      // a few pale blossom accents on the sunward crown of the mound
      const nB=4+Math.floor(R()*5);
      for(let bI=0;bI<nB;bI++){
        const az2=R()*Math.PI*2,el2=.5+R()*.9;
        const bx=mx+Math.cos(az2)*Math.cos(el2)*rad*.94,
              by=groundH(mx,mz)+rad*.42-.05+Math.sin(el2)*rad*.78,
              bz=mz+Math.sin(az2)*Math.cos(el2)*rad*.94;
        const q3=new THREE.PlaneGeometry(.068,.068);
        q3.rotateX(-Math.PI/2+(R()-.5)*.8);q3.rotateY(R()*Math.PI*2);
        q3.translate(bx,by,bz);
        blossomG.push(q3);
      }
    }
  }
  if(blossomG.length)grp.add(new THREE.Mesh(mergeSimple(blossomG),blossomM));
  if(!placedAny)return null;
  grp.userData.label='garden planting';
  return grp;
}

/* Deterministic landscape placement. */
const EM_HARD_GAP=.07;                     // a hand's width of daylight
const emHardOf=t=>(t.hard??t.r??0);
/** Deterministic collision-free placement: walk a FIXED candidate lattice
    (azimuth fans × radius steps, nearest-preferred order) and take the
    first candidate with enough clearance from every woody contact line,
    gentle enough slope, and separation from already-placed objects.
    Pure function of (rootLines, groundH, prefs, taken) — no rng. */
function emPlace(groundH,rootLines,pref,taken){
  const{az0,r0,rMax=r0+2.4,clear=.34,sep=.9,azSpan=1.35,hard=0,waive=null}=pref;
  let best=null;
  for(let ri=0;ri<10;ri++){
    const r=r0+ri*((rMax-r0)/9||.1);
    for(let ai=0;ai<13;ai++){
      const da=(ai===0?0:(ai%2?1:-1)*Math.ceil(ai/2)*(azSpan/6));
      const az=az0+da;
      const x=Math.cos(az)*r,z=Math.sin(az)*r;
      const cl=emRootClearance(x,z,rootLines);
      const g0=groundH(x,z);
      const slope=Math.max(Math.abs(groundH(x+.22,z)-g0),Math.abs(groundH(x,z+.22)-g0));
      let sepOk=true;
      for(const t of taken){
        const d=Math.hypot(x-t.x,z-t.z);
        const soft=(waive&&t.id&&waive.indexOf(t.id)>=0)?0:sep+t.r;
        if(d<Math.max(soft,hard+emHardOf(t)+EM_HARD_GAP))sepOk=false;
      }
      const score=cl-Math.abs(da)*.18-ri*.06-(slope>.16?1:0);
      if(cl>clear&&slope<=.16&&sepOk)return{x,z,az,clearance:cl,slope,fallback:false};
      if(!best||score>best.score)best={x,z,az,clearance:cl,slope,score,fallback:true};
    }
  }
  return best;   // honest fallback: the least-bad candidate, flagged
}


/* ================= L6 · scenes (data) ================= */

const SCENES={

   the phone gets 1.56x fewer pixels exactly when the drag floor is measured.
   Inert on a dpr-1 desktop. setInteracting() is a public handle a caller may use.
   This page's pointer events drive its camera and activity timer. */
let interacting=false;

/* checksum: FNV-1a over wood verts + foliage matrices — deterministic witness */
function checksum(){
  let h=0x811c9dc5;
  const mix=v=>{h^=(v|0)&0xff;h=Math.imul(h,0x01000193);h^=((v|0)>>>8)&0xff;h=Math.imul(h,0x01000193)};
  const pa=wood.geometry.attributes.position.array;
  for(let i=0;i<pa.length;i+=7)mix(Math.round(pa[i]*8192));
  if(foliage&&foliage.mesh.count){
    const ma=foliage.mesh.instanceMatrix.array;
    for(let i=0;i<ma.length;i+=5)mix(Math.round(ma[i]*8192));
  }
  return('00000000'+(h>>>0).toString(16)).slice(-8);
}

/* WHICH PATH. Measured on the reference desktop: the parallel path READS a
   warm Chrome program cache but never
   FILLS one, and a synchronous link is what fills it. So a returning visitor
   whose cache is warm is best served synchronously (0.2 s, and the cache stays
   warm), and a first-time visitor by the parallel path (3.9 s instead of 6.6,
   page responsive). Which visitor this is can be read from the cache itself:
   one small fixed program, linked synchronously here, takes ~1 ms warm and
   tens of milliseconds cold. */
function ebProgramCacheWarm(){
  try{
    const gl=renderer.getContext(),t0=performance.now();
    const vs=gl.createShader(gl.VERTEX_SHADER),fs=gl.createShader(gl.FRAGMENT_SHADER),pr=gl.createProgram();
    gl.shaderSource(vs,'attribute vec3 position;varying vec2 vUv;void main(){vUv=position.xy;gl_Position=vec4(position,1.0);}');
    gl.shaderSource(fs,'precision highp float;varying vec2 vUv;float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}'+
      'float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}'+
      'void main(){float a=0.0,w=0.5;vec2 p=vUv*8.0;for(int i=0;i<6;i++){a+=w*n(p);p=p*2.03+vec2(1.7,9.2);w*=0.5;}'+
      'vec3 c=vec3(a,a*a,sqrt(a));for(int j=0;j<4;j++){c=mix(c,c.gbr*vec3(0.9,1.1,1.0),n(p*float(j+1))*0.2);}gl_FragColor=vec4(c,1.0);}');
    gl.compileShader(vs);gl.compileShader(fs);gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
    const ok=gl.getProgramParameter(pr,gl.LINK_STATUS);
    gl.deleteProgram(pr);gl.deleteShader(vs);gl.deleteShader(fs);
    const ms=performance.now()-t0;
    mark('cache-probe:'+ms.toFixed(1)+'ms');

}
const finishBoot=()=>{if(bootCompiled)return;mark('compiled');renderer.render(scene,camera);bootCompiled=true;mark('first-frame');
  window.__treeBootReady?.();document.getElementById('boot-status').hidden=true};
/* SLICED. compileAsync() gave a faster first frame (3.9 s against
   6.6) but it neither reads a cold cache into a warm one nor fills it, so
   every later visit stayed at 2-4 s; and a link that repeats an already-linked
   source is de-duplicated in memory and never reaches the disk cache either
   (both measured). Only a genuinely cold synchronous
   link fills the cache. So a cold visit links synchronously, but one object's
   programs per animation frame with the boot overlay up, so the page is free
   between slices and the longest stall is one program, not all sixteen; and
   the next visit finds a warm cache and takes the single-frame path. */
function ebCompileSliced(done){
  /* Where the time actually goes: on Chrome the driver compiles every program
     in the background the moment it is linked (KHR_parallel_shader_compile),
     and the main thread only blocks when a program's link STATUS is first
     read — which Three does at first use, i.e. inside the first render, for
     all of them at once. So: issue every link now (fast), then read one
     program's status per animation frame. The driver compiles them all in
     parallel meanwhile; each slice waits only for its own program; the
     synchronous status read is what fills Chrome's program cache. */
  try{renderer.compile(scene,camera)}catch(e){}
  const progs=renderer.info.programs.slice();
  let i=0;
  /* TIME-BUDGETED, not one-per-frame. Measured on an iPhone 13: its driver
     compiled all seventeen programs inside the previous runtime's synchronous first frame
     in ~0.35 s, but this loop then spent sixteen animation frames reading one
     status each — ~0.5 s of pure sequencing at a 30–40 fps boot cadence — and
     the visit booted 811 → 1 275 ms. So: keep reading statuses back to back
     while this frame has budget left; a read that BLOCKS (a program the
     driver has not finished) blows the budget and yields, so the longest
     stall is still one program on a slow compiler, while a fast compiler
     gets through the whole list in a frame or two. */
  const SLICE_BUDGET_MS=6;
  const step=()=>{
    const t0=performance.now();
    while(i<progs.length&&performance.now()-t0<SLICE_BUDGET_MS){try{progs[i].getUniforms()}catch(e){}i++}
    if(i<progs.length){requestAnimationFrame(step);return}
    done();
  };
  requestAnimationFrame(step);
}

function statureProbe(){
  const sk=lastSk;if(!sk)return null;
  let maxY=-1e9,reach=0,firstBr=1e9,badPts=0;
  const rootRad=[];   // ground-contact spread of the root field
  for(const b of sk.branches){
    const rooty=b.kind==='prop'||b.kind==='root';
    for(const p of b.pts){
      if(!Number.isFinite(p.x+p.y+p.z)){badPts++;continue}
      if(p.y>maxY)maxY=p.y;
      const r=Math.hypot(p.x,p.z);if(r>reach)reach=r;
      if(rooty&&p.y<.6)rootRad.push(r);
    }
    if(b.depth===1&&b.kind==='branch'&&b.pts[0].y<firstBr)firstBr=b.pts[0].y;
  }
  rootRad.sort((a,b)=>a-b);
  const rootP=q=>rootRad.length?rootRad[Math.min(rootRad.length-1,Math.round(q*(rootRad.length-1)))]:null;
  let folMin=1e9,folMax=-1e9,strandMin=1e9,nStr=0;
  const N=foliage?foliage.mesh.count:0,ma=N?foliage.mesh.instanceMatrix.array:null;
  const folRad=[];   // crown-width percentiles for the tall frame fit
  for(let i=0;i<N;i++){
    const y=ma[i*16+13],kind=sk.branches[leafBranch[i]]?String(sk.branches[leafBranch[i]].kind):'';
    if(kind==='strand'){nStr++;if(y<strandMin)strandMin=y;continue}
    if(y<folMin)folMin=y;if(y>folMax)folMax=y;
    folRad.push(Math.hypot(ma[i*16+12],ma[i*16+14]));
  }
  folRad.sort((a,b)=>a-b);
  const folP=q=>folRad.length?folRad[Math.min(folRad.length-1,Math.round(q*(folRad.length-1)))]:null;
  const totalH=Math.max(maxY,folMax);
  return{species:speciesId,seed,age:ageY,quality:Qx.id,scene:sceneId,
    totalH,reach,firstBranchY:firstBr===1e9?null:firstBr,
    crownR50:folP(.5),crownR90:folP(.9),crownR98:folP(.98),   // tall frame probes
    rootR90:rootP(.9),groundY0:groundH?groundH(0,0):0,
    crownBottomY:N?folMin:null,crownCentroidPct:N?canopyU.uCanC.value.y/totalH:null,
    hr0:S.trunk.height/S.trunk.r0,leafPct:S.foliage.blade.length/totalH,
    sprigs:N,strandSprigs:nStr,strandMinY:nStr?strandMin:null,
    blossoms:blossoms?blossoms.count:0,fruit:fruit?fruit.count:0,
    buildMs:buildInfo.ms,tris:buildInfo.tris,badPts,errors:window.__errs.length,
    memMB:performance.memory?+(performance.memory.usedJSHeapSize/1048576).toFixed(1):null,
    glGeo:renderer.info.memory.geometries,glTex:renderer.info.memory.textures};
}
if(REVIEW_MODE&&Q.get('figure')==='1'&&Q.get('lineup')!=='1'){

if(REVIEW_MODE&&Q.get('lineup')==='1'){
  setViewLens();
  const ids=(Q.get('lineupIds')||Object.keys(SPECIES).join(',')).split(',').filter(k=>SPECIES[k]);
  const lFol=(Q.get('lineupFol')!=null?+Q.get('lineupFol'):.6)*Qx.sprigMul;
  const slots=[];
  for(const id of ids){
    if(id===speciesId){slots.push({main:true,reach:canopyR,h:canopyU.uCanC.value.y*1.4});continue}
    const LS=structuredClone(SPECIES[id]);applyAge(LS,ageY);
    const ls=Q.get('lineupSeed')?Q.get('lineupSeed')|0:LS.seed;
    reseed(ls);
    const gHl=makeGroundHeightFn(LS,ls);
    const sk2=growSkeleton(LS,gHl,ls);
    let reach2=0,h2=0;
    for(const b of sk2.branches)for(const p of b.pts){
      const r=Math.hypot(p.x,p.z);if(r>reach2)reach2=r;if(p.y>h2)h2=p.y}
    const grp=new THREE.Group();
    const w2=new THREE.Mesh(buildWood(sk2,LS,Qx,gHl),makeBarkMaterial(LS,windU));
    w2.castShadow=w2.receiveShadow=true;grp.add(w2);
    const fol2=buildFoliage(LS,sk2.anchors,makeLeafMaterial(LS,windU,canopyU),lFol,Qx.leafDetail??1);
    grp.add(fol2.mesh);
    const bl2=buildBlossoms(LS,sk2.anchors,makeBlossomMaterial(windU,canopyU),lFol);
    if(bl2)grp.add(bl2);
    grp.userData.groundAt=gHl(0,0);
    slots.push({grp,reach:Math.max(reach2,.8),h:h2});
  }
  let x=0;const pad=1.1,xs=[];
  for(let i=0;i<slots.length;i++){
    if(i>0)x+=(slots[i-1].reach+slots[i].reach)*.5*pad;
    xs.push(x);
  }
  // centre on the ROW, not on the main tree (which is first — the strip ran off-frame)
  const x0=(xs[0]+xs[xs.length-1])*.5;
  const mainIx=slots.findIndex(s=>s.main);
  let rowW=0,rowH=0;
  for(let i=0;i<slots.length;i++){
    const sx=xs[i]-x0;
    rowW=Math.max(rowW,Math.abs(sx)+slots[i].reach);rowH=Math.max(rowH,slots[i].h);

    else if(s.main&&mainIx>=0){        // the page's own tree is at x=0 — slide the WORLD instead
      const dx=xs[mainIx]-x0;
      for(const o of[wood,foliage&&foliage.mesh,blossoms,fruit])if(o)o.position.x=dx;
    }
  }
  scene.fog=null;   // harness view: the reference strip has no atmospheric cutoff
  camera.far=Math.max(camera.far,rowW*8);camera.updateProjectionMatrix();
  const asp=Math.max(.5,camera.aspect);
  const fitH=rowH/Math.tan(THREE.MathUtils.degToRad(camera.fov*.5));
  const fitW=rowW/(Math.tan(THREE.MathUtils.degToRad(camera.fov*.5))*asp);
  orbit.gTgt.set(0,rowH*.46,0);orbit.tgt.copy(orbit.gTgt);
  orbit.gAz=orbit.az=Math.PI/2;orbit.gEl=orbit.el=.05;
  orbit.gDist=orbit.dist=Math.max(fitH,fitW)*1.1;
}

/* v4.2: inside-the-crown auto camera — a monkey's drift. The camera rides a slow
   circle INSIDE the canopy (r ≈ 33–47% of crown radius), breathing up and down
   through the crown band while its gaze wanders across the interior — limbs,
   figs and backlit leaves slide past. Deterministic path (time-driven sines +
   stream-free fbm), zero rng draws. Toggle: panel button · key I · ?cam=inside.
   Any drag on the canvas hands control back to orbit. */
let camMode='orbit',insideT0=0;
const INSIDE_FOV=56;
/* v4.6: MANUAL monkey cam — you perch, you look, you climb. Drag = free look
   (up to nearly straight up, never through the ground), WASD/arrows = walk the
   air horizontally, Space/E = rise, Shift/Q = sink, wheel = glide along gaze.
   The mound is the floor: expl.y is clamped to groundH(x,z)+0.35 every frame. */
const expl={x:0,y:3,z:8,yaw:0,pitch:.2};
const explKeys=new Set();
function setCam(m){
  if(m===camMode)return;
  const prev=camMode;
  camMode=m;
  const b=document.getElementById('p-inside');
  if(b)b.textContent=m==='inside'?'exit the crown':'inside the crown · auto';
  const bx=document.getElementById('p-explore');
  if(bx)bx.textContent=m==='explore'?'exit monkey cam':'explore · monkey cam';
  if(m==='inside')insideT0=windU.uT.value;
  if(m==='explore'){
    // perch: just inside the crown edge, a storey up, facing the trunk
    const cc=canopyU.uCanC.value,cr=Math.max(2.2,canopyR||3);
    const az=prev==='orbit'?orbit.az:0;
    expl.x=cc.x*.4+Math.cos(az)*cr*.55;
    expl.z=cc.z*.4+Math.sin(az)*cr*.55;
    expl.y=Math.max((groundH?groundH(expl.x,expl.z):0)+1.6,cc.y*.55);
    expl.yaw=Math.atan2(expl.x-cc.x,expl.z-cc.z);      // face the heart of the tree
    expl.pitch=.18;
    camera.rotation.order='YXZ';
  }
}
function applyExplore(dt){
  const sp=(explKeys.has('ShiftRight')?7:3.2)*dt;      // right-shift sprints; left-shift sinks
  const cy=Math.cos(expl.yaw),sy=Math.sin(expl.yaw);
  let mx=0,mz=0;
  if(explKeys.has('KeyW')||explKeys.has('ArrowUp')){mx+=-sy;mz+=-cy}
  if(explKeys.has('KeyS')||explKeys.has('ArrowDown')){mx+=sy;mz+=cy}
  if(explKeys.has('KeyA')||explKeys.has('ArrowLeft')){mx+=-cy;mz+=sy}
  if(explKeys.has('KeyD')||explKeys.has('ArrowRight')){mx+=cy;mz+=-sy}
  const m=Math.hypot(mx,mz);
  if(m>0){expl.x+=mx/m*sp;expl.z+=mz/m*sp}
  if(explKeys.has('Space')||explKeys.has('KeyE'))expl.y+=2.4*dt;
  if(explKeys.has('ShiftLeft')||explKeys.has('KeyQ'))expl.y-=2.4*dt;
  // the world has edges: soil below, sky lid above, fog wall around
  const gy=(groundH?groundH(expl.x,expl.z):0)+.35;
  if(expl.y<gy)expl.y=gy;
  if(expl.y>28)expl.y=28;
  const rr2=Math.hypot(expl.x,expl.z);
  if(rr2>55){expl.x*=55/rr2;expl.z*=55/rr2}
  camera.position.set(expl.x,expl.y,expl.z);
  camera.rotation.set(expl.pitch,expl.yaw,0);
  if(Math.abs(camera.fov-INSIDE_FOV)>.05){camera.fov+=(INSIDE_FOV-camera.fov)*.06;camera.updateProjectionMatrix()}
}
addEventListener('keydown',e=>{if(e.target.tagName!=='INPUT'){explKeys.add(e.code);
  if(camMode==='explore'&&(e.code==='Space'||e.code.startsWith('Arrow')))e.preventDefault()}});
addEventListener('keyup',e=>explKeys.delete(e.code));
addEventListener('blur',()=>explKeys.clear());
function applyInside(){
  const t=windU.uT.value-insideT0;
  const cc=canopyU.uCanC.value,cr=Math.max(2.2,canopyR||3);
  const az=t*(Math.PI*2/74);                                   // one slow revolution ≈ 74 s
  const r=cr*(.40+.07*Math.sin(t*.13+.8));
  const y=Math.max(S.trunk.height*.55,cc.y*(0.94+0.20*Math.sin(t*.077+1.7)));
  const jx=(fbm(t*.11,3.3,0,2)-.5)*cr*.05,jy=(fbm(t*.09,7.7,0,2)-.5)*cr*.04;
  camera.position.set(cc.x*.4+Math.cos(az)*r+jx,y+jy,cc.z*.4+Math.sin(az)*r+jx*.6);
  const la=az+Math.PI*(.62+.16*Math.sin(t*.05));               // gaze sweeps the far interior
  const ly=y+cr*(.14*Math.sin(t*.041)-.03);                    // …with occasional upward glances
  camera.lookAt(cc.x*.6+Math.cos(la)*cr*.24,ly,cc.z*.6+Math.sin(la)*cr*.24);
  if(Math.abs(camera.fov-INSIDE_FOV)>.05){camera.fov+=(INSIDE_FOV-camera.fov)*.06;camera.updateProjectionMatrix()}
}
if(REVIEW_MODE){

  const bx=document.getElementById('p-explore');if(bx)bx.hidden=false,bx.addEventListener('click',()=>setCam(camMode==='explore'?'orbit':'explore'));

/* loop */
const clock=new THREE.Clock();
let fpsA=60,lastStats=0,idleNow=false,idleFrame=0;
renderer.setAnimationLoop(()=>{
  if(document.hidden||!bootCompiled){clock.getDelta();return}   // no frame before the programs are ready
  const dt=Math.min(clock.getDelta(),.1);

  setView(az,el,dist,tx,ty,tz){const v=[az,el,dist];if(!v.every(Number.isFinite))return false;

      ||(tx!=null&&(Math.abs(tx-orbit.gTgt.x)>1e-5||Math.abs((ty??orbit.gTgt.y)-orbit.gTgt.y)>1e-5||Math.abs((tz??orbit.gTgt.z)-orbit.gTgt.z)>1e-5)))lastInteractAt=performance.now();

  // This study refuses all memorial content; rejected input leaves the base tree unchanged.
  setMemorialObject(){return false},
  setNameplate(){return false},
  memories:{set(){return false},select(){return false},clear(){return true},
    candidates(){return[]},pick(){return null},resolve(){return false},count(){return 0}},
  /* the freeze contract. An explicit geometry version plus a
     deterministic digest of EVERY input the Gold curation depends on:
     trunk/root vertices, branch topology, canopy instances, the stable
     anchor table, the tall frame bounds and the four reserved placement
     positions. Any change to these invalidates the Gold manifest
     and requires a version bump + full re-sweep. Pure reads — no state
     is mutated and no rng is drawn. */
  geometry:{
    version:'eb-geo-1',
    report(){
      const F=()=>{let h=0x811c9dc5;return{mix(v){h^=(v|0)&0xff;h=Math.imul(h,0x01000193);h^=((v|0)>>>8)&0xff;h=Math.imul(h,0x01000193)},
        hex(){return('00000000'+(h>>>0).toString(16)).slice(-8)}}};
      const q=v=>Math.round(v*8192);
      // wood vertices (trunk + roots + branches, full coverage)
      const w=F();
      if(wood){const pa=wood.geometry.attributes.position.array;
        for(let i=0;i<pa.length;i+=5)w.mix(q(pa[i]));}
      // branch topology: registration order, kind, depth, endpoints, radii
      const t=F();
      if(lastSk)for(const b of lastSk.branches){
        t.mix(b.id);t.mix(b.kind==='branch'?1:b.kind==='root'?2:b.kind==='prop'?3:b.kind==='strand'?4:5);
        t.mix(b.depth);t.mix(b.pts.length);
        const p0=b.pts[0],p1=b.pts[b.pts.length-1];
        t.mix(q(p0.x));t.mix(q(p0.y));t.mix(q(p0.z));
        t.mix(q(p1.x));t.mix(q(p1.y));t.mix(q(p1.z));
        t.mix(q(b.radii[0]??0));
      }
      // canopy structure: foliage instance matrices
      const c=F();
      if(foliage&&foliage.mesh.count){const ma=foliage.mesh.instanceMatrix.array;
        for(let i=0;i<ma.length;i+=5)c.mix(q(ma[i]));c.mix(foliage.mesh.count);}
      // stable anchor table (branch-space addresses)
      const a=F();
      if(lastSk)for(const an of lastSk.anchors){
        a.mix(an.id);a.mix(q(an.tip??0));
        if(an.p){a.mix(q(an.p.x));a.mix(q(an.p.y));a.mix(q(an.p.z));}
      }
      // tall frame bounds (what the camera solve consumes)
      const s=F();
      const st=statureProbe()||{};
      for(const k of['totalH','reach','firstBranchY','crownR50','crownR90','crownR98','rootR90','groundY0','crownBottomY'])
        s.mix(q(st[k]??0));
      // Canonical reserved positions are computed from frozen inputs for the
      // geometry digest; no state change, rebuild or placement.
      // socketDetail.plate is anchor geometry covered by that digest.
      const k2=F();
      const socketDetail={stones:{}};
      {
        const rds=[];
        if(rootLines)for(let qq=3;qq<rootLines.length;qq+=3)rds.push(Math.hypot(rootLines[qq],rootLines[qq+1]));
        rds.sort((x,y)=>x-y);
        const rootR=Math.max(rds.length?rds[Math.min(rds.length-1,Math.round(.9*(rds.length-1)))]:3.9,S.trunk.r0*3);
        const taken=[];
        const pl=emPlace(groundH,rootLines,{az0:DEFAULT_VIEW_AZ+1.02,r0:rootR*1.30+.7,rMax:rootR*1.30+2.8,clear:.40,sep:1.0},taken);
        if(pl){k2.mix(q(pl.x));k2.mix(q(pl.z));taken.push({x:pl.x,z:pl.z,r:.9});
          socketDetail.plate={clearance:+pl.clearance.toFixed(3),fallback:!!pl.fallback};}
        for(const sock of['roots-left','roots-right','front-left','front-right']){
          const az={'roots-left':DEFAULT_VIEW_AZ+.60,'roots-right':DEFAULT_VIEW_AZ-.85,
            'front-left':DEFAULT_VIEW_AZ+.34,'front-right':DEFAULT_VIEW_AZ-.42}[sock];
          const near=sock.startsWith('roots');
          const p=emPlace(groundH,rootLines,
            {az0:az,r0:near?rootR*.96+.3:rootR*1.24+.6,rMax:(near?rootR*.96:rootR*1.24)+2.2,clear:.36,sep:.95},taken);
          if(p){k2.mix(q(p.x));k2.mix(q(p.z));k2.mix(p.fallback?1:0);
            socketDetail.stones[sock]={clearance:+p.clearance.toFixed(3),fallback:!!p.fallback};}
          else{k2.mix(-1);socketDetail.stones[sock]=null;}
        }
      }
      const parts={wood:w.hex(),branchTopology:t.hex(),canopy:c.hex(),anchors:a.hex(),stature:s.hex(),sockets:k2.hex()};
      const all=F();
      for(const key of Object.keys(parts))for(const ch of parts[key])all.mix(ch.codePointAt(0));
      return{engineGeometryVersion:'eb-geo-1',anchorEngineVersion:ANCHOR_ENGINE_VERSION,
        species:speciesId,seed,quality:Qx.id,season:seasonId,
        branches:lastSk?lastSk.branches.length:0,anchorCount:lastSk?lastSk.anchors.length:0,
        socketDetail,...parts,combined:all.hex()};
    },
  },
  /* Deterministic witness for the ENVIRONMENT (ground verts + every eco
     instance matrix + prop world positions) — the Earth & Moss twin of
     checksum(). Same build inputs ⇒ same digest. */
  environmentChecksum(){
    let h=0x811c9dc5;
    const mix=v=>{h^=(v|0)&0xff;h=Math.imul(h,0x01000193);h^=((v|0)>>>8)&0xff;h=Math.imul(h,0x01000193)};
    if(ground){const pa=ground.geometry.attributes.position.array;
      for(let i=0;i<pa.length;i+=11)mix(Math.round(pa[i]*8192));}
    for(const o of eco){
      if(o.isInstancedMesh){const ma=o.instanceMatrix.array;
        for(let i=0;i<ma.length;i+=7)mix(Math.round(ma[i]*8192));mix(o.count)}
      else if(o.geometry){const pa=o.geometry.attributes.position.array;
        for(let i=0;i<pa.length;i+=13)mix(Math.round(pa[i]*8192));}
    }
    for(const p of props){mix(Math.round(p.position.x*8192));mix(Math.round(p.position.z*8192));
      mix(Math.round((p.rotation?.y??0)*8192))}
    return('00000000'+(h>>>0).toString(16)).slice(-8);
  },
  stature:()=>bootCompiled?statureProbe():null,   // null until a frame has been drawn (ready = first frame, as before)
  /* SILHOUETTE PROBE. A pure read of the finished canopy — no rng, no rebuild, no state
     touched — returning the raw azimuthal and vertical structure. It states
     no policy. */
  silhouette(bins=24){
    if(!foliage||!foliage.mesh||!foliage.mesh.count)return null;
    const B=Math.max(8,Math.min(64,bins|0));
    const ma=foliage.mesh.instanceMatrix.array,N=foliage.mesh.count;
    let cx=0,cz=0,minY=1e9,maxY=-1e9;
    for(let i=0;i<N;i++){const o=i*16;
      cx+=ma[o+12];cz+=ma[o+14];
      if(ma[o+13]<minY)minY=ma[o+13];
      if(ma[o+13]>maxY)maxY=ma[o+13];}
    cx/=N;cz/=N;
    const bR=Array.from({length:B},()=>[]),bTop=new Float64Array(B).fill(-1e9),bN=new Uint32Array(B);
    const LV=10,vR=Array.from({length:LV},()=>[]);
    const span=Math.max(maxY-minY,1e-4);
    for(let i=0;i<N;i++){
      const o=i*16,dx=ma[o+12]-cx,dz=ma[o+14]-cz,y=ma[o+13];
      const r=Math.hypot(dx,dz);
      let a=Math.atan2(dz,dx);if(a<0)a+=Math.PI*2;
      const b=Math.min(B-1,Math.floor(a/(Math.PI*2)*B));
      bR[b].push(r);bN[b]++;if(y>bTop[b])bTop[b]=y;
      vR[Math.min(LV-1,Math.floor((y-minY)/span*LV))].push(r);
    }
    const pct=(arr,p)=>{if(!arr.length)return 0;const s=arr.slice().sort((a,b)=>a-b);
      return +s[Math.min(s.length-1,Math.round(p*(s.length-1)))].toFixed(4)};
    const r90=Array.from({length:B},(_,b)=>pct(bR[b],.90));
    const top=Array.from({length:B},(_,b)=>+(bTop[b]>-1e9?bTop[b]:minY).toFixed(4));
    const filled=r90.filter(v=>v>0);
    const mean=filled.reduce((a,b)=>a+b,0)/Math.max(filled.length,1);
    const sd=Math.sqrt(filled.reduce((a,b)=>a+(b-mean)*(b-mean),0)/Math.max(filled.length,1));
    // mirror symmetry: how closely r(θ) matches r(θ+π) — a true dome is ~1
    let mir=0;for(let b=0;b<B;b++){const o=r90[(b+(B>>1))%B];
      mir+=1-Math.abs(r90[b]-o)/Math.max(r90[b],o,1e-4);}
    mir/=B;
    // azimuthal lobes: smoothed local maxima standing >4 % above the mean
    const sm=Array.from({length:B},(_,b)=>(r90[(b-1+B)%B]+r90[b]*2+r90[(b+1)%B])/4);
    let lobes=0;for(let b=0;b<B;b++)
      if(sm[b]>sm[(b-1+B)%B]&&sm[b]>=sm[(b+1)%B]&&sm[b]>mean*1.04)lobes++;
    // vertical profile: crown radius by height decile (a layered banyan breaks;
    // an umbrella swells once and stops)
    const profile=Array.from({length:LV},(_,k)=>({
      y:+(minY+span*(k+.5)/LV).toFixed(4),r90:pct(vR[k],.90),n:vR[k].length}));
    /* Vertical STOREYS. This, not azimuthal roundness, is what separates the
       banned umbrella from a good banyan: a mature banyan crown is roughly
       circular in plan too, so "radius barely varies with azimuth" would
       reject a layered crown. So: count the shelves in the
       vertical radius profile, and count the prop-root pillars that actually
       make a colonnade. */
    const pr=[];for(let k=0;k<LV;k++)pr.push(pct(vR[k],.90));
    const vSm=pr.map((_,k)=>(pr[Math.max(0,k-1)]+pr[k]*2+pr[Math.min(LV-1,k+1)])/4);
    const vPk=Math.max(...vSm)||1;
    let storeys=0;
    for(let k=0;k<LV;k++){
      const lo=k>0?vSm[k-1]:-1,hi=k<LV-1?vSm[k+1]:-1;
      if(vSm[k]>=lo&&vSm[k]>=hi&&vSm[k]>vPk*0.55)storeys++;
    }
    let colonnade=0,propAll=0,surfaceRoots=0;
    if(branchMeta)for(const b of branchMeta){
      if(b.kind==='prop'){propAll++;if(b.len>1.5&&b.r0>0.05)colonnade++}
      else if(b.kind==='root')surfaceRoots++;
    }
    const st=statureProbe()||{};
    return{bins:B,instances:N,centroid:[+cx.toFixed(4),+cz.toFixed(4)],
      storeys,colonnade,propRoots:propAll,surfaceRoots,
      crownDepthFrac:+((maxY-minY)/Math.max(st.totalH||1,1e-4)).toFixed(4),
      crownBottom:+minY.toFixed(4),crownTop:+maxY.toFixed(4),totalH:+(st.totalH??0).toFixed(4),
      meanR90:+mean.toFixed(4),radialCv:+(sd/Math.max(mean,1e-4)).toFixed(4),
      mirrorSym:+mir.toFixed(4),lobes,
      lean:+(Math.hypot(cx,cz)/Math.max(mean,1e-4)).toFixed(4),
      topSpread:+((Math.max(...top)-Math.min(...top))/Math.max(span,1e-4)).toFixed(4),
      r90,top,binCount:Array.from(bN),profile};
  },
  capabilities:{memories:0,ground:2,props:0,nameplate:0,
    objects:['none']},
  setInteracting,   // marks when a drag starts and ends
  stats:()=>({...buildInfo,calls:renderer.info.render.calls,fps:Math.round(fpsA),idle:idleNow,interacting,pixelRatio:renderer.getPixelRatio(),barkBaked:!!(barkMat&&barkMat.userData.barkBaked),
    sprigs:foliage?foliage.mesh.count:0,quality:Qx.id,species:speciesId,seed,scene:sceneId,season:seasonId,
    ground:groundId,approach:approachId}),
  /* barkAtlas is exposed for the same reason wood and ground are: it is
     the only way a QA pass can look at the baked tile's four packed channels
     separately, and guessing which of them is showing its lattice costs a
     build per guess. Read-only accessor on the existing debug seam. */
  _dbg:()=>({renderer,scene,camera,sun,windU,get wood(){return wood},get ground(){return ground},get foliage(){return foliage},get barkAtlas(){return barkAtlasTex}})
};
console.log('[v5.3] ready · three selected tree studies · quality='+Qx.id+' · species='+speciesId+' seed='+seed+' scene='+sceneId);

/* ---- v4.11 shot helper (?shot=png|webm|key) — capture helper.
   Additive and inert when absent: zero rng draws, no build-path or handle changes; it
   only READS the finished frame. PNG must be same-tick (the canvas is not
   preserveDrawingBuffer): render(scene,camera) then toDataURL inside one task.
   WebM records the live canvas via captureStream + MediaRecorder (needs the tab
   visible and reduced-motion OFF for ?cam=inside rides). Downloads auto-name to
   <species>-<seed>-<scene>-<season>-<label>.{png,webm}. */
{
const shotMode=Q.get('shot');
if(REVIEW_MODE&&shotMode){
  const label=Q.get('shotLabel')||({inside:'ride',explore:'glide'}[Q.get('cam')]||'view');
  const shotName=()=>`${speciesId}-${seed}-${sceneId}-${seasonId}-${label}`;
  const hud=document.createElement('div');
  hud.style.cssText='position:absolute;z-index:9;left:50%;bottom:14px;transform:translateX(-50%);'+
    'font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cfe4d2;'+
    'background:rgba(8,12,10,.72);border:1px solid rgba(207,228,210,.25);border-radius:8px;'+
    'padding:4px 10px;pointer-events:none;white-space:nowrap';
  stage.appendChild(hud);
  const save=(url,ext)=>{const a=document.createElement('a');a.href=url;a.download=`${shotName()}.${ext}`;
    document.body.appendChild(a);a.click();a.remove()};
  const snapPng=()=>{
    const dpr=clamp(Q.get('shotDpr')!=null?+Q.get('shotDpr'):2,.5,3);
    const w=Math.max(1,stage.clientWidth),h=Math.max(1,stage.clientHeight);
    renderer.setPixelRatio(dpr);renderer.setSize(w,h,false);
    renderer.render(scene,camera);                                   // same-tick: render, then read
    const url=renderer.domElement.toDataURL('image/png');
    sizeToStage();                                                   // restore live pixel ratio
    save(url,'png');
    hud.textContent=`saved ${shotName()}.png · ${w*dpr}×${h*dpr}`;
  };
  let rec=null,recT0=0,recSec=0,recTick=0;
  const recStop=()=>{if(rec&&rec.state!=='inactive')rec.stop()};
  const recStart=sec=>{
    if(rec&&rec.state!=='inactive')return;
    recSec=sec;recT0=performance.now();
    const fps=Q.get('shotFps')!=null?+Q.get('shotFps'):30;
    const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']
      .find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
    if(!mime){hud.textContent='MediaRecorder/webm unsupported in this browser';return}
    const chunks=[];
    rec=new MediaRecorder(renderer.domElement.captureStream(fps),{mimeType:mime,videoBitsPerSecond:14e6});
    rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    rec.onstop=()=>{const url=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));
      save(url,'webm');hud.textContent=`saved ${shotName()}.webm · ${((performance.now()-recT0)/1000).toFixed(1)}s`;
      setTimeout(()=>URL.revokeObjectURL(url),5000)};
    rec.start();
    const run=()=>{if(!rec||rec.state==='inactive')return;
      const s=(performance.now()-recT0)/1000;
      if(recSec&&s>=recSec){recStop();return}
      if(!(++recTick%6))hud.textContent=`${shotName()}.webm · recording ${s.toFixed(1)}${recSec?'/'+recSec:''}s · ${recSec?'auto-stops':'V stops'}`;
      requestAnimationFrame(run)};
    requestAnimationFrame(run);
  };
  if(shotMode==='key'){
    hud.textContent=`${shotName()} · compose freely — P saves png · V starts/stops webm`;
    addEventListener('keydown',e=>{
      if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
      if(e.code==='KeyP')snapPng();
      if(e.code==='KeyV'){if(rec&&rec.state!=='inactive')recStop();else recStart(0)}
    });
  }else if(shotMode==='png'||shotMode==='webm'){
    const wait=Math.max(1,Q.get('shotWait')!=null?+Q.get('shotWait'):90);   // settle frames: shader warm-up + orbit ease-in
    let f=0;
    const tick=()=>{
      if(++f<wait){if(!(f%10))hud.textContent=`${shotName()} · settling ${f}/${wait}`;requestAnimationFrame(tick);return}
      if(shotMode==='png')requestAnimationFrame(snapPng);
      else recStart(clamp(Q.get('shotSec')!=null?+Q.get('shotSec'):10,2,30));
    };
    requestAnimationFrame(tick);
  }else hud.textContent=`unknown shot mode "${shotMode}" — use shot=png | webm | key`;
}
}
</script>
