<title>Banyan v3 — one-file procedural tree</title>
<!--
  banyan-bonsai_v3.html — exploratory next-gen one-file prototype (2026-07-08, r2).
  Thesis kept from the playbook: a tree is a pure function of (seed, spec).
  Everything else is presentation. v3 rewrites the presentation layers for
  realism: sprig-based foliage (no flat single cards), plate buttress roots,
  species bark families, ground ecology, and wind. r2 re-audit pass: fluted/
  ropey banyan wood, carved leaf silhouettes with vein relief + translucency,
  notched cherry petals w/ stamen discs, sinewy roots, per-leaf inspection
  data, and 3 new prop-driven scenes (forest floor / autumn park / zen garden).
  Deterministic: one mulberry32 stream for placement, integer-hash noise for detail.
  Deps: three@0.165.0 via CDN import map (same dependency policy as dist).
  Handle: window.v3 (alias window.banyan). URL: ?species=&seed=&scene=&quality=
  &view=az,el,dist&wind=&ui=0&spec=<uri-encoded JSON deep-merged into spec>.
-->

    #hud{top:10px;left:10px;font-size:10px;max-width:70vw}
    #stats{display:none}
    #panel{top:auto;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));width:auto;max-height:40vh;overflow:auto}

/* ================= quality presets =================
   r4: dpr capped (fill-rate was the #1 fps killer), radial trimmed —
   braids/bark relief come from geometry columns + baked normal detail. */
const QUALITY={
 high:  {dpr:1.75,shadow:2048,soft:1,radial:30,trunkRadial:44,sprigMul:1,  ecoMul:1, leafDetail:1,id:'high'},
 mobile:{dpr:1.25,shadow:1024,soft:0,radial:18,trunkRadial:28,sprigMul:.8, ecoMul:.5,leafDetail:0,id:'mobile'}   // V12: keep sprig count, trim per-sprig geometry
};
function resolveQuality(q){
  if(q==='high'||q==='mobile')return QUALITY[q];
  const small=Math.min(innerWidth,innerHeight)<640||(matchMedia&&matchMedia('(pointer:coarse)').matches&&innerWidth<900);
  return small?QUALITY.mobile:QUALITY.high;
}

/* ================= L2 · grower (seed,spec) -> graph =================
   One stream, fixed draw order. Anchors carry position, tangent, branch id,
   depth and tipness so the foliage instancer can orient sprigs. */
function growSkeleton(S,groundH,seedG){
  const V3=THREE.Vector3;
  const branches=[],anchors=[];let trunkPts=[],trunkRadii=[];
  const scaffoldIds=[],buttresses=[];
  const F=S.habit.field,FORM=S.habit.form||'dome';
  let domeY;
  if(FORM==='pads'){const K=S.habit.pads||{},pl=K.lobes??5,pa=K.amp??.3,pp=K.phase??.7;
    domeY=(r,az)=>F.base+F.amp*Math.exp(-(r*r)/F.falloff)*(1-pa+pa*Math.pow(.5+.5*Math.cos(az*pl+pp),1.4));}
  else if(FORM==='cascade'){const K=S.habit.cascade||{},rise=K.riseRadius??.5,drop=K.drop??1.8,reach=K.reach??2.4;
    domeY=r=>F.base+F.amp*Math.exp(-(r*r)/F.falloff)-drop*smoothstep(r,rise,reach);}
  else if(FORM==='cone'){domeY=r=>F.base+F.amp*Math.max(0,1-r/F.falloff);}
  else domeY=r=>F.base+F.amp*Math.exp(-(r*r)/F.falloff);
  const CLAMP_Y=S.habit.clampY??.5;
  const reg=br=>{br.id=branches.length;branches.push(br);return br.id};
  const arcTable=pts=>{const c=[0];for(let i=1;i<pts.length;i++)c.push(c[i-1]+pts[i].distanceTo(pts[i-1]));return c};

  function addAnchors(br){
    const A=S.foliage.anchor,cum=arcTable(br.pts),total=cum[cum.length-1];
    if(total<.04)return;
    for(let s=total*A.startFrac;s<total;s+=A.step*rr(A.jitter[0],A.jitter[1])){
      let i=1;while(i<cum.length-1&&cum[i]<s)i++;
      const f=(s-cum[i-1])/Math.max(1e-6,cum[i]-cum[i-1]);
      const p=br.pts[i-1].clone().lerp(br.pts[i],f);
      const r=lerp(br.radii[i-1],br.radii[i],f);
      if(r>A.maxTwigRadius)continue;
      const t=br.pts[i].clone().sub(br.pts[i-1]).normalize();
      const tt=s/total;
      const w=1+Math.round(A.tipWeight*tt*tt)+(tt>A.tipThresh?A.tipBonus:0);
      for(let k=0;k<w;k++)anchors.push({p,t,id:br.id,depth:br.depth,tip:tt});
    }
  }

  function growBranch(o){
    const R=S.recursion;
    const steps=clamp(Math.round(o.len/.11),4,16),ds=o.len/steps;
    const pts=[o.start.clone()],dir=o.dir.clone().normalize();
    const sd=branches.length*3.77+11.3;
    for(let i=1;i<=steps;i++){
      const p=pts[i-1];
      dir.addScaledVector(new V3(fbm(p.x*1.7+sd,p.y*1.7,p.z*1.7,3)-.5,fbm(p.x*1.7+9.1,p.y*1.7+sd,p.z*1.7,3)-.5,fbm(p.x*1.7,p.y*1.7+4.7,p.z*1.7+sd,3)-.5),o.wig*2.2);
      if(o.steer>0){
        const r=Math.hypot(p.x,p.z);
        dir.y+=clamp(domeY(r,Math.atan2(p.z,p.x))+(o.domeOff||0)-p.y,-CLAMP_Y,CLAMP_Y)*S.habit.steer*o.steer;
        if(r>.05)dir.addScaledVector(new V3(p.x/r,0,p.z/r),S.habit.outward*o.steer);
      }
      dir.normalize();
      pts.push(p.clone().addScaledVector(dir,ds));
    }
    const radii=pts.map((_,i)=>lerp(o.r0,o.r1,Math.pow(i/steps,.85)));
    pts.push(pts[steps].clone().addScaledVector(dir,Math.max(.015,o.r1*1.5)));
    radii.push(.0008);
    const br={parent:o.parent,depth:o.depth,kind:o.kind||'branch',pts,radii,gnarl:o.gnarl??R.gnarlByDepth[o.depth],lobes:o.lobes||null,pr:o.parentR||0};
    const id=reg(br);
    if(o.depth>=2)addAnchors(br);
    if(o.depth>=1&&o.depth<R.maxDepth&&o.r1>R.minRadius){
      const cum=arcTable(pts),total=cum[steps],cd2=o.depth+1;
      const lenTab=R.lenByDepth[cd2];
      let phi=rr(0,Math.PI*2);
      for(let s=total*rr(.28,.4);s<total*.92;s+=R.spacing[o.depth]*rr(.8,1.3)){
        let i=1;while(i<steps&&cum[i]<s)i++;
        const f=(s-cum[i-1])/Math.max(1e-6,cum[i]-cum[i-1]);
        const p=pts[i-1].clone().lerp(pts[i],f);
        const rH=lerp(radii[i-1],radii[i],f);
        const T=pts[i].clone().sub(pts[i-1]).normalize();
        const up=Math.abs(T.y)>.92?new V3(1,0,0):new V3(0,1,0);
        const N=up.clone().addScaledVector(T,-up.dot(T)).normalize();
        const B=new V3().crossVectors(T,N);
        phi+=Math.PI+rr(-.9,.9);
        const cd=T.clone().multiplyScalar(.55).addScaledVector(N,Math.cos(phi)*.9).addScaledVector(B,Math.sin(phi)*.9).add(new V3(0,R.upBias,0)).normalize();
        const cr0=Math.min(rH*rr(R.childRadius[0],R.childRadius[1]),rH*.85);
        if(cr0<R.minRadius)continue;
        growBranch({start:p.clone().addScaledVector(cd,-rH*.58),dir:cd,len:rr(lenTab[0],lenTab[1]),r0:cr0,
          r1:cd2===R.maxDepth?.0045:cr0*rr(.28,.4),depth:cd2,parent:id,parentR:rH,domeOff:(o.domeOff||0)+rr(-.04,.04),
          wig:R.wig[cd2],steer:R.steer[cd2]});
      }
      const endT=pts[steps].clone().sub(pts[steps-1]).normalize();
      const perp=new V3(rr(-1,1),rr(-.3,.3),rr(-1,1)).cross(endT);
      if(perp.lengthSq()<1e-4)perp.set(1,0,0);
      perp.normalize();
      for(const sgn of[1,-1]){
        const a=sgn*rr(.28,.6);
        const cd=endT.clone().applyAxisAngle(perp,a).normalize();
        const cr0=o.r1*rr(.7,.85);
        if(cr0<.005)continue;
        growBranch({start:pts[steps].clone().addScaledVector(cd,-o.r1*.5),dir:cd,len:rr(lenTab[0],lenTab[1])*rr(.85,1.1),r0:cr0,
          r1:cd2===R.maxDepth?.0045:cr0*rr(.28,.4),depth:cd2,parent:id,parentR:o.r1*1.2,domeOff:(o.domeOff||0)+rr(-.04,.04),
          wig:R.wig[cd2],steer:R.steer[cd2]});
      }
    }
    // weeping strands (gated on S.strands)
    const ST=S.strands;
    if(ST&&br.kind==='branch'&&o.depth===(ST.fromDepth??S.recursion.maxDepth)){
      const nS=Math.round(rr(ST.perTip[0],ST.perTip[1]));
      const cum2=arcTable(pts),total2=cum2[cum2.length-1];
      for(let k=0;k<nS;k++){
        const s=total2*rr(.35,1);
        let i2=1;while(i2<cum2.length-1&&cum2[i2]<s)i2++;
        const f2=(s-cum2[i2-1])/Math.max(1e-6,cum2[i2]-cum2[i2-1]);
        const start=pts[i2-1].clone().lerp(pts[i2],f2);
        const Tv=pts[i2].clone().sub(pts[i2-1]).normalize();
        const len=rr(ST.len[0],ST.len[1]);
        const d=Tv.clone().multiplyScalar(.45).add(new V3(rr(-.3,.3),-.35,rr(-.3,.3))).normalize();
        const stepsS=clamp(Math.round(len/.07),5,18),dsS=len/stepsS;
        const sway=ST.sway??.1,grav=ST.gravity??.45;
        const sp=[start.clone()],sdS=branches.length*3.77+6.1;
        for(let j=1;j<=stepsS;j++){
          const p2=sp[j-1];
          d.x+=(fbm(p2.x*2.3+sdS,p2.y*2.3,p2.z*2.3,3)-.5)*sway;
          d.z+=(fbm(p2.x*2.3,p2.y*2.3+sdS,p2.z*2.3+3.3,3)-.5)*sway;
          d.y-=grav*.22;d.normalize();
          const nxt=p2.clone().addScaledVector(d,dsS);
          if(nxt.y<.06)break;
          sp.push(nxt);
        }
        if(sp.length<3)continue;
        const rS=sp.map((_,j)=>lerp(ST.r0??.007,.0016,j/(sp.length-1)));
        const sbr={parent:id,depth:o.depth+1,kind:'strand',pts:sp,radii:rS,gnarl:ST.gnarl??.05,lobes:null};
        reg(sbr);addAnchors(sbr);
      }
    }
    return id;
  }

  const N_T=20;
  const trunkPointAt=t=>{const i=clamp(Math.floor(t*N_T),0,N_T-1),f=t*N_T-i;
    return{p:trunkPts[i].clone().lerp(trunkPts[i+1],f),r:lerp(trunkRadii[i],trunkRadii[i+1],f)}};

  /* trunk — spine + (optionally) braided fused columns for fig-type species */
  const leanAz=rr(0,Math.PI*2);
  const lean=new V3(Math.cos(leanAz),0,Math.sin(leanAz)).multiplyScalar(S.trunk.lean);
  {
    for(let i=0;i<=N_T;i++){
      const t=i/N_T;
      const wx=(fbm(t*2.5+3.1,7.7,1.2,3)-.5)*S.trunk.wobble;
      const wz=(fbm(1.9,t*2.5+5.3,8.8,3)-.5)*S.trunk.wobble;
      trunkPts.push(new V3(lean.x*t*t+wx*t,-.10+(S.trunk.height+.10)*t,lean.z*t*t+wz*t));
      trunkRadii.push(lerp(S.trunk.r0,S.trunk.r1,Math.pow(t,S.trunk.radiusPow)));
    }
  }
  let trunkCols=null;
  const CB=S.trunk.columns;
  if(CB){
    // column phase locked to the ground-flare phase so trunk folds continue as soil swells
    const ph0=(seedG%997)*.0063;
    trunkCols={depth:CB.depth??.5,fuseH:CB.fuseH??.6,baseSharp:CB.baseSharp??2.4,nMajor:CB.count,list:[]};
    const nAll=CB.count+(CB.minor??0);
    for(let i=0;i<nAll;i++){
      const major=i<CB.count;
      trunkCols.list.push({
        az:major?ph0+i/CB.count*Math.PI*2+rr(-.22,.22):rr(0,Math.PI*2),
        w:major?rr(.7,1.15):rr(.28,.5),
        sig:major?rr(.4,.6):rr(.2,.32),
        tw:(rand()<.5?-1:1)*(CB.twist??.5)*rr(.6,1.3),
        hTop:major?rr(.7,1.05):rr(.28,.55)});
    }
  }
  const trunk={parent:-1,depth:0,kind:'trunk',pts:trunkPts,radii:trunkRadii,gnarl:S.trunk.gnarl,
    rope:S.trunk.rope||null,columns:trunkCols,flare:S.trunk.flare??1.15,
    lobes:S.trunk.lobes?{count:S.trunk.lobes.count,phase:rr(0,Math.PI*2),base:S.trunk.lobes.base,amp:S.trunk.lobes.amp,
      sharp:S.trunk.lobes.sharp,span:S.trunk.lobes.span,mode:'ground'}:null};
  const trunkId=reg(trunk);

  /* scaffolds */
  const GOLD=Math.PI*(3-Math.sqrt(5));
  {
    const SC=S.scaffolds||{};
    const nLow=SC.low??1,nUpper=SC.upper??5,nApex=SC.apex??3;
    const elevR=SC.elevation||[.3,.55];
    const lowLen=SC.lowLen??1.25,upperLen=SC.upperLen||[1.25,1.7],apexLen=SC.apexLen||[.45,.7];
    const lowAt=SC.lowAt??.6,upperAt=SC.upperAt||[.8,1];
    const lowY=SC.lowElev??.28;
    const lowR0=SC.lowR0||[.42,.5],upperR0=SC.upperR0||[.5,.62],apexR0=SC.apexR0||[.42,.5];
    const az0=rr(0,Math.PI*2);
    for(let i=0;i<nLow;i++){
      const az=i===0?az0:az0+2.3*i+rr(-.3,.3);
      const at=trunkPointAt(lowAt);
      const d0=new V3(Math.cos(az),lowY,Math.sin(az)).normalize();
      scaffoldIds.push(growBranch({start:at.p.clone().addScaledVector(d0,-at.r*.55),dir:d0,
        len:lowLen,r0:at.r*rr(lowR0[0],lowR0[1]),r1:.028,depth:1,parent:trunkId,wig:.1,steer:.8,domeOff:rr(-.3,-.15)}));
    }
    for(let i=0;i<nUpper;i++){
      const az=az0+GOLD*(i+1)+rr(-.35,.35);
      const at2=trunkPointAt(rr(upperAt[0],upperAt[1]));
      const elev=rr(elevR[0],elevR[1]);
      const d=new V3(Math.cos(az)*Math.cos(elev),Math.sin(elev),Math.sin(az)*Math.cos(elev)).normalize();
      scaffoldIds.push(growBranch({start:at2.p.clone().addScaledVector(d,-at2.r*.55),dir:d,
        len:rr(upperLen[0],upperLen[1]),r0:at2.r*rr(upperR0[0],upperR0[1]),r1:.03,depth:1,parent:trunkId,wig:.1,steer:1,domeOff:rr(-.12,.15)}));
    }
    for(let i=0;i<nApex;i++){
      const az=rr(0,Math.PI*2);
      const d=new V3(Math.cos(az)*.4,1,Math.sin(az)*.4).normalize();
      const at3=trunkPointAt(1);
      scaffoldIds.push(growBranch({start:at3.p.clone().addScaledVector(d,-at3.r*.5),dir:d,
        len:rr(apexLen[0],apexLen[1]),r0:at3.r*rr(apexR0[0],apexR0[1]),r1:.025,depth:1,parent:trunkId,wig:.1,steer:1,domeOff:rr(0,.1)}));
    }
  }

  /* aerial prop roots (banyan) — curved columns with drift + ground grip */
  const PR=S.propRoots;
  if(PR){
    const cands=[];
    for(const sid of scaffoldIds){
      const br=branches[sid],cum=arcTable(br.pts),total=cum[cum.length-1];
      for(let tf=.4;tf<=.85;tf+=.15){
        const s=total*tf;
        let i=1;while(i<cum.length-1&&cum[i]<s)i++;
        const f=(s-cum[i-1])/Math.max(1e-6,cum[i]-cum[i-1]);
        const p=br.pts[i-1].clone().lerp(br.pts[i],f);
        const r=lerp(br.radii[i-1],br.radii[i],f);
        const rad=Math.hypot(p.x,p.z);

        pts.unshift(new V3(dirH.x*.04,groundH(dirH.x*.04,dirH.z*.04)+r0*.12,dirH.z*.04));
        radii.unshift(r0*.9);
      }
      const rid=reg({parent:trunkId,depth:1,kind:'root',pts,radii,gnarl:SR.gnarl,lobes:null});

      const nRl=1+Math.floor(rand()*2);
      for(let k=0;k<nRl;k++){
        const t0=rr(.3,.75);
        const bi=1+Math.floor(t0*stepsR);

        const rd=new V3(-dirH.z*side,0,dirH.x*side).addScaledVector(dirH,rr(.3,.8)).normalize();

      }
    }

  const BT=S.buttress;
  if(BT){
    const az0=rr(0,Math.PI*2);
    for(let i=0;i<BT.count;i++){

        thick:rr(BT.thick[0],BT.thick[1]),skew:rr(-.25,.25),

}

    T.push(t.normalize());

      .replace('#include <common>',`#include <common>

${GUST_GLSL}`)
      .replace('#include <begin_vertex>',`#include <begin_vertex>

#ifdef USE_INSTANCING
{

  transformed+=wl*((g+tr)*uWind*0.05);
}
#endif`);
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>',`#include <common>
varying vec2 vPUv;varying float vPet;
uniform vec3 uSunV;uniform vec3 uSunC;uniform float uEnvI;
${NOISE_GLSL}`)
      .replace('#include <color_fragment>',`#include <color_fragment>
{
  if(vPUv.y>5.5){
    // pedicel: olive-green with a reddish wash toward the flower

    c=mix(c,vec3(0.4,0.24,0.18),smoothstep(0.5,0.9,vPUv.y-6.0)*0.55);

    c=mix(c*vec3(1.0,0.62,0.68),c,smoothstep(0.05,0.45,vPUv.x));

  }else if(vPUv.y>1.5){

    diffuseColor.rgb=mix(vec3(0.6,0.7,0.36),deep,smoothstep(0.2,0.85,r));
  }else{

    if(!gl_FrontFacing)c*=vec3(0.9,0.82,0.86);                      // pinker shaded underside = petal depth

function makeGroundHeightFn(S,seedG){
  const trunkR=S.trunk.r0;
  // flare lobes: for column species, SAME count+phase as the trunk columns so
  // every trunk fold continues as a soil swell (grown-together base)
  const kR=S.trunk.columns?S.trunk.columns.count:(5+((seedG>>>2)%4)),ph=(seedG%997)*.0063;
  const rippleA=S.trunk.columns?.07:.05;
  return (x,z)=>{
    const r=Math.hypot(x,z);
    let h=.13*Math.exp(-(r*r)/(trunkR*4.5)); // root mound
    // radial root-flare ripple: buried laterals swelling the soil, melting outward
    const az=Math.atan2(z,x);
    h+=rippleA*Math.pow(.5+.5*Math.sin(az*kR+ph+r*1.4),1.9)
       *smoothstep(r,trunkR*.5,trunkR*1.15)*(1-smoothstep(r,trunkR*1.7,trunkR*3.4));
    h+=(fbm(x*1.25+seedG*.01,17.7,z*1.25,3)-.5)*.11*smoothstep(r,.3,2.4)*(1-smoothstep(r,3.2,6.5)*.8);
    h+=(fbm(x*4.5,3.3,z*4.5,2)-.5)*.02*(1-smoothstep(r,3,6));
    return h;
  };
}
function buildGround(groundH,radius,uHor,soil,rootLines){

    for(let j=0;j<=SEC;j++){
      const a=j/SEC*Math.PI*2;
      const x=Math.cos(a)*r,z=Math.sin(a)*r;
      pos.push(x,groundH(x,z),z);
      uv.push(x,z);
      // root-contact bake: soil is darker/disturbed where woody roots press into it
      let sh=0;
      if(rootLines)for(let q=0;q<rootLines.length;q+=3){

        const rr2=rootLines[q+2];

  g.setIndex(idx);
  g.computeVertexNormals();

  mat.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,{uHor,uSoilA:soil.uSoilA,uSoilB:soil.uSoilB,uMoist:soil.uMoist,uEco:soil.uEco,

      .replace('#include <common>','#include <common>\nvarying vec3 vGP;')

    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>',`#include <common>
varying vec3 vGP;
uniform vec3 uHor;uniform vec3 uSoilA;uniform vec3 uSoilB;uniform vec3 uMoist;uniform float uEco;
uniform float uMossA;uniform float uGravelA;
${NOISE_GLSL}`)
      .replace('#include <map_fragment>',`#include <map_fragment>
{

  soil*=0.9+0.2*bnoise(vGP*26.0);
  float moist=(1.0-smoothstep(0.15,1.5,r))*0.85;
  moist+=smoothstep(0.55,0.85,bfbm(vGP*3.1+9.0))*0.25*(1.0-smoothstep(1.0,3.0,r));
  soil=mix(soil,uMoist,clamp(moist,0.0,1.0)*uEco);

  soil=mix(soil,uSoilB*1.25,speck*0.5*smoothstep(0.6,2.2,r));
  float duff=smoothstep(0.4,0.75,bfbm(vGP*vec3(1.4,2.0,1.4)+23.0))*(1.0-smoothstep(1.8,3.4,r))*uEco;

  vec3 grav=vec3(0.79,0.77,0.72)*(0.88+0.2*bnoise(vGP*70.0))*(0.95+0.07*rake);
  grav*=1.0-0.2*smoothstep(0.5,0.95,rake);
  soil=mix(soil,grav,gw);
  diffuseColor.rgb=mix(soil,uHor,smoothstep(${(radius*.42).toFixed(2)},${(radius*.85).toFixed(2)},r));

      .replace('#include <roughnessmap_fragment>',`#include <roughnessmap_fragment>
roughnessFactor=clamp(roughnessFactor-0.15*(1.0-smoothstep(0.15,1.2,length(vGP.xz))),0.6,1.0);`);

function buildLitter(S,groundH,canopyR,eRng,count,windU){
  const L=S.litter||{h:[.07,.12],s:[.4,.6],l:[.22,.4],count:300};
  const N=count;
  if(N<=0)return null;
  const needle=!!L.needle;
  const pos=[],nor=[],uvA=[],idx=[];
  if(needle){
    pos.push(-.004,0,0, .004,0,0, 0,.004,.05);
    nor.push(0,1,0, 0,1,0, 0,1,0);
    uvA.push(0,0, 1,0, .5,1);
    idx.push(0,1,2);
  }else{
    const LS=3,WS=2,Ln=.06,W=.027;
    for(let iu=0;iu<=LS;iu++){
      const u=iu/LS;
      for(let iv=0;iv<=WS;iv++){
        const v=iv/WS*2-1;
        const w=W*Math.pow(Math.sin(Math.PI*Math.pow(u,.8)),.7);
        pos.push(u*Ln,(u*u+v*v*.5)*.012+Math.abs(v)*w*.32,v*w);
        nor.push(0,1,0);
        uvA.push(u,iv/WS);
      }
    }
    for(let iu=0;iu<LS;iu++)for(let iv=0;iv<WS;iv++){
      const a=iu*(WS+1)+iv,b=a+WS+1;
      idx.push(a,b,a+1,b,b+1,a+1);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvA,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.9,side:THREE.DoubleSide});
  const mesh=new THREE.InstancedMesh(g,mat,N);
  mesh.receiveShadow=true;
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),sc=new THREE.Vector3(),col=new THREE.Color();
  for(let i=0;i<N;i++){
    const u=eRng(),a=eRng()*Math.PI*2;
    const r=(0.28+1.05*Math.sqrt(u))*canopyR*(0.75+.5*eRng());
    const x=Math.cos(a)*r,z=Math.sin(a)*r;
    e.set((eRng()-.5)*.6,eRng()*Math.PI*2,(eRng()-.5)*.6);
    q.setFromEuler(e);
    const s=(.65+.7*eRng())*(L.size??1);
    m.compose(new THREE.Vector3(x,groundH(x,z)+.005,z),q,sc.set(s,s,s));
    mesh.setMatrixAt(i,m);
    col.setHSL(L.h[0]+(L.h[1]-L.h[0])*eRng(),L.s[0]+(L.s[1]-L.s[0])*eRng(),L.l[0]+(L.l[1]-L.l[0])*eRng(),THREE.SRGBColorSpace);
    mesh.setColorAt(i,col);
  }
  mesh.instanceMatrix.needsUpdate=true;
  if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;
  return mesh;
}

function mergeSimple(list){   // V8: bake transforms, merge prop parts -> one draw per material
  let nv=0,ni=0;
  for(const g of list){nv+=g.attributes.position.count;ni+=g.index?g.index.count:g.attributes.position.count}
  const pos=new Float32Array(nv*3),nor=new Float32Array(nv*3),uvA=new Float32Array(nv*2);
  const idx=nv>65535?new Uint32Array(ni):new Uint16Array(ni);
  let vo=0,io=0;
  for(const g of list){
    pos.set(g.attributes.position.array,vo*3);
    nor.set(g.attributes.normal.array,vo*3);
    if(g.attributes.uv)uvA.set(g.attributes.uv.array,vo*2);
    const nvg=g.attributes.position.count;
    if(g.index){const gi=g.index.array;for(let i=0;i<gi.length;i++)idx[io++]=gi[i]+vo}
    else for(let i=0;i<nvg;i++)idx[io++]=i+vo;
    vo+=nvg;
    g.dispose();
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  geo.setAttribute('uv',new THREE.BufferAttribute(uvA,2));
  geo.setIndex(new THREE.BufferAttribute(idx,1));
  return geo;
}

    // V8: transforms baked into 3 merged meshes (stems/caps/gills) — was 3 draws PER mushroom
    const grp=new THREE.Group();
    const id=def.id??1,n=def.n??4;
    const capM=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.05+.04*ihash01(id*17+2),.48,.34),roughness:.62});
    const stemM=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.1,.13,.76),roughness:.88});
    const gillM=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.08,.28,.5),roughness:.9,side:THREE.DoubleSide});
    const stemG=[],capG=[],gillG=[];
    const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),eu=new THREE.Euler(),one=new THREE.Vector3(1,1,1);
    for(let i=0;i<n;i++){
      const u=k=>ihash01(id*131+i*17+k);
      const s=(def.size??.045)*(.55+.9*u(1));
      const px=def.x+(u(2)-.5)*(def.spread??.24),pz=def.z+(u(3)-.5)*(def.spread??.24);
      const py=def.y!=null?def.y:groundH(px,pz);
      const stemH=s*(1.1+.9*u(4));
      eu.set((u(6)-.5)*.35,u(7)*Math.PI*2,(u(8)-.5)*.35);q.setFromEuler(eu);
      m4.compose(new THREE.Vector3(px,py,pz),q,one);
      const stem=new THREE.CylinderGeometry(s*.16,s*.27,stemH,7);
      stem.translate(0,stemH*.5,0);stem.applyMatrix4(m4);stemG.push(stem);
      const cap=new THREE.SphereGeometry(s,10,7,0,Math.PI*2,0,Math.PI*.52);
      cap.scale(1,.5+.4*u(5),1);cap.translate(0,stemH*.92,0);cap.applyMatrix4(m4);capG.push(cap);
      const gill=new THREE.CircleGeometry(s*.85,10);
      gill.rotateX(Math.PI*.5);gill.translate(0,stemH*.9,0);gill.applyMatrix4(m4);gillG.push(gill);
    }
    for(const[gs,mm,sh]of[[stemG,stemM,1],[capG,capM,1],[gillG,gillM,0]]){

  fern(def,groundH){
    const id=def.id??1,fronds=def.fronds??6,size=def.size??.34;
    const pos=[],col=[],idx=[];

        const fx=dx*len/NP,fy=len*(1.02-2.08*t)/NP,fz=dz*len/NP; // rachis tangent

function disposeTree(){
  for(const o of[wood,foliage&&foliage.mesh,blossoms,fruit]){if(o){scene.remove(o);o.geometry.dispose()}}
  for(const mt of[barkMat,leafMat,blossomMat])if(mt)mt.dispose();   // FRUIT_MAT stays cached (material reuse)
  wood=foliage=blossoms=fruit=barkMat=leafMat=blossomMat=null;
}
function disposeEco(){
  const kill=o=>{o.traverse(x=>{if(x.geometry)x.geometry.dispose();if(x.material)x.material.dispose()});scene.remove(o)};
  for(const o of eco)kill(o);
  for(const o of props)kill(o);
  if(ground){kill(ground);ground=null}
  eco=[];props=[];
}
function build(){
  const t0=performance.now();
  disposeTree();
  reseed(seed);
  groundH=makeGroundHeightFn(S,seed);
  const sk=growSkeleton(S,groundH,seed);
  branchMeta=sk.branches.map(b=>{let L=0;for(let i=1;i<b.pts.length;i++)L+=b.pts[i].distanceTo(b.pts[i-1]);
    return{kind:b.kind,depth:b.depth,r0:b.radii[0],len:L}});
  rootLines=[0,0,S.trunk.r0*.8];   // trunk press + every ground-level woody root (for soil-contact bake)
  for(const b of sk.branches)if(b.kind==='root'||b.kind==='prop'){
    for(let i=0;i<b.pts.length;i+=2){const p=b.pts[i];if(p.y<.35)rootLines.push(p.x,p.z,Math.max(b.radii[i]??.02,.02))}
  }
  barkMat=makeBarkMaterial(S,windU);
  leafMat=makeLeafMaterial(S,windU,canopyU);
  blossomMat=makeBlossomMaterial(windU,canopyU);
  const woodGeo=buildWood(sk,S,Qx,groundH);
  wood=new THREE.Mesh(woodGeo,barkMat);
  wood.castShadow=true;wood.receiveShadow=true;
  scene.add(wood);
  foliage=buildFoliage(S,sk.anchors,leafMat,folMul*Qx.sprigMul,Qx.leafDetail??1);
  scene.add(foliage.mesh);
  leafBranch=foliage.leafBranch;
  if(foliage.centroid)canopyU.uCanC.value.copy(foliage.centroid);
  canopyR=foliage.canopyR||1.6;
  blossoms=buildBlossoms(S,sk.anchors,blossomMat,folMul*Qx.sprigMul);
  if(blossoms)scene.add(blossoms);
  fruit=buildFruit(S,sk.anchors,folMul*Qx.sprigMul);   // was built but never wired in — banyan figs live again
  if(fruit)scene.add(fruit);
  buildInfo.ms=Math.round(performance.now()-t0);
  buildInfo.tris=(woodGeo.index.count/3|0)+((foliage.mesh.count*foliage.mesh.geometry.index.count/3)|0)
    +(blossoms?(blossoms.count*blossoms.geometry.index.count/3)|0:0)
    +(fruit?(fruit.count*(fruit.geometry.index?fruit.geometry.index.count:fruit.geometry.attributes.position.count)/3)|0:0);
  fitShadows();
  fitCamera(false);

function buildEnvironment(){
  disposeEco();
  const sc=SCENES[sceneId];
  const eR=mulberry32((seed^0x9e3779b9)>>>0);
  ground=buildGround(groundH,GROUND_R,horU,soilU,rootLines);
  scene.add(ground);
  if(sc.eco){
    const litSpec=sc.litter?Object.assign({},S.litter,sc.litter):S.litter;
    const litter=buildLitter({litter:litSpec},groundH,Math.max(canopyR,1.2),eR,
      Math.round((litSpec?.count??300)*(sc.litterMul??1)*Qx.ecoMul),windU);
    if(litter)eco.push(litter);
    const grass=buildGrass(groundH,eR,Math.round(170*(sc.grassMul??1)*Qx.ecoMul),windU);
    if(grass)eco.push(grass);
    const peb=buildPebbles(groundH,eR,Math.round(46*(sc.pebMul??1)*Qx.ecoMul));
    if(peb)eco.push(peb);
  }
  for(const def of sc.props||[]){
    const b=PROP_BUILDERS[def.type];
    if(b)props.push(b(def,groundH));
  }
  for(const o of[...eco,...props])scene.add(o);

  soilU.uMossA.value=sc.moss??0;
  soilU.uGravelA.value=sc.gravel??0;
  const sv=new THREE.Vector3().copy(sun.position).normalize().negate();
  canopyU.uSunV.value.copy(sv);
  canopyU.uSunC.value.set(sc.sun.color).multiplyScalar(.7*sc.sun.intensity/3);
  canopyU.uEnvI.value=clamp(sc.hemi.intensity*sc.sun.intensity/1.85,.2,1.2);   // V3: foliage fill derived from hemi x sun
  fitShadows();
}
function fitShadows(){
  if(!wood)return;
  const box=new THREE.Box3().setFromObject(wood);
  if(foliage)box.expandByObject(foliage.mesh);
  const s=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3());
  const r=Math.max(s.x,s.y,s.z)*.62+.5;
  const cam=sun.shadow.camera;
  cam.left=-r;cam.right=r;cam.top=r;cam.bottom=-r;
  cam.near=.5;cam.far=20;
  const dir=new THREE.Vector3().copy(sun.position).sub(sun.target.position);
  if(dir.lengthSq()<1e-6)dir.set(-2.4,1.15,1.7);
  dir.normalize();
  sun.target.position.copy(c);
  sun.position.copy(c).addScaledVector(dir,8);
  cam.updateProjectionMatrix();
}

/* orbit camera (custom, dependency-free) */
const orbit={az:.62,el:.28,dist:5.4,tgt:new THREE.Vector3(0,.95,0),
  gAz:.62,gEl:.28,gDist:5.4,gTgt:new THREE.Vector3(0,.95,0)};
if(Q.get('view')){const v=Q.get('view').split(',').map(Number);
  if(v.length>=3){orbit.gAz=orbit.az=v[0];orbit.gEl=orbit.el=v[1];orbit.gDist=orbit.dist=v[2]}
  if(v.length>=6){orbit.gTgt.set(v[3],v[4],v[5]);orbit.tgt.set(v[3],v[4],v[5])}}
function fitCamera(force){
  if(Q.get('view')&&!force)return;
  const box=new THREE.Box3().setFromObject(wood);
  if(foliage&&foliage.mesh.count>0)box.expandByObject(foliage.mesh);
  const s=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3());
  const r=Math.max(s.x,s.z,s.y*1.1)*.5;
  const asp=Math.max(.45,camera.aspect);
  orbit.gDist=clamp(r*(asp<1?2.05:2.35)/Math.min(1,asp*.92)+.6,2.2,14);
  orbit.gTgt.set(c.x*.4,Math.max(.62,c.y*.78),c.z*.4);
  orbit.gEl=.24;
}
function applyOrbit(dt){
  const k=1-Math.exp(-dt*7);
  orbit.az+=(orbit.gAz-orbit.az)*k;
  orbit.el+=(orbit.gEl-orbit.el)*k;
  orbit.dist+=(orbit.gDist-orbit.dist)*k;
  orbit.tgt.lerp(orbit.gTgt,k);
  const ce=Math.cos(orbit.el),se=Math.sin(orbit.el);
  camera.position.set(orbit.tgt.x+Math.cos(orbit.az)*ce*orbit.dist,orbit.tgt.y+se*orbit.dist,orbit.tgt.z+Math.sin(orbit.az)*ce*orbit.dist);
  camera.lookAt(orbit.tgt);
}
{
  const el=renderer.domElement;
  let drag=null,pin=null;
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);
    if(pin===null&&drag===null)drag={id:e.pointerId,x:e.clientX,y:e.clientY};
    else if(drag&&pin===null)pin={id:e.pointerId,x:e.clientX,y:e.clientY,d0:0,dist0:orbit.gDist};});
  el.addEventListener('pointermove',e=>{
    if(pin&&(e.pointerId===pin.id||e.pointerId===drag.id)){
      if(e.pointerId===pin.id){pin.x=e.clientX;pin.y=e.clientY}
      else{drag.x=e.clientX;drag.y=e.clientY}
      const d=Math.hypot(pin.x-drag.x,pin.y-drag.y);
      if(!pin.d0)pin.d0=d;
      else orbit.gDist=clamp(pin.dist0*pin.d0/Math.max(d,10),1.2,20);
      return;
    }
    if(drag&&e.pointerId===drag.id){
      const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
      drag.x=e.clientX;drag.y=e.clientY;
      orbit.gAz+=dx*.0052;
      orbit.gEl=clamp(orbit.gEl+dy*.004,.02,1.35);
    }});
  const end=e=>{if(pin&&e.pointerId===pin.id)pin=null;
    else if(drag&&e.pointerId===drag.id){drag=pin?{id:pin.id,x:pin.x,y:pin.y}:null;pin=null}};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('wheel',e=>{e.preventDefault();orbit.gDist=clamp(orbit.gDist*Math.exp(e.deltaY*.0011),1.2,20)},{passive:false});
  /* picking */
  const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
  let lastTap=0,lastXY=[0,0];
  function pick(e,focus){
    const rect=el.getBoundingClientRect();
    ndc.set((e.clientX-rect.left)/rect.width*2-1,-((e.clientY-rect.top)/rect.height)*2+1);
    ray.setFromCamera(ndc,camera);
    const objs=[wood,foliage&&foliage.mesh,blossoms,ground,...props].filter(Boolean);
    const hits=ray.intersectObjects(objs,true);
    if(!hits.length)return;
    const h=hits[0];
    let label;
    if(h.object===wood){
      const A=wood.geometry.attributes.aInfo;
      const kindId=A.getZ(h.face.a);
      const bid=Math.round(A.getW(h.face.a)/.61);
      const meta=branchMeta[bid];
      const kindN=['trunk','branch','prop root','surface root','aerial root','buttress','strand'][kindId]||'wood';
      const barkN=['banyan (fluted fig)','fissured','smooth','prunus (satin)'][S.bark.family]??'';
      label=`${kindN} · ${barkN} bark`;
      if(meta)label+=`\nbranch #${bid} · order ${meta.depth} · base ⌀ ${(meta.r0*200).toFixed(meta.r0>.05?0:1)}cm · length ${meta.len.toFixed(2)}m`;
    }else if(foliage&&h.object===foliage.mesh){
      const i=h.instanceId,I=foliage.inst;
      const kL=foliage.mesh.geometry.attributes.aLf?Math.round(foliage.mesh.geometry.attributes.aLf.getX(h.face.a)):0;
      const tufts=S.foliage.system==='tufts';
      const bid=leafBranch[i]??0,meta=branchMeta[bid];
      const m4=new THREE.Matrix4(),org=new THREE.Vector3();
      foliage.mesh.getMatrixAt(i,m4);org.setFromMatrixPosition(m4);
      const phW=ihash01(i*13+1)*2,fqW=2.4+2.8*ihash01(i*13+2);
      const at=`\nwind φ ${phW.toFixed(2)}π · ${fqW.toFixed(1)}Hz · flex ${(windU.uWind.value*24).toFixed(0)}%`
        +` · attach (${org.x.toFixed(2)}, ${org.y.toFixed(2)}, ${org.z.toFixed(2)})`;
      if(kL<0){
        label=`sprig #${i} · rachis (shoot axis)${at}\non branch #${bid}${meta?` (order ${meta.depth})`:''}`;
      }else{
        const sun=I.sun[i]||0,sen=I.sen[i]||0,tip=I.tip[i]||0;
        const hh=I.hsl[i*3]||0,ll=I.hsl[i*3+2]||0;
        const chl=Math.round(100*clamp((.45-Math.abs(hh-.33))*2+.1,0,1)*(1-ll*.6));
        const state=sen?'senescing':tip>.8?'young flush':sun>.6?'sun leaf':'shade leaf';
        if(tufts){
          const nT=S.foliage.tuft?.needles??30;
          const lenCm=S.foliage.blade.length*(.75+.5*ihash01(kL*7+3))*(I.scale[i]||1)*100;
          label=`needle ${seed}-${i}.${kL} · shoot ${i}, needle ${kL}/${nT}`
            +`\n${state} · needle ${lenCm.toFixed(1)}cm · sun ${(sun*100).toFixed(0)}% · chlorophyll ~${chl}%`+at
            +`\non branch #${bid}${meta?` (order ${meta.depth}, tip ${(tip*100).toFixed(0)}%)`:''}`;
        }else{
          const nL=S.foliage.sprig?.leaves??6;
          const scK=.72+.5*ihash01(kL*17+9);
          const st=.82+.36*((ihash01(i*13+3)*5.7)%1);
          const lenCm=S.foliage.blade.length*scK*(I.scale[i]||1)*st*100;
          label=`leaf ${seed}-${i}.${kL} · sprig ${i}, leaflet ${kL}/${nL}`
            +`\n${state} · blade ${lenCm.toFixed(1)}cm · sun ${(sun*100).toFixed(0)}% · chlorophyll ~${chl}%`+at
            +`\non branch #${bid}${meta?` (order ${meta.depth}, tip ${(tip*100).toFixed(0)}%)`:''}`;
        }
      }
    }else if(blossoms&&h.object===blossoms){
      const i=h.instanceId,I=blossoms.userData.inst;
      const bud=I.bud[i],bid=blossoms.userData.branch[i],meta=branchMeta[bid];
      const mm=(S.blossom.size??.02)*(I.scale[i]||1)*2000;
      const m4=new THREE.Matrix4(),org=new THREE.Vector3();
      blossoms.getMatrixAt(i,m4);org.setFromMatrixPosition(m4);
      label=`blossom ${seed}-${i} · cluster of ${blossoms.userData.flowers} (5 notched petals, 7 stamens)`
        +`\n${bud?'furled buds (deep pink)':'open bloom'} · flower ⌀ ${mm.toFixed(0)}mm`
        +`\nwind φ ${(ihash01(i*29+1)*2).toFixed(2)}π · ${(2.2+2.4*ihash01(i*29+2)).toFixed(1)}Hz`
        +` · attach (${org.x.toFixed(2)}, ${org.y.toFixed(2)}, ${org.z.toFixed(2)})`
        +`\non branch #${bid}${meta?` (order ${meta.depth})`:''}`;
    }else if(h.object===ground){
      const r=Math.hypot(h.point.x,h.point.z);
      const sc2=SCENES[sceneId];
      const surf=sc2.gravel&&r>.8?'raked gravel':(sc2.moss&&r<1.6?'moss & humus':r<1.2?'root-zone soil':'soil');
      label=`ground · ${surf} · elev ${(h.point.y*100).toFixed(0)}cm`;
    }else{
      let o=h.object,lab=null;
      while(o&&!lab){lab=o.userData&&o.userData.label;o=o.parent}
      label=lab||'prop';
    }
    hud.innerHTML=`<b>${SPECIES[speciesId].name.toLowerCase()}</b> · seed ${seed}\n${label}\n(${h.point.x.toFixed(2)}, ${h.point.y.toFixed(2)}, ${h.point.z.toFixed(2)})`;
    if(focus){
      orbit.gTgt.copy(h.point);
      orbit.gDist=Math.max(1.4,orbit.gDist*.55);
    }
  }
  el.addEventListener('click',e=>{
    const now=performance.now();
    const dbl=now-lastTap<330&&Math.hypot(e.clientX-lastXY[0],e.clientY-lastXY[1])<28;
    lastTap=now;lastXY=[e.clientX,e.clientY];
    pick(e,dbl);
  });
  el.addEventListener('dblclick',e=>pick(e,true));
}

/* panel */
const $=id=>document.getElementById(id);
function updateTitle(){$('p-title').textContent=`${speciesId} ${seed}`;
  $('p-seed').value=seed;}
{
  const selS=$('p-species');
  for(const k in SPECIES){const o=document.createElement('option');o.value=k;o.textContent=SPECIES[k].name;selS.appendChild(o)}
  selS.value=speciesId;
  const selC=$('p-scene');
  for(const k in SCENES){const o=document.createElement('option');o.value=k;o.textContent=SCENES[k].name;selC.appendChild(o)}
  selC.value=sceneId;
  $('p-qual').value=qualityMode;
  $('p-head').addEventListener('click',()=>{
    document.getElementById('panel').classList.toggle('min');
    $('p-chev').textContent=document.getElementById('panel').classList.contains('min')?'▸':'▾';
  });
  if(innerWidth<761)document.getElementById('panel').classList.add('min'),$('p-chev').textContent='▸';
  $('p-grow').addEventListener('click',()=>{seed=$('p-seed').value|0;rebuildAll()});
  $('p-seed').addEventListener('keydown',e=>{if(e.key==='Enter'){seed=$('p-seed').value|0;rebuildAll()}});
  $('p-dice').addEventListener('click',()=>{seed=Math.floor(Math.random()*4294967296)>>>0;rebuildAll()});
  selS.addEventListener('change',()=>{speciesId=selS.value;S=structuredClone(SPECIES[speciesId]);seed=S.seed;rebuildAll()});
  selC.addEventListener('change',()=>{sceneId=selC.value;applyScene();buildEnvironment()});
  $('p-qual').addEventListener('change',()=>{qualityMode=$('p-qual').value;Qx=resolveQuality(qualityMode);
    sun.shadow.mapSize.set(Qx.shadow,Qx.shadow);sun.shadow.map&&(sun.shadow.map.dispose(),sun.shadow.map=null);
    sizeToStage();rebuildAll()});
  $('p-wind').addEventListener('input',()=>{windU.uWind.value=+$('p-wind').value*(S.wind??1);$('p-wind-v').textContent=(+$('p-wind').value).toFixed(2).replace('0.','.')});
  $('p-fol').addEventListener('change',()=>{folMul=+$('p-fol').value;$('p-fol-v').textContent=folMul.toFixed(1);rebuildAll()});
  $('p-fol').addEventListener('input',()=>{$('p-fol-v').textContent=(+$('p-fol').value).toFixed(1)});
}
function rebuildAll(){build();buildEnvironment();applyScene();updateTitle()}

/* resize */
function sizeToStage(){
  const w=Math.max(1,stage.clientWidth),h=Math.max(1,stage.clientHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,Qx.dpr));
  renderer.setSize(w,h);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}
addEventListener('resize',()=>{sizeToStage();fitCamera(false)});

/* checksum: FNV-1a over wood verts + foliage matrices — deterministic witness */
function checksum(){
  let h=0x811c9dc5;
  const mix=v=>{h^=(v|0)&0xff;h=Math.imul(h,0x01000193);h^=((v|0)>>>8)&0xff;h=Math.imul(h,0x01000193)};
  const pa=wood.geometry.attributes.position.array;
  for(let i=0;i<pa.length;i+=7)mix(Math.round(pa[i]*8192));
  if(foliage&&foliage.mesh.count){
    const ma=foliage.mesh.instanceMatrix.array;
    for(let i=0;i<ma.length;i+=5)mix(Math.round(ma[i]*8192));
  }
  return('00000000'+(h>>>0).toString(16)).slice(-8);
}

/* boot */
mark('boot');
sizeToStage();
applyScene();   // lights first (fitShadows no-ops until wood exists)
mark('scene');
build();
mark('built');
buildEnvironment();
applyScene();
mark('env');
windU.uWind.value=(Q.get('wind')!=null?+Q.get('wind'):.35)*(S.wind??1);

/* loop */
const clock=new THREE.Clock();
let fpsA=60,lastStats=0;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.1);
  windU.uT.value+=dt;
  fpsA+=(1/Math.max(dt,1e-4)-fpsA)*.05;
  applyOrbit(dt);
  renderer.render(scene,camera);
  const now=performance.now();
  if(now-lastStats>800){
    lastStats=now;
    statsEl.textContent=`build ${buildInfo.ms}ms · ${(buildInfo.tris/1000).toFixed(0)}k tri · ${renderer.info.render.calls} draws · ${fpsA.toFixed(0)}fps`;
  }
});

/* public handle */
window.v3=window.banyan={
  get spec(){return S},
  get seed(){return seed},
  version:3,
  setSeed(s){seed=s|0;rebuildAll()},
  setSpecies(id){if(!SPECIES[id])return false;speciesId=id;S=structuredClone(SPECIES[id]);seed=S.seed;
    document.getElementById('p-species').value=id;rebuildAll();return true},
  setScene(id){if(!SCENES[id])return false;sceneId=id;document.getElementById('p-scene').value=id;applyScene();buildEnvironment();return true},
  setView(az,el,dist,tx,ty,tz){orbit.gAz=az;orbit.gEl=el;orbit.gDist=dist;orbit.az=az;orbit.el=el;orbit.dist=dist;
    if(tx!=null){orbit.gTgt.set(tx,ty??orbit.gTgt.y,tz??orbit.gTgt.z);orbit.tgt.copy(orbit.gTgt)}},
  setWind(w){windU.uWind.value=w*(S.wind??1)},
  loadSpec(o){deepMerge(S,o);rebuildAll()},
  rebuild(){rebuildAll()},
  checksum,
  stats:()=>({...buildInfo,calls:renderer.info.render.calls,fps:Math.round(fpsA),
    sprigs:foliage?foliage.mesh.count:0,quality:Qx.id,species:speciesId,seed,scene:sceneId}),
  _dbg:()=>({renderer,scene,camera,sun,windU,get wood(){return wood},get ground(){return ground},get foliage(){return foliage}})
};
console.log('[v3r2] ready · species='+speciesId+' seed='+seed+' scene='+sceneId+' · deterministic (seed,spec) engine');
