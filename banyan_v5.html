<!--
  V5 launch candidate · 2026-07-17
  V4 remains untouched. V5 exposes only three selected tree studies; seven rejected
  experiments remain available to the local review harness, not the public selector. A
  V5.3 realism pass replaces Banyan's radial apex whorl with staggered load paths and a
  terminal-covered inner roof, restores full-scale Cherry bloom, and lowers Magnolia's
  evergreen skirt. Seed 863 is the pixel-vetted Banyan default from a 1,000-seed sweep.
  reproducible standalone build. This readable source uses the pinned local Three.js module; run
  tools/build-v5-standalone.mjs to produce the double-clickable offline V5 artifact.
  explicit startup failure UX, semantic controls, and share/reset actions. The
  review-only cameras, scenes, and diagnostics remain gated to local review mode;
  V5 does not claim photorealistic or species-exact simulation.

  banyan-bonsai_v4.html — v4.1 · 2026-07-12 release-audit remediation pass.
  v4.1 executes the "Product Release Visual Audit — Banyan Tree v4" (NO-GO) fix list:
   · F-01 leaf proportions — `widthRatio` is now an explicit FULL width:length contract
     (half-width = 0.5·length·ratio; the audited build used the full product as a
     half-width → blades ~1.32× wider than long). Species tip moved into geometry;
     hi-quality lamina grid floors at 8×4 (was 5×2); a build-time self-test warns on
     contract drift.
   · F-01/F-03 margins — noisy binary fragment `discard` removed: the silhouette IS the
     mesh outline. Serrated species use fwidth-smoothed coverage + alpha-to-coverage.
     Venation/reticulation are band-limited by pixel footprint (no salt-and-pepper),
     vein line widths floor at the footprint and fade instead of crawling.
   · F-02 bark/root/soil — derivative band-limiting (bband) on all fine bark/ground
     frequencies, wrinkle banding halved + warped, occlusion floors lifted (no black
     smear), soil gains a coherent clod/grain/grit height field + close micro-normal,
     roots/props/aerials carry more radial sides, prop basal lobes soften to grip flares.
   · F-03 optics — `gloss` maps to LOW roughness (PBR carries the highlight); the
     synthetic hot glint is demoted to a soft supplementary wax lobe.
   · S-01 sparkle sources — wind unified: custom shadow-depth materials for wood,
     foliage and blossoms run the SAME deform; leaf normals rotate with the blades;
     the custom sun vector is used in view space (was world-vs-view mismatch under
     orbit); mirrored negative-determinant sprig instances removed (gl_FrontFacing).
   · Q-01 architecture — per-scaffold attach/elevation/length jitter, asymmetric
     terminal forks, seeded dome undulation, pruning leaves snag stubs, per-instance
     leaflet pose jitter (the six shared patterns no longer repeat verbatim), props lean.
   · Q-02 mobile hero — portrait framing fits crown width (dominant frame) and fog
     scales with fitted camera distance; the audited containment behaviour is untouched.
  Still required for release sign-off (per audit): continuous fixed-camera captures on
  physical target GPUs at wind 0/.35/1 — the sparkle gate needs real-GPU temporal proof.
  v4.11 (2026-07-15) adds the ?shot= capture helper (landing-page asset harvest):
   shot=png (same-tick toDataURL at shotDpr, auto after shotWait frames) · shot=webm
   (canvas.captureStream + MediaRecorder, shotSec loop) · shot=key (press P = png now,
   V = start/stop webm — for hand-composed close-ups and explore glides). Auto-names
   downloads <species>-<seed>-<scene>-<season>-<label>. App layer only, zero rng draws,
   zero effect when ?shot is absent; see tools/capture-landing.html + site/assets/SHOTLIST.md.
  --- v4 (2026-07-10) fixed the v3 audit: F1 lamina grid, F2 camptodromous venation,
  F3 mobile panel clip, F4 graded senescence, #3 bounded optics. ---
  banyan-bonsai_v3.html — exploratory next-gen one-file prototype (2026-07-08, r2).
  Thesis kept from the playbook: a tree is a pure function of (seed, spec).
  Everything else is presentation. v3 rewrites the presentation layers for
  realism: sprig-based foliage (no flat single cards), plate buttress roots,
  species bark families, ground ecology, and wind. r2 re-audit pass: fluted/
  ropey banyan wood, carved leaf silhouettes with vein relief + translucency,
  notched cherry petals w/ stamen discs, sinewy roots, per-leaf inspection
  data, and 3 new prop-driven scenes (forest floor / autumn park / zen garden).
  Deterministic: one mulberry32 stream for placement, integer-hash noise for detail.
  Deps: three@0.165.0 via CDN import map (same dependency policy as dist).
  Handle: window.v3 (alias window.banyan). URL: ?species=&seed=&scene=&season=&quality=

  html,body{margin:0;height:100%;background:#111;overflow:hidden}
  #stage{position:relative;width:100%;height:100dvh}
  #stage canvas{display:block;touch-action:none}
  .card{position:absolute;z-index:3;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:#28241f;background:rgba(252,250,246,.93);backdrop-filter:blur(8px);
    border:1px solid rgba(0,0,0,.08);border-radius:10px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
  #hud{top:12px;left:12px;padding:8px 11px;pointer-events:none;max-width:62vw;white-space:pre-line}
  #hud .promise{display:block;color:#3f4937;font-weight:700}
  #hud .dim{display:block;color:#6d665b}
  #stats{display:none;bottom:10px;left:12px;padding:4px 9px;color:#6f6a5e;font-size:10px;pointer-events:none}
  body.debug #stats{display:block}
  #panel{top:12px;right:12px;width:260px;padding:0 14px 12px}
  #panel #p-head{width:calc(100% + 28px);font:inherit;font-size:11px;margin:0 -14px 7px;padding:10px 14px 8px;

    justify-content:space-between;align-items:center;border:0;border-radius:10px 10px 0 0;background:transparent;text-align:left}
  #panel #p-head:hover{background:rgba(95,125,67,.08)}
  #panel #p-head b{color:#2f3929}
  #panel #p-head:focus-visible,#panel button:focus-visible,#panel select:focus-visible,#panel input:focus-visible,
  #panel summary:focus-visible{outline:3px solid rgba(67,103,45,.45);outline-offset:2px}
  #panel .row{display:flex;align-items:center;gap:6px;margin:5px 0}
  #panel label{width:66px;color:#655f55;flex:none}
  #panel input[type=number]{width:84px;font:inherit;padding:5px 7px;border:1px solid #c9c4b9;border-radius:6px;background:#fff}
  #panel input[type=range]{flex:1;min-width:0;accent-color:#5f7d43}
  #panel select{flex:1;min-width:0;font:inherit;padding:6px 7px;border:1px solid #c9c4b9;border-radius:6px;background:#fff;color:#2f2b26}
  #panel .val{width:30px;text-align:right;color:#6f6a5e;flex:none}
  #panel button{font:inherit;min-height:34px;padding:6px 9px;border:1px solid #bdb7aa;border-radius:7px;background:#fbfaf7;color:#29251f;cursor:pointer;flex:1}
  #panel button:hover{background:#edf1e8;border-color:#8da176}
  #panel .primary{background:#526b3f;color:#fff;border-color:#526b3f}
  #panel .primary:hover{background:#405731}
  #panel .hint{color:#696359;margin-top:7px;font-size:11px;line-height:1.45}
  #p-latin{margin:1px 0 8px;color:#5f6858}
  #p-latin.experimental{color:#7a492d;font-weight:700}
  #p-status{min-height:1.2em;margin-top:5px;color:#3e5c31}
  #p-link-output{box-sizing:border-box;width:100%;margin-top:5px;padding:7px;border:1px solid #9da891;border-radius:6px;font:inherit}
  #p-advanced{margin-top:8px;border-top:1px solid rgba(0,0,0,.09);padding-top:7px}

  #p-advanced .advanced-grid{padding-top:3px}
  [hidden]{display:none!important}
  #panel.min .body{display:none}
  #boot-status{position:absolute;z-index:10;inset:0;display:grid;place-content:center;gap:12px;text-align:center;
    padding:24px;color:#f7f3e9;background:radial-gradient(circle at 50% 42%,#31392e,#151814 68%);

    border-radius:8px;background:#f7f3e9;color:#1f281c;font:inherit;cursor:pointer}

  @media (max-width:760px){
    #hud{top:10px;left:10px;right:10px;font-size:11px;max-width:none}

<body>
<div id="stage">
  <div id="boot-status" role="status" aria-live="polite"><span id="boot-message">Growing your tree study…</span><button id="boot-retry" type="button" hidden>Reload</button></div>
  <div id="hud" class="card"><span class="promise">A living procedural tree, regenerated exactly from its seed.</span><span class="dim">Drag to orbit · pinch or scroll to zoom · tap for botanical details</span></div>
  <div id="panel" class="card">
    <button id="p-head" type="button" aria-expanded="true" aria-controls="p-body"><span>tree study · <b id="p-title">banyan 126</b></span><span id="p-chev" aria-hidden="true">▾</span></button>
    <div class="body" id="p-body">
      <p id="p-latin" class="hint">Banyan-inspired prop-root canopy · featured study</p>
      <div class="row"><label for="p-species">tree</label><select id="p-species"></select></div>
      <div class="row" id="p-season-row" hidden><label for="p-season">season</label><select id="p-season"></select></div>
      <div class="row"><label for="p-scene">light</label><select id="p-scene"></select></div>
      <div class="row wide"><button id="p-new" class="primary" type="button">new tree</button><button id="p-reset" type="button">reset view</button></div>
      <div class="row wide"><button id="p-share" type="button">copy tree link</button></div>
      <div id="p-status" role="status" aria-live="polite"></div>
      <input id="p-link-output" type="text" readonly hidden aria-label="Specimen link">
      <details id="p-advanced">
        <summary>Advanced controls</summary>
        <div class="advanced-grid">
          <div class="row wide"><label for="p-seed">seed</label><input id="p-seed" type="number" min="0" max="4294967295" step="1" value="126"><button id="p-dice" style="flex:none;width:44px" type="button" title="Generate a random seed" aria-label="Generate a random seed">⚄</button></div>
          <div class="row wide"><button id="p-grow" type="button">regrow seed</button></div>
          <div class="row"><label for="p-qual">quality</label><select id="p-qual"><option value="auto">auto</option><option value="balanced">balanced</option><option value="high">high</option><option value="mobile">mobile</option></select></div>
          <div class="row"><label for="p-wind">wind</label><input id="p-wind" type="range" min="0" max="1" step="0.01" value="0.22"><span class="val" id="p-wind-v">.22</span></div>
          <div class="row" hidden><label for="p-age">age</label><input id="p-age" type="range" min="25" max="120" step="5" value="100"><span class="val" id="p-age-v">100</span></div>
          <div class="row" hidden><label for="p-fol">foliage</label><input id="p-fol" type="range" min="0" max="1.4" step="0.05" value="1"><span class="val" id="p-fol-v">1.0</span></div>
          <button id="p-inside" type="button" hidden>inside the crown · auto</button>
          <button id="p-explore" type="button" hidden>explore · monkey cam</button>
        </div>
      </details>
    </div>
  </div>
  <div id="stats" class="card"></div>
</div>
<script>
  (()=>{
    const box=document.getElementById('boot-status'),msg=document.getElementById('boot-message'),retry=document.getElementById('boot-retry');
    window.__treeBootFail=()=>{if(!box)return;box.hidden=false;msg.textContent='The tree renderer stopped before its first frame. This is a loading or browser error, not a verdict on your hardware. Reload once; if it repeats, check the browser console.';retry.hidden=false};
    const watchdog=setTimeout(window.__treeBootFail,8000);window.__treeBootReady=()=>clearTimeout(watchdog);
    addEventListener('error',window.__treeBootFail);addEventListener('unhandledrejection',window.__treeBootFail);
    retry.addEventListener('click',()=>location.reload());
  })();
</script>
