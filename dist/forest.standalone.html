// src/species.js
var SPECIES = {
  "banyan": { name: "Banyan", spec: banyan_treespec_default, tier: "core" },
  "dead-winter-oak": { name: "Dead Winter Oak", spec: dead_winter_oak_treespec_default, tier: "free" },
  "english-oak": { name: "English Oak", spec: english_oak_treespec_default, tier: "dlc" },
  "cherry-blossom": { name: "Cherry Blossom", spec: cherry_blossom_treespec_default, tier: "dlc" },
  "baobab": { name: "Baobab", spec: baobab_treespec_default, tier: "dlc" },
  "black-pine": { name: "Japanese Black Pine", spec: black_pine_treespec_default, tier: "dlc" },
  "weeping-willow": { name: "Weeping Willow", spec: weeping_willow_treespec_default, tier: "dlc" }
};

// src/forest.js
var GAP = 4.6;
var LEAF_CAP = 3600;
var RADIAL_SEGS = 26;
var stage = document.getElementById("stage");
var hud = document.getElementById("hud");
var labels = document.getElementById("labels");
var renderer = new THREE5.WebGLRenderer({
  antialias: true,
  preserveDrawingBuffer: false,
  // avoids the Chrome present-path black strobe
  powerPreference: "high-performance"
  // pin the discrete GPU on dual-GPU laptops
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(16777215, 1);
renderer.toneMapping = THREE5.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE5.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
var scene = new THREE5.Scene();
var camera = new THREE5.PerspectiveCamera(45, 1, 0.1, 200);
var controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3;
controls.maxDistance = 90;
controls.maxPolarAngle = Math.PI * 0.52;
var key = new THREE5.DirectionalLight(16773602, 2.9);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -3e-4;
key.shadow.normalBias = 0.05;
scene.add(key, key.target);
var KEY_DIR = new THREE5.Vector3(4.2, 7.5, 3.2).normalize();
scene.add(new THREE5.HemisphereLight(15791354, 14275528, 0.5));
var pmrem = new THREE5.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
var shadowPlane = new THREE5.Mesh(
  new THREE5.PlaneGeometry(200, 200).rotateX(-Math.PI / 2),
  new THREE5.ShadowMaterial({ opacity: 0.12 })
);
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);
var leafMat = makeLeafMaterial();
var blossomMat = null;
var forest = new THREE5.Group();
scene.add(forest);
var ids = Object.keys(SPECIES);
var trees = [];
var totalLeaves = 0;
var totalBranches = 0;
var drawCalls = 0;
ids.forEach((id, i) => {
  const sp = SPECIES[id];
  const S = structuredClone(sp.spec);
  reseed(S.seed);
  const sk = growSkeleton(S);
  const g = new THREE5.Group();
  const wood = new THREE5.Mesh(buildWoodGeometry(sk.branches, RADIAL_SEGS), makeBarkMaterial(S));
  wood.castShadow = true;
  wood.receiveShadow = true;
  g.add(wood);
  drawCalls++;
  const built = buildLeaves(S, sk.anchors, leafMat, LEAF_CAP);
  built.leaves.castShadow = true;
  built.leaves.receiveShadow = true;
  g.add(built.leaves);
  if (built.leaves.count > 0) drawCalls++;
  totalLeaves += built.leaves.count;
  if (S.blossom) {
    blossomMat = blossomMat || makeBlossomMaterial();
    const bl = buildBlossoms(S, sk.anchors, blossomMat, LEAF_CAP);
    if (bl) {
      bl.castShadow = true;
      g.add(bl);
      drawCalls++;
    }
  }
  const x = (i - (ids.length - 1) / 2) * GAP;
  const yaw = (i * 2654435761 >>> 0) / 4294967296 * Math.PI * 2;
  g.position.set(x, 0, (i % 2 ? 1 : -1) * 0.35);
  g.rotation.y = yaw;
  forest.add(g);
  trees.push({ id, name: sp.name, x, z: g.position.z });
  totalBranches += sk.branches.length;
});
forest.updateMatrixWorld(true);
var forestBox = new THREE5.Box3().setFromObject(forest);
var sphere = forestBox.getBoundingSphere(new THREE5.Sphere());
(function fitShadow() {
  const c = sphere.center, r = Math.max(1, sphere.radius);
  const dist = Math.max(12, r * 2);
  key.position.copy(c).addScaledVector(KEY_DIR, dist);
  key.target.position.copy(c);
  key.target.updateMatrixWorld();
  const cam = key.shadow.camera, m = r * 1.05;
  cam.left = -m;
  cam.right = m;
  cam.top = m;
  cam.bottom = -m;
  cam.near = Math.max(0.5, dist - r * 1.3);
  cam.far = dist + r * 1.3 + Math.max(0, forestBox.max.y) / Math.max(0.2, KEY_DIR.y);
  cam.updateProjectionMatrix();
})();
var framed = false;
function frameForest() {
  const c = sphere.center, r = sphere.radius;
  const fov = camera.fov * Math.PI / 180;
  const fitH = r / Math.sin(fov / 2);
  const fitW = r / Math.sin(Math.atan(Math.tan(fov / 2) * camera.aspect));
  const dist = 1.08 * Math.max(fitH, fitW);
  controls.target.set(c.x, Math.max(0.6, c.y * 0.85), c.z);
  camera.position.set(c.x + dist * 0.16, c.y + r * 0.34, c.z + dist);
  controls.update();
  framed = true;
}
function resize() {
  const w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (!framed) frameForest();
}
window.addEventListener("resize", resize);
resize();
var labelDivs = trees.map((t) => {
  const d = document.createElement("div");
  d.className = "label";
  d.textContent = t.name;
  labels.appendChild(d);
  return d;
});
var _v = new THREE5.Vector3();
function updateLabels() {
  const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight;
  for (let i = 0; i < trees.length; i++) {
    _v.set(trees[i].x, -0.12, trees[i].z).project(camera);
    const behind = _v.z > 1;
    const px = (_v.x * 0.5 + 0.5) * w, py = (-_v.y * 0.5 + 0.5) * h;
    const d = labelDivs[i];
    d.style.transform = `translate(-50%, 0) translate(${px.toFixed(1)}px, ${py.toFixed(1)}px)`;
    d.style.opacity = behind ? "0" : "1";
  }
}
hud.innerHTML = `FOREST \xB7 ${trees.length} species
${totalBranches} branches \xB7 ${totalLeaves.toLocaleString()} leaves \xB7 ~${drawCalls} draw calls
<span class="dim">drag to orbit \xB7 scroll to zoom</span>`;
console.log(`[forest] ${trees.length} species | ${totalBranches} branches | ${totalLeaves} leaves | ~${drawCalls} draw calls`);
var sunView = new THREE5.Vector3();
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  const sh = leafMat.userData.shader;
  if (sh) {
    sunView.copy(key.position).sub(key.target.position).normalize().transformDirection(camera.matrixWorldInverse);
    sh.uniforms.uSunView.value.copy(sunView);
  }
  updateLabels();
  renderer.render(scene, camera);
}
animate();
window.forest = { scene, camera, controls, renderer, trees, species: ids, frameForest };
</script>
