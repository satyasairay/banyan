<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Banyan Forest — every species side by side</title>
<style>
  html, body { margin:0; padding:0; background:#ffffff; height:100%; }
  #stage { position:relative; width:100%; height:100vh; overflow:hidden; }
  #stage canvas { display:block; }
  #hud {
    position:absolute; top:14px; left:14px; z-index:2;
    font:12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color:#3a3a3a; background:rgba(255,255,255,0.85);
    border:1px solid #e8e8e5; border-radius:6px;
    padding:9px 12px; pointer-events:none; white-space:pre;
  }
  #hud .dim { color:#a2a29e; }
  /* projected species labels — one per tree, positioned each frame from JS */
  #labels { position:absolute; inset:0; z-index:1; pointer-events:none; }
  #labels .label {
    position:absolute; top:0; left:0; will-change:transform, opacity;
    font:11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color:#4a4a46; background:rgba(255,255,255,0.82);
    border:1px solid #e8e8e5; border-radius:5px;
    padding:4px 8px; white-space:nowrap;
    transition:opacity 0.15s ease;
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="stage">
  <div id="labels"></div>
  <div id="hud"><span class="dim">growing the forest&hellip;</span></div>
</div>
<script type="module">
%%BUNDLE%%
</script>
</body>
</html>
