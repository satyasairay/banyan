<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Banyan · 02 · custom TreeSpec</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; font: 13px ui-monospace, monospace; color: #333; }
  #stage { position: absolute; inset: 0; }
  #ui { position: absolute; top: 12px; left: 12px; z-index: 2; background: rgba(255,255,255,.9);
        border: 1px solid #e6e6e3; border-radius: 8px; padding: 10px 12px; max-width: 260px; }
  #ui h1 { font-size: 12px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .04em; color: #6a6a66; }
  #ui button { font: inherit; margin: 3px 4px 0 0; padding: 4px 8px; border: 1px solid #cfcfca;
               border-radius: 5px; background: #fbfbfa; cursor: pointer; }
  #ui p { margin: 8px 0 0; color: #8a8a86; font-size: 11px; line-height: 1.5; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="stage"></div>
<div id="ui">
  <h1>02 · custom spec</h1>
  <button data-v="default">banyan (default)</button>
  <button data-v="autumn">autumn recolor</button>
  <button data-v="sparse">sparse + tall</button>
  <button data-v="dense">dense canopy</button>
  <p>A species is just data. Each button clones the banyan <b>TreeSpec</b>, edits a few
     numbers, and regrows deterministically from the seed.</p>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { reseed, growSkeleton, buildWoodGeometry, makeBarkMaterial, makeLeafMaterial,
         buildLeaves, createSceneRig, SCENES, SPECIES } from '../../dist/banyan.module.js';

/* ---- minimal viewer (shared by examples 02–04) ---- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setClearColor(0xffffff, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
camera.position.set(3.05, 2.0, 4.95);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.88, 0); controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 1.6; controls.maxDistance = 28; controls.maxPolarAngle = Math.PI * 0.55;

const leafMat = makeLeafMaterial();
let wood, barkMat, leaves;
const rig = createSceneRig({ renderer, scene, camera, controls, leafMat,
  getTree: () => ({ wood, barkMat, leaves }), regradeLeaves: () => {} });

function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); rig.setSize(w, h);
}
addEventListener('resize', resize);

function build(spec){
  if (wood) { scene.remove(wood); wood.geometry.dispose(); }
  if (barkMat) barkMat.dispose();
  if (leaves) { scene.remove(leaves); leaves.geometry.dispose(); }
  reseed(spec.seed);                                   // determinism: seed drives everything
  const sk = growSkeleton(spec);
  barkMat = makeBarkMaterial(spec);
  wood = new THREE.Mesh(buildWoodGeometry(sk.branches, 26), barkMat);
  wood.castShadow = wood.receiveShadow = true; scene.add(wood);
  leaves = buildLeaves(spec, sk.anchors, leafMat).leaves; scene.add(leaves);
  rig.fitShadows(); rig.applyTreeOverrides();
}

const sunDir = new THREE.Vector3(), sunView = new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  const sh = leafMat.userData.shader;
  if (sh && rig.keyLight){                              // leaf backlight follows the scene key
    sunDir.copy(rig.keyLight.position).sub(rig.keyLight.target.position).normalize();
    sunView.copy(sunDir).transformDirection(camera.matrixWorldInverse);
    sh.uniforms.uSunView.value.copy(sunView);
    sh.uniforms.uSunColor.value.copy(rig.backlightColor);
  }
  rig.update(performance.now()); rig.render();
}

/* ---- the twist: edit the spec ---- */
function variant(name){
  const s = structuredClone(SPECIES['banyan'].spec);     // start from the banyan defaults
  s.seed = 1892;
  if (name === 'autumn'){
    s.foliage.palette.h = 0.09;                          // green -> amber hue
    s.foliage.palette.s = [0.65, 0.85];
    s.foliage.palette.senescent.rate = 0.5;              // half the leaves turned
  } else if (name === 'sparse'){
    s.leafCount = 2600; s.trunk.height = 1.5; s.recursion.maxDepth = 3;
  } else if (name === 'dense'){
    s.leafCount = 11000;
  }
  return s;
}

resize();
rig.apply(SCENES['white-studio']);
build(variant('default'));
animate();
document.querySelectorAll('#ui button').forEach(b =>
  b.addEventListener('click', () => build(variant(b.dataset.v))));
</script>
</body>
</html>
